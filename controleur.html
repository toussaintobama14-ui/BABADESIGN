<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Baba Design — Test Contrôleur</title>

<style>
body{
  font-family:Arial,sans-serif;
  background:#f4f5f7;
  margin:0;
  padding:20px;
  color:#111;
}

.box{
  max-width:800px;
  margin:auto;
  background:#fff;
  padding:24px;
  border-radius:18px;
  box-shadow:0 10px 30px #0002;
}

h1{
  margin-top:0;
}

.ok{
  color:#087a35;
  margin:12px 0;
}

.err{
  color:#b00020;
  background:#fff0f0;
  padding:12px;
  border-radius:10px;
  margin:12px 0;
}

button{
  padding:12px 16px;
  border:0;
  border-radius:10px;
  background:#e60000;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

pre{
  white-space:pre-wrap;
  word-break:break-word;
  background:#111;
  color:#fff;
  padding:15px;
  border-radius:10px;
  margin-top:8px;
}
</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

<div class="box">

<h1>🔧 Test Contrôleur Baba Design</h1>

<p>
Cette page sert uniquement à diagnostiquer pourquoi les commandes
ne s'affichent pas dans le contrôleur.
</p>

<button id="test">
Lancer le test
</button>

<div id="result">
<p>Appuie sur « Lancer le test ».</p>
</div>

</div>

<script>

const SUPABASE_URL =
"https://drvcneeaothydjmqpdzg.supabase.co";

const SUPABASE_KEY =
"sb_publishable_k8DUVt12k1GN4n7yiYBnYw_gXltrpmp";

const sb =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY,
  {
    auth:{
      persistSession:true,
      autoRefreshToken:true,
      detectSessionInUrl:true
    }
  }
);

const out =
document.getElementById("result");


function escapeHtml(value){

  return String(value ?? "")
    .replace(/[<>&]/g,function(c){

      return {
        "<":"&lt;",
        ">":"&gt;",
        "&":"&amp;"

      }[c];

    });

}


function show(title,ok,details=""){

  out.innerHTML += `

    <div class="${ok ? "ok" : "err"}">

      <b>${escapeHtml(title)}</b>

      <br>

      ${ok ? "✅ OK" : "❌ ERREUR"}

      ${
        details
        ?
        `<pre>${escapeHtml(details)}</pre>`
        :
        ""
      }

    </div>

  `;

}


async function run(){

  out.innerHTML = "";

  /*
  =========================================
  1 — TEST SUPABASE
  =========================================
  */

  show(
    "Connexion Supabase",
    true,
    SUPABASE_URL
  );


  try{

    /*
    =========================================
    2 — TEST UTILISATEUR CONNECTÉ
    =========================================
    */

    const {
      data:{user},
      error
    } =
    await sb.auth.getUser();


    if(error){

      throw error;

    }


    show(
      "Utilisateur connecté",
      !!user,

      user

      ?

      (
        "ID : "
        + user.id
        + "\nEmail : "
        + (user.email || "non affiché")
      )

      :

      "AUCUN UTILISATEUR CONNECTÉ"
    );


    if(!user){

      return;

    }


    /*
    =========================================
    3 — TEST IS_CONTROLLER
    =========================================
    */

    const controller =
    await sb.rpc(
      "is_controller"
    );


    show(

      "RPC is_controller",

      !controller.error,

      controller.error

      ?

      controller.error.message

      :

      (
        "Résultat : "
        +
        JSON.stringify(
          controller.data,
          null,
          2
        )
      )

    );


    if(controller.error){

      return;

    }


    /*
    =========================================
    4 — TEST DASHBOARD
    =========================================
    */

    const dashboard =
    await sb.rpc(
      "controller_get_dashboard"
    );


    show(

      "RPC controller_get_dashboard",

      !dashboard.error,

      dashboard.error

      ?

      dashboard.error.message

      :

      JSON.stringify(
        dashboard.data,
        null,
        2
      )

    );


    if(dashboard.error){

      return;

    }


    /*
    =========================================
    5 — EXTRACTION DES DONNÉES
    =========================================
    */

    const orders =
      Array.isArray(
        dashboard.data?.orders
      )

      ?

      dashboard.data.orders

      :

      [];


    const files =
      Array.isArray(
        dashboard.data?.files
      )

      ?

      dashboard.data.files

      :

      [];


    const chats =
      Array.isArray(
        dashboard.data?.conversations
      )

      ?

      dashboard.data.conversations

      :

      [];


    /*
    =========================================
    6 — RÉSULTATS
    =========================================
    */

    show(

      "Commandes reçues",

      true,

      "Nombre : "
      +
      orders.length

    );


    show(

      "Fichiers reçus",

      true,

      "Nombre : "
      +
      files.length

    );


    show(

      "Conversations reçues",

      true,

      "Nombre : "
      +
      chats.length

    );


  }

  catch(e){

    show(

      "Erreur générale",

      false,

      e?.message || String(e)

    );

  }

}


/*
=========================================
BOUTON TEST
=========================================
*/

document
.getElementById("test")
.onclick = run;

</script>

</body>
</html>
