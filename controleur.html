<script>

const SUPABASE_URL =
  "https://drvcneeaothydjmqpdzg.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_k8DUVt12k1GN4n7yiYBnYw_gXltrpmp";

const BUCKET =
  "client-files";


/* =========================
   NOTIFICATIONS CONVERSATIONS
   ========================= */

const CHAT_READ_KEY = "baba_controller_chat_read_v1";

function getChatReadMap(){
  try{
    const raw = localStorage.getItem(CHAT_READ_KEY);
    const parsed = raw ? JSON.parse(raw) : {};
    return parsed && typeof parsed === "object" ? parsed : {};
  }catch{
    return {};
  }
}

function saveChatReadMap(map){
  try{
    localStorage.setItem(CHAT_READ_KEY, JSON.stringify(map));
  }catch{}
}

function chatHasNewMessage(conversation){
  if(!conversation?.id || !conversation?.last_message_at)
    return false;

  const readMap = getChatReadMap();
  const lastRead = readMap[String(conversation.id)];

  if(!lastRead)
    return true;

  return new Date(conversation.last_message_at).getTime() >
         new Date(lastRead).getTime();
}

function markChatRead(conversationId,lastMessageAt){
  if(!conversationId) return;
  const map = getChatReadMap();
  map[String(conversationId)] =
    lastMessageAt || new Date().toISOString();
  saveChatReadMap(map);
}


const sb =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY,
    {
      auth:{
        persistSession:true,
        autoRefreshToken:true,
        detectSessionInUrl:true
      }
    }
  );


const $ =
  id =>
    document.getElementById(id);


function esc(v){

  return String(v ?? "")
    .replace(
      /[&<>'"]/g,
      c => ({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        "'":"&#39;",
        '"':"&quot;"
      }[c])
    );
}


function fmt(d){

  if(!d)
    return "—";

  try{
    return new Date(d)
      .toLocaleString("fr-FR");
  }catch{
    return "—";
  }
}


function wait(
  on,
  text="Traitement…"
){

  $("loadingText")
    .textContent = text;

  $("loading")
    .classList.toggle(
      "show",
      on
    );
}


/* =========================
   CONTROLLER
========================= */

async function controllerGuard(){

  const {
    data:{user},
    error:userError
  } =
    await sb.auth.getUser();

  if(
    userError ||
    !user
  ){
    return false;
  }

  const {
    data,
    error
  } =
    await sb.rpc(
      "is_controller"
    );

  if(
    error ||
    data !== true
  ){
    return false;
  }

  return true;
}


/* =========================
   DASHBOARD
========================= */

async function getDashboard(){

  const {
    data,
    error
  } =
    await sb.rpc(
      "controller_get_dashboard"
    );

  if(error)
    throw error;

  const result =
    data &&
    typeof data === "object"
      ? data
      : {};

  return {

    orders:
      Array.isArray(
        result.orders
      )
        ? result.orders
        : [],

    files:
      Array.isArray(
        result.files
      )
        ? result.files
        : [],

    conversations:
      Array.isArray(
        result.conversations
      )
        ? result.conversations
        : []

  };
}


/* =========================
   STATS
========================= */

async function refreshStats(){

  refreshWebBadge();

  try{

    const d =
      await getDashboard();

    $("statOrders")

      d.orders.length;

    $("statPaid")

      .textContent="!";

    $("statFiles")
      .textContent="!";

    $("statChats")
      .textContent="!";
  }
}


/* =========================
   FICHIER PRIVÉ
========================= */

async function downloadFile(
  path,
  fileName="fichier"
){

  if(!path){
    alert("Fichier introuvable.");
    return;
  }

  try{
    const {data,error}=await sb.storage
      .from(BUCKET)
      .createSignedUrl(path,300);

    if(error) throw error;
    if(!data?.signedUrl) throw new Error("Impossible de créer le lien du fichier.");

    // Téléchargement direct du fichier.
    const response=await fetch(data.signedUrl);
    if(!response.ok) throw new Error("Le téléchargement du fichier a échoué.");

    const blob=await response.blob();
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url;
    a.download=fileName || "fichier";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
  }catch(e){
    // Fallback : ouvrir le fichier si le navigateur bloque le téléchargement direct.
    try{
      const {data,error}=await sb.storage
        .from(BUCKET)
        .createSignedUrl(path,300);
      if(error) throw error;
      if(data?.signedUrl) window.open(data.signedUrl,"_blank");
      else throw new Error("Lien du fichier indisponible.");
    }catch(err){
      alert("❌ "+(err.message || e.message));
    }
  }
}


/* =========================
   PAYMENT LABEL
========================= */

function paymentLabel(
  status
){

  const s =
    String(
      status || "pending"
    ).toLowerCase();

  if(
    s === "approved"
  ){

    return `
      <span class="pill approved">
        PAIEMENT VALIDÉ
      </span>
    `;
  }

  if(
    s === "rejected"
  ){

    return `
      <span class="pill rejected">
        PAIEMENT REFUSÉ
      </span>
    `;
  }

  return `
    <span class="pill pending">
      EN ATTENTE
    </span>
  `;
}


/* =========================
   COMMANDES
========================= */

function orderHtml(
  o,
  files
){

  const paymentStatus =
    String(
      o.payment_status ||
      "pending"
    ).toLowerCase();


  const proof =
    files.find(
      f =>
        String(
          f.order_id || ""
        ) ===
        String(
          o.id || ""
        )
        &&
        String(
          f.kind || ""
        ).toLowerCase()
        === "payment_proof"
    );


  const progress =
    Math.max(
      0,
      Math.min(
        100,
        Number(
          o.progress || 0
        )
      )
    );


  const client =
    o.client_name ||
    o.full_name ||
    o.name ||
    "Client";


  let html = "";


  html += `
    <div class="item">

      <div class="row">

        <div>

          <b style="font-size:17px">
            ${esc(
              o.service_name ||
              "Commande"
            )}
          </b>

          <div
            style="
              font-size:11px;
              color:#777;
              margin-top:4px
            "
          >
            ID :
            ${esc(
              o.id || "—"
            )}
          </div>

        </div>

        ${paymentLabel(
          paymentStatus
        )}

      </div>
  `;


  html += `
    <p
      style="
        color:#777;
        font-size:12px;
        margin-top:8px
      "
    >
      Client :
      <strong>
        ${esc(client)}
      </strong>

      ·

      ${fmt(
        o.created_at
      )}
    </p>
  `;


  if(
    o.description
  ){

    html += `
      <div
        style="
          margin:10px 0;
          padding:12px;
          border-radius:13px;
          background:#f7f7f8
        "
      >

        <b>Description</b>
        <br>

        <span
          style="font-size:13px"
        >
          ${esc(
            o.description
          )}
        </span>

      </div>
    `;
  }


  if(
    o.price_htg !==
      undefined &&
    o.price_htg !== null
  ){

    html += `
      <p>
        <b>
          Montant :
          ${esc(
            o.price_htg
          )}
          HTG
        </b>
      </p>
    `;
  }


  /* PREUVE */

  if(proof){

    html += `
      <div
        style="
          margin:10px 0;
          padding:12px;
          border:1px solid #eee;
          border-radius:13px;
          background:#fafafa
        "
      >

        <b>
          📸 Preuve de paiement
        </b>

        <div
          style="
            font-size:12px;
            color:#777;
            margin:5px 0 9px
          "
        >
          ${esc(
            proof.file_name ||
            "preuve"
          )}
        </div>

        <button
          class="btn sm"
          data-dl="${esc((proof.storage_path || "").trim())}"
          data-dl-name="${esc(proof.file_name || "preuve")}"
        >
          Voir / télécharger
        </button>

      </div>
    `;

  }else{

    html += `
      <div class="notice">
        <b>
          ⚠️ Aucune preuve
          de paiement jointe.
        </b>
      </div>
    `;
  }


  /* PROGRESSION */

  html += `

    <div
      class="row"
      style="margin-top:14px"
    >

      <strong>
        Progression :

        <span
          id="progressText_${esc(
            o.id
          )}"
        >
          ${progress}%
        </span>

      </strong>

      <span
        style="
          font-size:12px;
          color:#777
        "
      >
        ${esc(
          o.status ||
          "En attente de validation"
        )}
      </span>

    </div>

    <div class="bar">

      <div
        class="fill"
        id="fill_${esc(
          o.id
        )}"
        style="
          width:${progress}%
        "
      ></div>

    </div>

    <input
      class="range"
      type="range"
      min="0"
      max="100"
      value="${progress}"
      data-progress="${esc(
        o.id
      )}"
    >

  `;


  /* ACTIONS */

  html += `

    <div class="actions">

      <button
        class="btn green"
        data-ok="${esc(
          o.id
        )}"
      >
        ✓ Valider paiement
      </button>

      <button
        class="btn red"
        data-no="${esc(
          o.id
        )}"
      >
        ✕ Refuser
      </button>

      <button
        class="btn chatbtn"
        data-order-chat="${esc(
          o.user_id ||
          ""
        )}"
      >
        💬 Écrire
      </button>

      <button
        class="btn delete-order"
        data-delete-order="${esc(
          o.id ||
          ""
        )}"
      >
        🗑 Effacer commande
      </button>

    </div>

  `;


  if(
    o.rejection_reason
  ){

    html += `
      <div
        style="
          margin-top:10px;
          padding:10px;
          border-radius:12px;
          background:#fff1f1;
          color:#9d0000;
          font-size:12px
        "
      >

        <b>
          Motif actuel :
        </b>

        ${esc(
          o.rejection_reason
        )}

      </div>
    `;
  }


  html += `
    </div>
  `;


  return html;
}


/* =========================
   CLIENTS / PROFILS
========================= */

const clientNameCache = new Map();

async function getClientProfile(userId){

  if(!userId) return null;

  const key = String(userId);

  if(clientNameCache.has(key))
    return clientNameCache.get(key);

  const {data,error} = await sb
    .from("profiles")
    .select("full_name,phone,email")
    .eq("id",userId)
    .maybeSingle();

  if(error){
    console.warn("Profil client:",error.message);
    return null;
  }

  clientNameCache.set(key,data || null);
  return data || null;
}

async function enrichClientNames(orders){

  const list = Array.isArray(orders) ? orders : [];

  await Promise.all(
    list.map(async o => {
      if(!o.user_id) return;

      const profile = await getClientProfile(o.user_id);

      if(profile){
        o.client_name =
          profile.full_name ||
          o.client_name ||
          "Client";

        o.client_phone =
          profile.phone ||
          o.client_phone ||
          "";

        o.client_email =
          profile.email ||
          o.client_email ||
          "";
      }
    })
  );

  return list;
}


/* =========================
   RENDER COMMANDES
========================= */

async function renderOrders(){

  const app =
    $("content");

  app.innerHTML = `
    <div class="empty">
      Chargement…
    </div>
  `;


  try{

    const d =
      await getDashboard();

    await enrichClientNames(d.orders);


    if(
      !d.orders.length
    ){

      app.innerHTML = `
        <div class="empty">
          Aucune commande.
        </div>
      `;

      return;
    }


    app.innerHTML =
      d.orders
        .map(
          o =>
            orderHtml(
              o,
              d.files
            )
        )
        .join("");


    /* PREUVES */

    app
      .querySelectorAll(
        "[data-dl]"
      )
      .forEach(
        btn => {

          btn.onclick =
            () =>
              downloadFile(
                btn.dataset.dl,
                btn.dataset.dlName
              );

        }
      );


    /* VALIDATION */

    app
      .querySelectorAll(
        "[data-ok]"
      )
      .forEach(
        btn => {

          btn.onclick =
            async () => {

              if(
                !confirm(
                  "Confirmer la validation du paiement ?"
                )
              )
                return;


              try{

                wait(
                  true,
                  "Validation du paiement…"
                );


                const {
                  error
                } =
                  await sb.rpc(
                    "controller_approve_order",
                    {
                      p_order_id:
                        btn.dataset.ok
                    }
                  );


                if(error)
                  throw error;


                alert(
                  "✅ Paiement validé avec succès."
                );


                await refreshStats();
                await renderOrders();


              }catch(e){

                alert(
                  "❌ " +
                  e.message
                );

              }finally{

                wait(false);

              }

            };

        }
      );


    /* REFUS */

    app
      .querySelectorAll(
        "[data-no]"
      )
      .forEach(
        btn => {

          btn.onclick =
            async () => {

              const reason =
                prompt(
                  "Pourquoi voulez-vous refuser cette commande ?"
                );


              if(
                reason === null
              )
                return;


              try{

                wait(
                  true,
                  "Refus de la commande…"
                );


                const {
                  error
                } =
                  await sb.rpc(
                    "controller_reject_order",
                    {
                      p_order_id:
                        btn.dataset.no,

                      p_reason:
                        reason
                    }
                  );


                if(error)
                  throw error;


                alert(
                  "Commande refusée."
                );


                await refreshStats();
                await renderOrders();


              }catch(e){

                alert(
                  "❌ " +
                  e.message
                );

              }finally{

                wait(false);

              }

            };

        }
      );


    /* ÉCRIRE AU CLIENT */

    app
      .querySelectorAll("[data-order-chat]")
      .forEach(btn => {

        btn.onclick = async () => {

          const userId = btn.dataset.orderChat;

          if(!userId){
            alert("Ce client n'a pas d'identifiant de compte.");
            return;
          }

          try{

            wait(true,"Recherche de la conversation…");

            const current = await getDashboard();

            const conversation =
              current.conversations.find(
                c => String(c.user_id || "") === String(userId)
              );

            if(!conversation){
              alert("Aucune conversation n'existe encore pour ce client.");
              return;
            }

            await openChat(conversation.id);

          }catch(e){

            alert("❌ " + e.message);

          }finally{

            wait(false);

          }
        };

      });


    /* EFFACER COMMANDE */

    app
      .querySelectorAll("[data-delete-order]")
      .forEach(btn => {

        btn.onclick = async () => {

          const orderId = btn.dataset.deleteOrder;

          if(!orderId) return;

          if(!confirm(
            "⚠️ Voulez-vous vraiment effacer cette commande ?\n\nLa commande sera supprimée de Supabase ainsi que ses fichiers liés."
          )) return;

          try{

            wait(true,"Suppression de la commande…");

            const {error} = await sb.rpc(
              "controller_delete_order",
              {p_order_id:orderId}
            );

            if(error) throw error;

            alert("✅ Commande effacée avec succès.");

            await refreshStats();
            await renderOrders();

          }catch(e){

            alert("❌ Impossible d'effacer la commande : " + e.message);

          }finally{

            wait(false);

          }
        };

      });


    /* PROGRESSION */

    app
      .querySelectorAll(
        "[data-progress]"
      )
      .forEach(
        range => {

          range.oninput =
            () => {

              const id =
                range.dataset.progress;

              const value =
                Number(
                  range.value
                );


              const text =
                document.getElementById(
                  "progressText_" +
                  id
                );

              const fill =
                document.getElementById(
                  "fill_" +
                  id
                );


              if(text)
                text.textContent =
                  value + "%";

              if(fill)
                fill.style.width =
                  value + "%";
            };


          range.onchange =
            async () => {

              try{

                const {
                  error
                } =
                  await sb.rpc(
                    "controller_set_order_progress",
                    {
                      p_order_id:
                        range.dataset.progress,

                      p_progress:
                        Number(
                          range.value
                        )
                    }
                  );


                if(error)
                  throw error;


              }catch(e){

                alert(
                  "❌ " +
                  e.message
                );

                await renderOrders();
              }

            };

        }
      );


  }catch(e){

    console.error(e);

    app.innerHTML = `
      <div class="empty">
        <b>Erreur</b>
        <br><br>
        ${esc(
          e.message
        )}
      </div>
    `;
  }
}

   (formulaire "Envoyer ma demande" du site)
========================= */

async function getWebRequests(){

  const {data,error} = await sb
    .from("web_project_requests")
    .select("*")
    .order("created_at",{ascending:false});

  if(error) throw error;

  return Array.isArray(data) ? data : [];
}

async function refreshWebBadge(){

  const badge = $("webBadge");
  if(!badge) return;

  try{
    const list = await getWebRequests();
    const fresh = list.filter(
      r => !r.status || String(r.status).toLowerCase() === "new"
    ).length;

    badge.innerHTML = fresh
      ? `<span class="chat-notification"><span class="chat-notification-dot"></span>${fresh}</span>`
      : "";
  }catch{
    badge.innerHTML = "";
  }
}

function webStatusPill(status){

  const s = String(status || "new").toLowerCase();

  if(s === "done")
    return `<span class="pill approved">TERMINÉ</span>`;

  if(s === "contacted")
    return `<span class="pill pending">CONTACTÉ</span>`;

  return `<span class="pill" style="background:#2563eb">NOUVEAU</span>`;
}

async function renderWeb(){

  const app = $("content");

  app.innerHTML = `<div class="empty">Chargement des demandes…</div>`;

  try{

    const list = await getWebRequests();

    if(!list.length){
      app.innerHTML = `
        <div class="empty">
          <h3>Aucune demande</h3>
          <p>Aucune demande de création de site web pour le moment.</p>
        </div>`;
      return;
    }

    app.innerHTML = list.map(r => {

      const digits = String(r.whatsapp || "").replace(/[^0-9]/g,"");

      return `
        <div class="item">

          <div class="row">
            <div>
              <b style="font-size:17px">
                ${esc(r.plan || "Projet")} · ${esc(r.client_name || "Client")}
              </b>
              <div class="muted" style="margin-top:4px">${fmt(r.created_at)}</div>
            </div>
            ${webStatusPill(r.status)}
          </div>

          <p style="margin-top:10px;font-size:13px;line-height:1.6">
            <b>WhatsApp :</b> ${esc(r.whatsapp || "—")}<br>
            <b>Entreprise :</b> ${esc(r.business_name || "Non précisée")}
          </p>

          <div style="margin:10px 0;padding:12px;border-radius:13px;background:#f7f7f8">
            <b>Description du site</b><br>
            <span style="font-size:13px;white-space:pre-wrap">${esc(r.project_description || "")}</span>
          </div>

          <div class="actions">
            ${digits ? `<a class="btn sm" target="_blank" rel="noopener" href="https://wa.me/${digits}">💬 WhatsApp</a>` : ""}
            <button class="btn sm" data-web-status="contacted" data-web-id="${esc(r.id)}">☎ Contacté</button>
            <button class="btn green sm" data-web-status="done" data-web-id="${esc(r.id)}">✓ Terminé</button>
            <button class="btn red sm" data-web-del="${esc(r.id)}">🗑 Supprimer</button>
          </div>

        </div>`;
    }).join("");

    app.querySelectorAll("[data-web-status]").forEach(btn => {
      btn.onclick = async () => {
        try{
          wait(true,"Mise à jour…");
          const {error} = await sb
            .from("web_project_requests")
            .update({status:btn.dataset.webStatus})
            .eq("id",btn.dataset.webId);
          if(error) throw error;
          await refreshWebBadge();
          await renderWeb();
        }catch(e){
          alert("❌ " + e.message);
        }finally{
          wait(false);
        }
      };
    });

    app.querySelectorAll("[data-web-del]").forEach(btn => {
      btn.onclick = async () => {
        if(!confirm("Supprimer cette demande ?")) return;
        try{
          wait(true,"Suppression…");
          const {error} = await sb
            .from("web_project_requests")
            .delete()
            .eq("id",btn.dataset.webDel);
          if(error) throw error;
          await refreshWebBadge();
          await renderWeb();
        }catch(e){
          alert("❌ " + e.message);
        }finally{
          wait(false);
        }
      };
    });

  }catch(e){

    console.error(e);

    app.innerHTML = `
      <div class="empty">
        <b>Demandes web indisponibles</b><br><br>
        ${esc(e.message)}<br><br>
        <small>Exécutez le fichier web-project-requests.sql dans Supabase (SQL Editor).</small>
      </div>`;
  }
}

/* =========================
   OUVRIR CHAT
========================= */

async function openChat(
  conversationId
){

  try{

    wait(
      true,
      "Ouverture de la conversation…"
    );


    const {
      data:c,
      error
    } =
      await sb.rpc(
        "controller_get_conversation",
        {
          p_conversation_id:
            conversationId
        }
      );


    if(error)
      throw error;


    if(!c){

      alert(
        "Conversation introuvable."
      );

      return;
    }

    const clientProfile = await getClientProfile(c.user_id);

    const clientDisplayName =
      clientProfile?.full_name ||
      "Client";

    const clientPhone =
      clientProfile?.phone ||
      "";


    const app =
      $("content");


    app.innerHTML = `

      <div class="row">

        <div>

          <h2>
            Conversation privée
          </h2>

          <p
            class="muted"
            style="margin-top:5px"
          >
            Client :
            <strong>
              ${esc(clientDisplayName)}
            </strong>
            ${clientPhone ? ` · ${esc(clientPhone)}` : ""} <span class="bl-dot" data-online-uid="${esc(c.user_id||"")}"></span>
          </p>

        </div>


        <button
          class="btn dark sm"
          id="back"
        >
          ← Retour
        </button>

      </div>


      <div
        class="chat"
        id="chat"
        style="margin-top:15px"
      >
        <p
          class="muted"
        >
          Chargement…
        </p>
      </div>


      <div class="compose">

        <textarea
          id="msg"
          rows="2"
          placeholder="Répondre au client…"
        ></textarea>

        <button
          class="btn"
          id="send"
        >
          Envoyer
        </button>

      </div>


      <div
        class="item"
        style="margin-top:12px"
      >

        <b>
          📎 Envoyer un fichier au client
        </b>

        <input
          id="file"
          type="file"
          accept="image/*,.pdf,.doc,.docx"
          style="
            display:block;
            margin-top:10px
          "
        >

        <button
          class="btn sm"
          id="sendFile"
          style="margin-top:8px"
        >
          Envoyer
        </button>

      </div>

    `;


    /* =========================
       MESSAGES
    ========================= */

    async function refreshMessages(){

      const {
        data,
        error
      } =
        await sb.rpc(
          "controller_get_messages",
          {
            p_conversation_id:
              conversationId
          }
        );


      if(error){

        $("chat").innerHTML = `
          <p
            style="color:#c00"
          >
            ${esc(
              error.message
            )}
          </p>
        `;

        return;
      }


      const {
        data:{
          user
        }
      } =
        await sb.auth.getUser();


      const box =
        $("chat");


      box.innerHTML =
        (
          data || []
        )
        .map(
          x => `

            <div
              class="
                bubble
                ${
                  x.sender_id ===
                  user?.id
                    ? "me"
                    : "other"
                }
              "
            >

              ${esc(
                x.body
              )}

              <div
                style="
                  font-size:9px;
                  opacity:.65;
                  margin-top:5px
                "
              >

                ${fmt(
                  x.created_at
                )}

                ${
                  x.sender_id ===
                  user?.id
                    ? `
                      <button
                        style="
                          border:0;
                          background:none;
                          cursor:pointer
                        "
                        data-del-msg="${esc(
                          x.id
                        )}"
                      >
                        🗑
                      </button>
                    `
                    : ""
                }

              </div>

            </div>

          `
        )
        .join("")
        ||
        "<p>Aucun message.</p>";


      box
        .querySelectorAll(
          "[data-del-msg]"
        )
        .forEach(
          btn => {

            btn.onclick =
              async () => {

                if(
                  !confirm(
                    "Supprimer ce message ?"
                  )
                )
                  return;


                const {
                  error
                } =
                  await sb.rpc(
                    "controller_delete_message",
                    {
                      p_message_id:
                        btn.dataset.delMsg
                    }
                  );


                if(error){

                  alert(
                    error.message
                  );

                }else{

                  await refreshMessages();

                }

              };

          }
        );


      box.scrollTop =
        box.scrollHeight;

      return Array.isArray(data) ? data : [];
    }


    /* =========================
       SEND MESSAGE
    ========================= */

    $("send").onclick =
      async () => {

        const body =
          $("msg")
            .value
            .trim();


        if(!body)
          return;


        try{

          wait(
            true,
            "Envoi du message…"
          );


          const {
            error
          } =
            await sb.rpc(
              "controller_send_message",
              {
                p_conversation_id:
                  conversationId,

                p_body:
                  body
              }
            );


          if(error)
            throw error;


          $("msg").value =
            "";


          const sentMessages = await refreshMessages();
          const latestSentMessage =
            sentMessages.length
              ? sentMessages[sentMessages.length - 1]
              : null;

          markChatRead(
            conversationId,
            latestSentMessage?.created_at ||
            c.last_message_at ||
            new Date().toISOString()
          );


        }catch(e){

          alert(
            e.message
          );

        }finally{

          wait(false);

        }

      };


    /* =========================
       BACK
    ========================= */

    $("back").onclick =
      () =>
        render(
          "chats"
        );


    /* =========================
       SEND FILE
    ========================= */

    $("sendFile").onclick =
      async () => {

        const f =
          $("file")
            .files[0];


        if(!f){

          alert(
            "Choisissez un fichier."
          );

          return;
        }


        const safe =
          f.name.replace(
            /[^a-zA-Z0-9._-]/g,
            "_"
          );


        const path =
          c.user_id +
          "/" +
          crypto.randomUUID() +
          "_" +
          safe;


        try{

          wait(
            true,
            "Envoi du fichier…"
          );


          const r =
            await sb.storage
              .from(BUCKET)
              .upload(
                path,
                f,
                {
                  upsert:false
                }
              );


          if(r.error)
            throw r.error;


          const q =
            await sb.rpc(
              "controller_register_file",
              {
                p_user_id:
                  c.user_id,

                p_file_name:
                  f.name,

                p_storage_path:
                  path,

                p_kind:
                  "controller_file",

                p_expires_at:
                  new Date(
                    Date.now()
                    +
                    48 *
                    3600000
                  ).toISOString()
              }
            );


          if(q.error){

            await sb.storage
              .from(BUCKET)
              .remove([
                path
              ]);

            throw q.error;
          }


          alert(
            "✅ Fichier envoyé."
          );


          $("file")
            .value = "";


          await refreshStats();
          await refreshMessages();


        }catch(e){

          alert(
            "❌ " +
            e.message
          );

        }finally{

          wait(false);

        }

      };


    const openedMessages = await refreshMessages();
    const latestOpenedMessage =
      openedMessages.length
        ? openedMessages[openedMessages.length - 1]
        : null;

    markChatRead(
      conversationId,
      latestOpenedMessage?.created_at ||
      c.last_message_at ||
      c.created_at
    );


  }catch(e){

    console.error(e);

    alert(
      "❌ " +
      e.message
    );

  }finally{

    wait(false);

  }
}

        ".tab.active"
      )?.dataset.view;

    if(active === "web")
      await renderWeb();

  }
)

.on(
  "postgres_changes",
  {
    event:"*",
    schema:"public",
    table:"conversations"
  },
  async () => {

    await refreshStats();

  }
)

.on(
  "postgres_changes",
  {
    event:"*",
    schema:"public",
    table:"messages"
  },
  async () => {

    const active =
      document.querySelector(
        ".tab.active"
      )?.dataset.view;

    await refreshStats();

    if(
      active === "chats"
    ){

      await render(
        "chats"
      );

    }

  }
)

.subscribe();

</script>
