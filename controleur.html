<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Baba Design — Contrôleur</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--black:#0b0d12;--orange:#ff7900;--red:#e51b2e;--bg:#f4f6f9;--card:#fff;--line:#e6e9ef;--muted:#778091;--green:#159447}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#11151d;font-family:Arial,Helvetica,sans-serif}
.top{height:70px;background:var(--black);color:#fff;position:sticky;top:0;z-index:20}.topin{max-width:1350px;height:100%;margin:auto;padding:0 20px;display:flex;align-items:center;justify-content:space-between}.brand{font-size:20px;font-weight:900}.brand span{color:var(--orange)}
.logout{background:#171a21;color:#fff;border:1px solid #343944;border-radius:11px;padding:10px 14px;font-weight:700;cursor:pointer}
.wrap{max-width:1350px;margin:auto;padding:22px 18px 60px}.hero{background:linear-gradient(125deg,#090b10,#1b202b);color:#fff;border-radius:24px;padding:28px;box-shadow:0 14px 40px #10152214}.hero small{color:#ffb15b;font-weight:900;letter-spacing:2px}.hero h1{font-size:clamp(28px,4vw,46px);margin:8px 0}.hero p{color:#bfc5d0;max-width:720px;line-height:1.55}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:16px 0}.stat,.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 8px 28px #1015220a}.stat{padding:17px}.stat small{color:var(--muted)}.stat b{font-size:27px;display:block;margin-top:6px}
.tabs{display:flex;gap:8px;overflow:auto;margin:16px 0}.tab{background:#fff;border:1px solid var(--line);padding:11px 16px;border-radius:11px;font-weight:800;cursor:pointer;white-space:nowrap}.tab.active{background:var(--black);color:#fff}
.panel{padding:20px}.head{display:flex;justify-content:space-between;gap:10px;align-items:center}.head h2{margin:0}.head p{color:var(--muted);font-size:13px}
.order{border:1px solid var(--line);border-radius:17px;padding:17px;margin:12px 0}.row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}.service{font-size:17px;font-weight:900}.muted{color:var(--muted);font-size:12px;margin-top:5px}
.pill{padding:7px 10px;border-radius:99px;font-size:10px;font-weight:900}.pending{background:#fff0d8;color:#a25a00}.approved{background:#e3f7e9;color:#13713a}.rejected{background:#ffe4e7;color:#a91421}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:13px 0}.box{background:#f7f8fa;border-radius:11px;padding:10px}.box small{display:block;color:var(--muted);font-size:10px}.box b{display:block;font-size:13px;margin-top:4px}
.proof{margin-top:13px;padding:13px;border:1px solid #e1e5eb;border-radius:15px;background:#fafbfc}.proofTitle{font-weight:900}.proofName{color:var(--muted);font-size:12px;margin-top:4px}.preview{margin-top:10px}.preview img{max-width:250px;max-height:280px;border-radius:11px;display:block;border:1px solid #ddd}
.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}.btn{border:0;border-radius:9px;padding:9px 12px;font-weight:800;cursor:pointer}.primary{background:linear-gradient(135deg,var(--red),var(--orange));color:#fff}.green{background:var(--green);color:#fff}.danger{background:#d7192b;color:#fff}.light{background:#edf0f4;color:#20242b}.dark{background:var(--black);color:#fff}
.bar{height:8px;background:#eceef2;border-radius:99px;overflow:hidden;margin:7px 0}.fill{height:100%;background:linear-gradient(90deg,var(--red),var(--orange))}.range{width:100%;accent-color:var(--orange)}
.file{display:flex;justify-content:space-between;gap:10px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:13px;margin:8px 0}.file small{display:block;color:var(--muted);margin-top:4px}.empty{text-align:center;color:var(--muted);padding:45px 10px}.notice{background:#fff6e5;color:#805000;padding:12px;border-radius:11px;font-size:12px}
.chat{height:390px;overflow:auto;background:#f5f6f8;border-radius:15px;padding:12px}.bubble{max-width:75%;padding:10px 12px;border-radius:14px;margin:7px 0}.mine{margin-left:auto;background:var(--black);color:#fff}.other{background:#fff;border:1px solid var(--line)}.compose{display:flex;gap:8px;margin-top:9px}.compose textarea{flex:1;border:1px solid #dce0e6;border-radius:11px;padding:10px}
.loader{position:fixed;inset:0;background:#080a0dcc;display:none;place-items:center;z-index:99}.loader.show{display:grid}.loader div{background:#fff;padding:22px;border-radius:16px;font-weight:800}
@media(max-width:800px){.stats{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr 1fr}}@media(max-width:520px){.wrap{padding:12px 9px}.stats{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.panel{padding:14px}.proof .actions .btn{width:100%}}
</style>
</head>
<body>
<script>if(sessionStorage.getItem("controllerAccessGranted")!=="1")location.replace("mon-espace.html");</script>
<header class="top"><div class="topin"><div class="brand">Baba<span>Design</span> · Contrôleur</div><button class="logout" id="logout">Déconnexion</button></div></header>
<main class="wrap">
<section class="hero"><small>ESPACE CONTRÔLEUR</small><h1>Centre de contrôle</h1><p>Vérifiez les paiements, consultez les preuves, téléchargez-les ou supprimez-les, puis gérez les commandes et leur progression.</p></section>
<section class="stats"><div class="stat"><small>Commandes</small><b id="ordersN">0</b></div><div class="stat"><small>Paiements validés</small><b id="paidN">0</b></div><div class="stat"><small>Fichiers</small><b id="filesN">0</b></div><div class="stat"><small>Conversations</small><b id="chatsN">0</b></div></section>
<nav class="tabs"><button class="tab active" data-view="orders">📦 Commandes</button><button class="tab" data-view="files">📁 Fichiers</button><button class="tab" data-view="chats">💬 Conversations</button></nav>
<section class="panel" id="app"><div class="empty">Chargement…</div></section>
</main>
<div class="loader" id="loader"><div id="loadText">Traitement…</div></div>

<script>
const URL="https://drvcneeaothydjmqpdzg.supabase.co",KEY="sb_publishable_k8DUVt12k1GN4n7yiYBnYw_gXltrpmp",BUCKET="client-files";
const sb=supabase.createClient(URL,KEY),$=id=>document.getElementById(id);
function esc(v){return String(v??"").replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[c]))}
function fmt(v){return v?new Date(v).toLocaleString("fr-FR"):"—"}
function busy(x,t="Traitement…"){$("loadText").textContent=t;$("loader").classList.toggle("show",x)}
async function guard(){const{data:{user}}=await sb.auth.getUser();if(!user)return false;const{data,error}=await sb.rpc("is_controller");return!error&&data===true}
async function data(){const{data,error}=await sb.rpc("controller_get_dashboard");if(error)throw error;return{orders:Array.isArray(data?.orders)?data.orders:[],files:Array.isArray(data?.files)?data.files:[],chats:Array.isArray(data?.conversations)?data.conversations:[]}}
async function url(path){const{data,error}=await sb.storage.from(BUCKET).createSignedUrl(path,300);if(error)throw error;return data.signedUrl}
async function viewFile(path){try{window.open(await url(path),"_blank")}catch(e){alert(e.message)}}
async function downloadFile(path,name){try{const u=await url(path),a=document.createElement("a");a.href=u;a.download=name||"fichier";a.target="_blank";document.body.appendChild(a);a.click();a.remove()}catch(e){alert(e.message)}}
async function deleteFile(id,path){if(!confirm("Supprimer définitivement ce fichier / cette preuve ?"))return;try{busy(true,"Suppression…");if(path){const r=await sb.storage.from(BUCKET).remove([path]);if(r.error)throw r.error}const q=await sb.rpc("controller_delete_file_metadata",{p_file_id:id});if(q.error)throw q.error;await render("orders");await stats()}catch(e){alert(e.message)}finally{busy(false)}}
function proof(o,files){return files.find(f=>String(f.order_id)==String(o.id)&&String(f.kind||"").toLowerCase()=="payment_proof")}
function pill(s){s=String(s||"pending").toLowerCase();return s=="approved"?'<span class="pill approved">PAIEMENT VALIDÉ</span>':s=="rejected"?'<span class="pill rejected">PAIEMENT REFUSÉ</span>':'<span class="pill pending">EN ATTENTE</span>'}
function card(o,files){
 const f=proof(o,files),p=Math.max(0,Math.min(100,Number(o.progress||0))),img=f&&/\.(jpg|jpeg|png|gif|webp)$/i.test(f.file_name||"");
 return `<article class="order"><div class="row"><div><div class="service">${esc(o.service_name||"Commande")}</div><div class="muted">Client : ${esc(o.client_name||o.full_name||"Client")} · ${fmt(o.created_at)}</div></div>${pill(o.payment_status)}</div>
 <div class="grid"><div class="box"><small>MONTANT</small><b>${esc(o.price_htg??0)} HTG</b></div><div class="box"><small>STATUT</small><b>${esc(o.status||"En attente")}</b></div><div class="box"><small>ID</small><b>${esc(o.id||"—")}</b></div></div>
 ${o.description?`<div class="box"><small>DESCRIPTION</small><b>${esc(o.description)}</b></div>`:""}
 ${f?`<div class="proof"><div class="row"><div><div class="proofTitle">🧾 Preuve de paiement</div><div class="proofName">${esc(f.file_name||"preuve")}</div></div><div class="actions"><button class="btn light" onclick="viewFile('${esc(f.storage_path||"")}')">👁 Voir</button><button class="btn primary" onclick="downloadFile('${esc(f.storage_path||"")}','${esc(f.file_name||"preuve")}')">⬇ Télécharger</button><button class="btn danger" onclick="deleteFile('${esc(f.id||"")}','${esc(f.storage_path||"")}')">🗑 Supprimer</button></div></div>${img?`<div class="preview"><img src="" data-img="${esc(f.storage_path||"")}"></div>`:""}</div>`:'<div class="notice">⚠️ Aucune preuve de paiement jointe.</div>'}
 <div class="row" style="margin-top:14px"><b>Progression <span id="t${esc(o.id)}">${p}%</span></b><span class="muted">${esc(o.status||"")}</span></div><div class="bar"><div class="fill" id="f${esc(o.id)}" style="width:${p}%"></div></div><input class="range" type="range" min="0" max="100" value="${p}" data-progress="${esc(o.id)}">
 <div class="actions"><button class="btn green" data-ok="${esc(o.id)}">✓ Valider paiement</button><button class="btn danger" data-no="${esc(o.id)}">✕ Refuser</button></div></article>`
}
async function render(view){
 const app=$("app");app.innerHTML='<div class="empty">Chargement…</div>';let d;
 try{d=await data()}catch(e){app.innerHTML=`<div class="empty">Erreur : ${esc(e.message)}</div>`;return}
 if(view=="orders"){
  app.innerHTML=`<div class="head"><div><h2>Commandes & paiements</h2><p>La preuve de paiement possède maintenant Voir, Télécharger et Supprimer.</p></div></div>`+(d.orders.length?d.orders.map(o=>card(o,d.files)).join(""):'<div class="empty">Aucune commande.</div>');
  document.querySelectorAll("[data-img]").forEach(async x=>{try{x.src=await url(x.dataset.img)}catch{}});
  document.querySelectorAll("[data-progress]").forEach(x=>{x.oninput=()=>{$("t"+x.dataset.progress).textContent=x.value+"%";$("f"+x.dataset.progress).style.width=x.value+"%"};x.onchange=async()=>{const q=await sb.rpc("controller_set_order_progress",{p_order_id:x.dataset.progress,p_progress:Number(x.value)});if(q.error)alert(q.error.message)}});
  document.querySelectorAll("[data-ok]").forEach(b=>b.onclick=async()=>{if(!confirm("Valider ce paiement ?"))return;try{busy(true,"Validation…");const q=await sb.rpc("controller_approve_order",{p_order_id:b.dataset.ok});if(q.error)throw q.error;await render("orders");await stats()}catch(e){alert(e.message)}finally{busy(false)}});
  document.querySelectorAll("[data-no]").forEach(b=>b.onclick=async()=>{const r=prompt("Motif du refus (facultatif) :");if(r===null)return;const q=await sb.rpc("controller_reject_order",{p_order_id:b.dataset.no,p_reason:r});if(q.error)alert(q.error.message);else{await render("orders");await stats()}});
 }
 if(view=="files")app.innerHTML=`<div class="head"><div><h2>Tous les fichiers</h2><p>Tu peux télécharger ou supprimer chaque fichier.</p></div></div>`+(d.files.length?d.files.map(f=>`<div class="file"><div><b>${esc(f.file_name||"Fichier")}</b><small>${esc(f.kind||"Fichier")} · ${fmt(f.created_at)}</small></div><div class="actions"><button class="btn primary" onclick="downloadFile('${esc(f.storage_path||"")}','${esc(f.file_name||"fichier")}')">⬇ Télécharger</button><button class="btn danger" onclick="deleteFile('${esc(f.id||"")}','${esc(f.storage_path||"")}')">🗑 Supprimer</button></div></div>`).join(""):'<div class="empty">Aucun fichier.</div>');
 if(view=="chats")app.innerHTML=`<div class="head"><div><h2>Conversations</h2><p>Messagerie contrôleur / client.</p></div></div>`+(d.chats.length?d.chats.map(c=>`<div class="file"><div><b>Client</b><small>${esc(c.user_id||"")} · ${fmt(c.last_message_at)}</small></div><button class="btn primary" onclick="openChat('${esc(c.id||"")}')">💬 Ouvrir</button></div>`).join(""):'<div class="empty">Aucune conversation.</div>')
}
async function stats(){try{const d=await data();$("ordersN").textContent=d.orders.length;$("paidN").textContent=d.orders.filter(x=>String(x.payment_status).toLowerCase()=="approved").length;$("filesN").textContent=d.files.length;$("chatsN").textContent=d.chats.length}catch{}}
async function openChat(id){const q=await sb.rpc("controller_get_conversation",{p_conversation_id:id});if(q.error)return alert(q.error.message);const c=q.data;$("app").innerHTML=`<div class="head"><div><h2>Conversation</h2><p>${esc(c?.user_id||"")}</p></div><button class="btn light" onclick="render('chats')">← Retour</button></div><div class="chat" id="chat"></div><div class="compose"><textarea id="msg" rows="2" placeholder="Message…"></textarea><button class="btn primary" id="send">Envoyer</button></div>`;async function load(){const r=await sb.rpc("controller_get_messages",{p_conversation_id:id});if(r.error)return;const me=(await sb.auth.getUser()).data.user;$("chat").innerHTML=(r.data||[]).map(m=>`<div class="bubble ${m.sender_id==me?.id?"mine":"other"}">${esc(m.body)}<div style="font-size:9px;opacity:.6">${fmt(m.created_at)}</div></div>`).join("")||"Aucun message";$("chat").scrollTop=$("chat").scrollHeight}$("send").onclick=async()=>{const body=$("msg").value.trim();if(!body)return;const r=await sb.rpc("controller_send_message",{p_conversation_id:id,p_body:body});if(r.error)alert(r.error.message);else{$("msg").value="";load()}};load()}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));b.classList.add("active");render(b.dataset.view)});
$("logout").onclick=async()=>{sessionStorage.removeItem("controllerAccessGranted");await sb.auth.signOut();location.href="mon-espace.html"};
(async()=>{if(!await guard()){sessionStorage.removeItem("controllerAccessGranted");return location.replace("mon-espace.html")}await stats();await render("orders")})();
sb.channel("controller-live").on("postgres_changes",{event:"*",schema:"public",table:"orders"},async()=>{await stats();render(document.querySelector(".tab.active")?.dataset.view||"orders")}).on("postgres_changes",{event:"*",schema:"public",table:"files"},async()=>{await stats();render(document.querySelector(".tab.active")?.dataset.view||"orders")}).subscribe();
</script>
</body>
</html>
