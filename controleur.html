<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#09090b">
<title>Baba Design — Contrôleur</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
--r:#e60000;--o:#ff7300;--y:#ffd000;--d:#09090b;
--bg:#f4f5f7;--line:#e7e7eb
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:Inter,Arial,sans-serif;color:#111}
button,input,textarea{font:inherit}

.top{
position:sticky;top:0;z-index:20;background:#09090beF;color:#fff;
backdrop-filter:blur(22px);border-bottom:1px solid #ffffff14
}
.topin{
max-width:1350px;margin:auto;padding:15px 22px;display:flex;
justify-content:space-between;align-items:center
}
.brand{font-size:21px;font-weight:950}
.brand span{color:var(--o)}
.logout{
border:1px solid #333;background:#17171a;color:#fff;
padding:10px 14px;border-radius:12px;cursor:pointer
}
.wrap{max-width:1350px;margin:auto;padding:28px 20px 70px}

.hero{
border-radius:30px;
background:radial-gradient(circle at 85% 20%,#e6000044,transparent 25%),
linear-gradient(135deg,#08080a,#171719 60%,#2d0d00);
color:#fff;padding:34px;box-shadow:0 25px 70px #1112;
position:relative;overflow:hidden
}
.hero:after{
content:"";position:absolute;width:250px;height:250px;border-radius:50%;
right:-100px;bottom:-130px;background:#ffd000;filter:blur(65px);opacity:.3
}
.k{color:#ffd000;font-size:11px;letter-spacing:2px;font-weight:900}
.hero h1{font-size:clamp(32px,5vw,58px);margin:10px 0}
.hero p{color:#c8c8c8;line-height:1.6;max-width:700px}

.stats{
display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:20px 0
}
.stat,.panel{
background:#fff;border:1px solid var(--line);border-radius:22px;
box-shadow:0 16px 50px #11110a
}
.stat{padding:20px}
.stat small{color:#777}
.stat b{display:block;font-size:30px;margin-top:8px}

.tabs{display:flex;gap:8px;overflow:auto;margin:20px 0}
.tab{
border:1px solid var(--line);background:#fff;padding:12px 16px;
border-radius:13px;font-weight:900;cursor:pointer;white-space:nowrap
}
.tab.active{
background:linear-gradient(135deg,#111,#2b2b2b 55%,var(--r));color:#fff
}
.panel{padding:22px}

.item{
border:1px solid var(--line);border-radius:17px;padding:16px;
margin:11px 0;background:#fff
}
.row{
display:flex;align-items:center;justify-content:space-between;
gap:12px;flex-wrap:wrap
}
.pill{
padding:6px 10px;border-radius:999px;font-size:10px;
font-weight:950;background:#111;color:#fff
}
.approved{background:#16833b}
.rejected{background:#c40000}
.pending{background:var(--o)}

.btn{
border:0;border-radius:11px;padding:10px 13px;
background:linear-gradient(135deg,var(--r),var(--o));
color:#fff;font-weight:900;cursor:pointer
}
.dark{background:#111}
.sm{padding:7px 10px;font-size:11px}

.range{width:100%;accent-color:var(--o)}
.bar{height:9px;background:#ececf0;border-radius:99px;overflow:hidden}
.fill{
height:100%;
background:linear-gradient(90deg,var(--r),var(--o),var(--y));
border-radius:99px
}

.file{
display:flex;justify-content:space-between;gap:10px;align-items:center
}
.file small{display:block;color:#777;margin-top:4px}

.chat{
height:360px;overflow:auto;background:#f7f7f8;
border-radius:17px;padding:14px
}
.bubble{
max-width:78%;padding:10px 13px;border-radius:16px;
margin:7px 0;line-height:1.45
}
.me{
margin-left:auto;
background:linear-gradient(135deg,var(--r),var(--o));color:#fff
}
.other{background:#fff;border:1px solid var(--line)}

.compose{display:flex;gap:8px;margin-top:10px}
.compose textarea{
flex:1;border:1px solid #ddd;border-radius:12px;padding:11px
}

.loader{
position:fixed;inset:0;background:#09090bdd;z-index:99;
display:none;place-items:center
}
.loader.show{display:grid}
.loaderbox{
background:#fff;padding:28px;border-radius:22px;text-align:center
}
.spin{
width:50px;height:50px;border:5px solid #eee;
border-top-color:var(--o);border-right-color:var(--r);
border-radius:50%;animation:s 1s linear infinite;
margin:auto auto 12px
}
@keyframes s{to{transform:rotate(360deg)}}

@media(max-width:850px){
.stats{grid-template-columns:1fr 1fr}
}
@media(max-width:520px){
.wrap{padding:15px 11px}
.hero{padding:25px;border-radius:22px}
.stats{grid-template-columns:1fr}
.panel{padding:15px}
}
</style>
</head>
