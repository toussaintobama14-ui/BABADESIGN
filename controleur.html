<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Baba Design · Contrôleur</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --r:#7c3aed;
  --o:#f97316;
  --y:#eab308;
  --line:#e7e7eb;
  --bg:#f7f7f8;
  --dark:#111;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:#111;
}

.top{
  background:#111;
  color:#fff;
  position:sticky;
  top:0;
  z-index:20;
}

.topin{
  max-width:1200px;
  margin:auto;
  padding:15px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.brand{
  font-size:20px;
  font-weight:900;
}

.brand span{
  color:#f97316;
}

.logout{
  border:0;
  border-radius:10px;
  padding:9px 14px;
  background:#c40000;
  color:#fff;
  font-weight:800;
  cursor:pointer;
}

.wrap{
  max-width:1200px;
  margin:auto;
  padding:20px;
}

.hero{
  background:#111;
  color:#fff;
  border-radius:25px;
  padding:35px;
  margin-bottom:18px;
}

.hero .k{
  color:#f97316;
  font-size:11px;
  font-weight:900;
  letter-spacing:2px;
  margin-bottom:10px;
}

.hero h1{
  font-size:32px;
  line-height:1.1;
  margin-bottom:12px;
}

.hero p{
  color:#ccc;
  max-width:650px;
  line-height:1.5;
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
  margin-bottom:18px;
}

.stat{
  background:#fff;
  border:1px solid var(--line);
  border-radius:16px;
  padding:18px;
}

.stat small{
  display:block;
  color:#777;
  margin-bottom:8px;
}

.stat b{
  font-size:28px;
}

.tabs{
  display:flex;
  gap:8px;
  margin-bottom:15px;
  overflow:auto;
}

.tab{
  border:1px solid var(--line);
  background:#fff;
  padding:11px 15px;
  border-radius:11px;
  cursor:pointer;
  font-weight:800;
  white-space:nowrap;
}

.tab.active{
  background:#111;
  color:#fff;
}

.panel{
  background:#fff;
  border:1px solid var(--line);
  border-radius:20px;
  padding:18px;
}

.item{
  border:1px solid var(--line);
  border-radius:16px;
  padding:16px;
  margin-bottom:12px;
}

.row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.muted{
  color:#777;
  font-size:12px;
}

.pill{
  display:inline-block;
  padding:6px 9px;
  border-radius:20px;
  color:#fff;
  font-size:10px;
  font-weight:900;
}

.approved{
  background:#16833b;
}

.rejected{
  background:#c40000;
}

.pending{
  background:#f97316;
}

.btn{
  border:0;
  border-radius:11px;
  padding:10px 13px;
  background:linear-gradient(
    135deg,
    var(--r),
    var(--o)
  );
  color:#fff;
  font-weight:900;
  cursor:pointer;
}

.btn.dark{
  background:#111;
}

.btn.green{
  background:#16833b;
}

.btn.red{
  background:#c40000;
}

.btn.sm{
  padding:7px 10px;
  font-size:11px;
}

.actions{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  margin-top:12px;
}

.range{
  width:100%;
  accent-color:var(--o);
  margin-top:8px;
}

.bar{
  height:9px;
  background:#ececf0;
  border-radius:99px;
  overflow:hidden;
  margin-top:8px;
}

.fill{
  height:100%;
  background:linear-gradient(
    90deg,
    var(--r),
    var(--o),
    var(--y)
  );
  border-radius:99px;
}

.notice{
  padding:14px;
  border-radius:14px;
  background:#fff7e8;
  border:1px solid #ffd98a;
  color:#7a4b00;
  margin:10px 0;
}

.file{
  display:flex;
  justify-content:space-between;
  gap:10px;
  align-items:center;
}

.file small{
  display:block;
  color:#777;
  margin-top:4px;
}

.chat{
  height:360px;
  overflow:auto;
  background:#f7f7f8;
  border-radius:17px;
  padding:14px;
}

.bubble{
  max-width:78%;
  padding:10px 13px;
  border-radius:16px;
  margin:7px 0;
  line-height:1.45;
  word-break:break-word;
}

.me{
  margin-left:auto;
  background:linear-gradient(
    135deg,
    var(--r),
    var(--o)
  );
  color:#fff;
}

.other{
  background:#fff;
  border:1px solid var(--line);
}

.compose{
  display:flex;
  gap:8px;
  margin-top:10px;
}

.compose textarea{
  flex:1;
  border:1px solid #ddd;
  border-radius:12px;
  padding:11px;
  resize:vertical;
}

.loader{
  position:fixed;
  inset:0;
  background:#09090bdd;
  z-index:99;
  display:none;
  place-items:center;
}

.loader.show{
  display:grid;
}

.loaderbox{
  background:#fff;
  padding:28px;
  border-radius:22px;
  text-align:center;
}

.spin{
  width:50px;
  height:50px;
  border:5px solid #eee;
  border-top-color:var(--o);
  border-right-color:var(--r);
  border-radius:50%;
  animation:s 1s linear infinite;
  margin:auto auto 12px;
}

.empty{
  text-align:center;
  padding:35px 15px;
  color:#777;
}

@keyframes s{
  to{
    transform:rotate(360deg);
  }
}

@media(max-width:850px){
  .stats{
    grid-template-columns:1fr 1fr;
  }
}

@media(max-width:520px){

  .wrap{
    padding:15px 11px;
  }

  .hero{
    padding:25px;
    border-radius:22px;
  }

  .stats{
    grid-template-columns:1fr;
  }

  .panel{
    padding:15px;
  }

  .topin{
    padding:13px 14px;
  }

  .brand{
    font-size:18px;
  }

  .compose{
    flex-direction:column;
  }

  .compose .btn{
    width:100%;
  }
}
</style>
</head>

<body>

<script>
if(
  sessionStorage.getItem(
    "controllerAccessGranted"
  ) !== "1"
){
  window.location.replace(
    "mon-espace.html"
  );
}

<div id="loading" class="loader">
  <div class="loaderbox">
    <div class="spin"></div>
    <b id="loadingText">
      Chargement…
    </b>
  </div>
</div>

<header class="top">
  <div class="topin">

    <div class="brand">
      Baba<span>Design</span> · Contrôleur
    </div>

    <button
      class="logout"
      id="logout">
      Déconnexion
    </button>

  </div>
</header>

<section class="hero">

  <div class="k">

  </div>

  <h1>
    Contrôle total.<br>

  </h1>

  <p>
    Gérez les commandes, paiements,

  <div class="stat">

    <b id="statFiles">—</b>

  </div>

<script>

const SUPABASE_URL =
  "https://drvcneeaothydjmqpdzg.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_k8DUVt12k1GN4n7yiYBnYw_gXltrpmp";

const BUCKET =
  "client-files";


const sb =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY,
    {
      auth:{
        persistSession:true,
        autoRefreshToken:true,
        detectSessionInUrl:true
      }
    }
  );


const $ =
  id =>
    document.getElementById(id);


function esc(v){

  return String(v ?? "")
    .replace(
      /[&<>'"]/g,
      c => ({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        "'":"&#39;",
        '"':"&quot;"
      }[c])
    );
}


function fmt(d){

  if(!d)
    return "—";

  try{
    return new Date(d)
      .toLocaleString("fr-FR");
  }catch{
    return "—";
  }
}


function wait(
  on,
  text="Traitement…"
){

  $("loadingText")
    .textContent = text;

  $("loading")
    .classList.toggle(
      "show",
      on
    );
}


/* =========================
   CONTROLLER
========================= */

async function controllerGuard(){

  const {
    data:{user},
    error:userError
  } =
    await sb.auth.getUser();

  if(
    userError ||
    !user
  ){
    return false;
  }

  const {
    data,
    error
  } =
    await sb.rpc(
      "is_controller"
    );

  if(
    error ||
    data !== true
  ){
    return false;
  }

  return true;
}


/* =========================
   DASHBOARD
========================= */

async function getDashboard(){

  const {
    data,
    error
  } =
    await sb.rpc(
      "controller_get_dashboard"
    );

  if(error)
    throw error;

  const result =
    data &&
    typeof data === "object"
      ? data
      : {};

  return {

    orders:
      Array.isArray(
        result.orders
      )
        ? result.orders
        : [],

    files:
      Array.isArray(
        result.files
      )
        ? result.files
        : [],

    conversations:
      Array.isArray(
        result.conversations
      )
        ? result.conversations
        : []

  };
}


/* =========================
   STATS
========================= */

async function refreshStats(){

  try{

    const d =
      await getDashboard();

    $("statOrders")
      .textContent =
      d.orders.length;

    $("statPaid")
      .textContent =
      d.orders.filter(
        o =>
          String(
            o.payment_status || ""
          ).toLowerCase()
          === "approved"
      ).length;

    $("statFiles")
      .textContent =
      d.files.length;

    $("statChats")
      .textContent =
      d.conversations.length;

  }catch(e){

    console.error(
      "Stats:",
      e
    );

    $("statOrders")
      .textContent="!";

    $("statPaid")
      .textContent="!";

    $("statFiles")
      .textContent="!";

    $("statChats")
      .textContent="!";
  }
}


/* =========================
   FICHIER PRIVÉ
========================= */

async function downloadFile(
  path
){

  if(!path){

    alert(
      "Fichier introuvable."
    );

    return;
  }

  const {
    data,
    error
  } =
    await sb.storage
      .from(BUCKET)
      .createSignedUrl(
        path,
        120
      );

  if(error){

    alert(
      error.message
    );

    return;
  }

  if(
    data &&
    data.signedUrl
  ){

    window.open(
      data.signedUrl,
      "_blank"
    );

  }else{

    alert(
      "Impossible de créer le lien du fichier."
    );
  }
}


/* =========================
   PAYMENT LABEL
========================= */

function paymentLabel(
  status
){

  const s =
    String(
      status || "pending"
    ).toLowerCase();

  if(
    s === "approved"
  ){

    return `
      <span class="pill approved">
        PAIEMENT VALIDÉ
      </span>
    `;
  }

  if(
    s === "rejected"
  ){

    return `
      <span class="pill rejected">
        PAIEMENT REFUSÉ
      </span>
    `;
  }

  return `
    <span class="pill pending">
      EN ATTENTE
    </span>
  `;
}


/* =========================
   COMMANDES
========================= */

function orderHtml(
  o,
  files
){

  const paymentStatus =
    String(
      o.payment_status ||
      "pending"
    ).toLowerCase();


  const proof =
    files.find(
      f =>
        String(
          f.order_id || ""
        ) ===
        String(
          o.id || ""
        )
        &&
        String(
          f.kind || ""
        ).toLowerCase()
        === "payment_proof"
    );


  const progress =
    Math.max(
      0,
      Math.min(
        100,
        Number(
          o.progress || 0
        )
      )
    );


  const client =
    o.client_name ||
    o.full_name ||
    o.name ||
    "Client";


  let html = "";


  html += `
    <div class="item">

      <div class="row">

        <div>

          <b style="font-size:17px">
            ${esc(
              o.service_name ||
              "Commande"
            )}
          </b>

          <div
            style="
              font-size:11px;
              color:#777;
              margin-top:4px
            "
          >
            ID :
            ${esc(
              o.id || "—"
            )}
          </div>

        </div>

        ${paymentLabel(
          paymentStatus
        )}

      </div>
  `;


  html += `
    <p
      style="
        color:#777;
        font-size:12px;
        margin-top:8px
      "
    >
      Client :
      <strong>
        ${esc(client)}
      </strong>

      ·

      ${fmt(
        o.created_at
      )}
    </p>
  `;


  if(
    o.description
  ){

    html += `
      <div
        style="
          margin:10px 0;
          padding:12px;
          border-radius:13px;
          background:#f7f7f8
        "
      >

        <b>Description</b>
        <br>

        <span
          style="font-size:13px"
        >
          ${esc(
            o.description
          )}
        </span>

      </div>
    `;
  }


  if(
    o.price_htg !==
      undefined &&
    o.price_htg !== null
  ){

    html += `
      <p>
        <b>
          Montant :
          ${esc(
            o.price_htg
          )}
          HTG
        </b>
      </p>
    `;
  }


  /* PREUVE */

  if(proof){

    html += `
      <div
        style="
          margin:10px 0;
          padding:12px;
          border:1px solid #eee;
          border-radius:13px;
          background:#fafafa
        "
      >

        <b>
          📸 Preuve de paiement
        </b>

        <div
          style="
            font-size:12px;
            color:#777;
            margin:5px 0 9px
          "
        >
          ${esc(
            proof.file_name ||
            "preuve"
          )}
        </div>

        <button
          class="btn sm"
          data-dl="
            ${esc(
              proof.storage_path ||
              ""
            )}
          "
        >
          Voir / télécharger
        </button>

      </div>
    `;

  }else{

    html += `
      <div class="notice">
        <b>
          ⚠️ Aucune preuve
          de paiement jointe.
        </b>
      </div>
    `;
  }


  /* PROGRESSION */

  html += `

    <div
      class="row"
      style="margin-top:14px"
    >

      <strong>
        Progression :

        <span
          id="progressText_${esc(
            o.id
          )}"
        >
          ${progress}%
        </span>

      </strong>

      <span
        style="
          font-size:12px;
          color:#777
        "
      >
        ${esc(
          o.status ||
          "En attente de validation"
        )}
      </span>

    </div>

    <div class="bar">

      <div
        class="fill"
        id="fill_${esc(
          o.id
        )}"
        style="
          width:${progress}%
        "
      ></div>

    </div>

    <input
      class="range"
      type="range"
      min="0"
      max="100"
      value="${progress}"
      data-progress="${esc(
        o.id
      )}"
    >

  `;


  /* ACTIONS */

  html += `

    <div class="actions">

      <button
        class="btn green"
        data-ok="${esc(
          o.id
        )}"
      >
        ✓ Valider paiement
      </button>

      <button
        class="btn red"
        data-no="${esc(
          o.id
        )}"
      >
        ✕ Refuser
      </button>

    </div>

  `;


  if(
    o.rejection_reason
  ){

    html += `
      <div
        style="
          margin-top:10px;
          padding:10px;
          border-radius:12px;
          background:#fff1f1;
          color:#9d0000;
          font-size:12px
        "
      >

        <b>
          Motif actuel :
        </b>

        ${esc(
          o.rejection_reason
        )}

      </div>
    `;
  }


  html += `
    </div>
  `;


  return html;
}


/* =========================
   RENDER COMMANDES
========================= */

async function renderOrders(){

  const app =
    $("content");

  app.innerHTML = `
    <div class="empty">
      Chargement…
    </div>
  `;


  try{

    const d =
      await getDashboard();


    if(
      !d.orders.length
    ){

      app.innerHTML = `
        <div class="empty">
          Aucune commande.
        </div>
      `;

      return;
    }


    app.innerHTML =
      d.orders
        .map(
          o =>
            orderHtml(
              o,
              d.files
            )
        )
        .join("");


    /* PREUVES */

    app
      .querySelectorAll(
        "[data-dl]"
      )
      .forEach(
        btn => {

          btn.onclick =
            () =>
              downloadFile(
                btn.dataset.dl
              );

        }
      );


    /* VALIDATION */

    app
      .querySelectorAll(
        "[data-ok]"
      )
      .forEach(
        btn => {

          btn.onclick =
            async () => {

              if(
                !confirm(
                  "Confirmer la validation du paiement ?"
                )
              )
                return;


              try{

                wait(
                  true,
                  "Validation du paiement…"
                );


                const {
                  error
                } =
                  await sb.rpc(
                    "controller_approve_order",
                    {
                      p_order_id:
                        btn.dataset.ok
                    }
                  );


                if(error)
                  throw error;


                alert(
                  "✅ Paiement validé avec succès."
                );


                await refreshStats();
                await renderOrders();


              }catch(e){

                alert(
                  "❌ " +
                  e.message
                );

              }finally{

                wait(false);

              }

            };

        }
      );


    /* REFUS */

    app
      .querySelectorAll(
        "[data-no]"
      )
      .forEach(
        btn => {

          btn.onclick =
            async () => {

              const reason =
                prompt(
                  "Pourquoi voulez-vous refuser cette commande ?"
                );


              if(
                reason === null
              )
                return;


              try{

                wait(
                  true,
                  "Refus de la commande…"
                );


                const {
                  error
                } =
                  await sb.rpc(
                    "controller_reject_order",
                    {
                      p_order_id:
                        btn.dataset.no,

                      p_reason:
                        reason
                    }
                  );


                if(error)
                  throw error;


                alert(
                  "Commande refusée."
                );


                await refreshStats();
                await renderOrders();


              }catch(e){

                alert(
                  "❌ " +
                  e.message
                );

              }finally{

                wait(false);

              }

            };

        }
      );


    /* PROGRESSION */

    app
      .querySelectorAll(
        "[data-progress]"
      )
      .forEach(
        range => {

          range.oninput =
            () => {

              const id =
                range.dataset.progress;

              const value =
                Number(
                  range.value
                );


              const text =
                document.getElementById(
                  "progressText_" +
                  id
                );

              const fill =
                document.getElementById(
                  "fill_" +
                  id
                );


              if(text)
                text.textContent =
                  value + "%";

              if(fill)
                fill.style.width =
                  value + "%";
            };


          range.onchange =
            async () => {

              try{

                const {
                  error
                } =
                  await sb.rpc(
                    "controller_set_order_progress",
                    {
                      p_order_id:
                        range.dataset.progress,

                      p_progress:
                        Number(
                          range.value
                        )
                    }
                  );


                if(error)
                  throw error;


              }catch(e){

                alert(
                  "❌ " +
                  e.message
                );

                await renderOrders();
              }

            };

        }
      );


  }catch(e){

    console.error(e);

    app.innerHTML = `
      <div class="empty">
        <b>Erreur</b>
        <br><br>
        ${esc(
          e.message
        )}
      </div>
    `;
  }
}


/* =========================
   FICHIERS
========================= */

async function renderFiles(){

  const app =
    $("content");

  app.innerHTML = `
    <div class="empty">
      Chargement des fichiers…
    </div>
  `;


  try{

    const d =
      await getDashboard();


    if(
      !d.files.length
    ){

      app.innerHTML = `
        <div class="empty">
          <h3>
            Aucun fichier
          </h3>

          <p>
            Aucun fichier envoyé
            pour le moment.
          </p>
        </div>
      `;

      return;
    }


    app.innerHTML =
      d.files
        .map(
          f => `

          <div class="item">

            <div class="file">

              <div>

                <b>
                  📁
                  ${esc(
                    f.file_name ||
                    "Fichier"
                  )}
                </b>

                <small>
                  Type :
                  ${esc(
                    f.kind ||
                    "—"
                  )}
                </small>

                <small>
                  ${fmt(
                    f.created_at
                  )}
                </small>

              </div>

              <div class="actions">

                <button
                  class="btn sm"
                  data-file-path="${esc(
                    f.storage_path ||
                    ""
                  )}"
                >
                  👁 Voir
                </button>

                <button
                  class="btn red sm"
                  data-delete-file="${esc(
                    f.id ||
                    ""
                  )}"
                >
                  🗑 Supprimer
                </button>

              </div>

            </div>

          </div>

        `
        )
        .join("");


    app
      .querySelectorAll(
        "[data-file-path]"
      )
      .forEach(
        btn => {

          btn.onclick =
            () =>
              downloadFile(
                btn.dataset.filePath
              );

        }
      );


    app
      .querySelectorAll(
        "[data-delete-file]"
      )
      .forEach(
        btn => {

          btn.onclick =
            async () => {

              if(
                !confirm(
                  "Supprimer ce fichier ?"
                )
              )
                return;


              try{

                wait(
                  true,
                  "Suppression…"
                );


                const {
                  error
                } =
                  await sb.rpc(
                    "controller_delete_file_metadata",
                    {
                      p_file_id:
                        btn.dataset.deleteFile
                    }
                  );


                if(error)
                  throw error;


                await refreshStats();
                await renderFiles();


              }catch(e){

                alert(
                  "❌ " +
                  e.message
                );

              }finally{

                wait(false);

              }

            };

        }
      );


  }catch(e){

    console.error(e);

    app.innerHTML = `
      <div class="empty">
        <b>Erreur</b>
        <br><br>
        ${esc(
          e.message
        )}
      </div>
    `;
  }
}


/* =========================
   CONVERSATIONS
========================= */

async function renderChats(){

  const app =
    $("content");

  app.innerHTML = `
    <div class="empty">
      Chargement des conversations…
    </div>
  `;


  try{

    const d =
      await getDashboard();


    if(
      !d.conversations.length
    ){

      app.innerHTML = `
        <div class="empty">
          <h3>
            Aucune conversation
          </h3>

          <p>
            Aucune conversation disponible.
          </p>
        </div>
      `;

      return;
    }


    app.innerHTML =
      d.conversations
        .map(
          c => `

          <div class="item">

            <div class="row">

              <div>

                <b>
                  💬 Conversation
                </b>

                <div class="muted">
                  Client :
                  ${esc(
                    c.user_id ||
                    "—"
                  )}
                </div>

                <div
                  class="muted"
                  style="margin-top:5px"
                >
                  ${fmt(
                    c.last_message_at ||
                    c.created_at
                  )}
                </div>

              </div>

              <div
                class="actions"
              >

                <button
                  class="btn sm"
                  data-chat="${esc(
                    c.id ||
                    ""
                  )}"
                >
                  💬 Ouvrir
                </button>

                <button
                  class="btn red sm"
                  data-clear-chat="${esc(
                    c.id ||
                    ""
                  )}"
                >
                  🗑 Effacer
                </button>

              </div>

            </div>

          </div>

        `
        )
        .join("");


    app
      .querySelectorAll(
        "[data-chat]"
      )
      .forEach(
        btn => {

          btn.onclick =
            () =>
              openChat(
                btn.dataset.chat
              );

        }
      );


    app
      .querySelectorAll(
        "[data-clear-chat]"
      )
      .forEach(
        btn => {

          btn.onclick =
            async () => {

              if(
                !confirm(
                  "Effacer cette conversation ?"
                )
              )
                return;


              try{

                wait(
                  true,
                  "Suppression de la conversation…"
                );


                const {
                  error
                } =
                  await sb.rpc(
                    "controller_clear_conversation",
                    {
                      p_conversation_id:
                        btn.dataset.clearChat
                    }
                  );


                if(error)
                  throw error;


                await refreshStats();
                await renderChats();


              }catch(e){

                alert(
                  "❌ " +
                  e.message
                );

              }finally{

                wait(false);

              }

            };

        }
      );


  }catch(e){

    console.error(e);

    app.innerHTML = `
      <div class="empty">
        <b>Erreur</b>
        <br><br>
        ${esc(
          e.message
        )}
      </div>
    `;
  }
}


/* =========================
   OUVRIR CHAT
========================= */

async function openChat(
  conversationId
){

  try{

    wait(
      true,
      "Ouverture de la conversation…"
    );


    const {
      data:c,
      error
    } =
      await sb.rpc(
        "controller_get_conversation",
        {
          p_conversation_id:
            conversationId
        }
      );


    if(error)
      throw error;


    if(!c){

      alert(
        "Conversation introuvable."
      );

      return;
    }


    const app =
      $("content");


    app.innerHTML = `

      <div class="row">

        <div>

          <h2>
            Conversation privée
          </h2>

          <p
            class="muted"
            style="margin-top:5px"
          >
            Client :
            ${esc(
              c.user_id ||
              "—"
            )}
          </p>

        </div>


        <button
          class="btn dark sm"
          id="back"
        >
          ← Retour
        </button>

      </div>


      <div
        class="chat"
        id="chat"
        style="margin-top:15px"
      >
        <p
          class="muted"
        >
          Chargement…
        </p>
      </div>


      <div class="compose">

        <textarea
          id="msg"
          rows="2"
          placeholder="Répondre au client…"
        ></textarea>

        <button
          class="btn"
          id="send"
        >
          Envoyer
        </button>

      </div>


      <div
        class="item"
        style="margin-top:12px"
      >

        <b>
          📎 Envoyer un fichier au client
        </b>

        <input
          id="file"
          type="file"
          accept="image/*,.pdf,.doc,.docx"
          style="
            display:block;
            margin-top:10px
          "
        >

        <button
          class="btn sm"
          id="sendFile"
          style="margin-top:8px"
        >
          Envoyer
        </button>

      </div>

    `;


    /* =========================
       MESSAGES
    ========================= */

    async function refreshMessages(){

      const {
        data,
        error
      } =
        await sb.rpc(
          "controller_get_messages",
          {
            p_conversation_id:
              conversationId
          }
        );


      if(error){

        $("chat").innerHTML = `
          <p
            style="color:#c00"
          >
            ${esc(
              error.message
            )}
          </p>
        `;

        return;
      }


      const {
        data:{
          user
        }
      } =
        await sb.auth.getUser();


      const box =
        $("chat");


      box.innerHTML =
        (
          data || []
        )
        .map(
          x => `

            <div
              class="
                bubble
                ${
                  x.sender_id ===
                  user?.id
                    ? "me"
                    : "other"
                }
              "
            >

              ${esc(
                x.body
              )}

              <div
                style="
                  font-size:9px;
                  opacity:.65;
                  margin-top:5px
                "
              >

                ${fmt(
                  x.created_at
                )}

                ${
                  x.sender_id ===
                  user?.id
                    ? `
                      <button
                        style="
                          border:0;
                          background:none;
                          cursor:pointer
                        "
                        data-del-msg="${esc(
                          x.id
                        )}"
                      >
                        🗑
                      </button>
                    `
                    : ""
                }

              </div>

            </div>

          `
        )
        .join("")
        ||
        "<p>Aucun message.</p>";


      box
        .querySelectorAll(
          "[data-del-msg]"
        )
        .forEach(
          btn => {

            btn.onclick =
              async () => {

                if(
                  !confirm(
                    "Supprimer ce message ?"
                  )
                )
                  return;


                const {
                  error
                } =
                  await sb.rpc(
                    "controller_delete_message",
                    {
                      p_message_id:
                        btn.dataset.delMsg
                    }
                  );


                if(error){

                  alert(
                    error.message
                  );

                }else{

                  await refreshMessages();

                }

              };

          }
        );


      box.scrollTop =
        box.scrollHeight;
    }


    /* =========================
       SEND MESSAGE
    ========================= */

    $("send").onclick =
      async () => {

        const body =
          $("msg")
            .value
            .trim();


        if(!body)
          return;


        try{

          wait(
            true,
            "Envoi du message…"
          );


          const {
            error
          } =
            await sb.rpc(
              "controller_send_message",
              {
                p_conversation_id:
                  conversationId,

                p_body:
                  body
              }
            );


          if(error)
            throw error;


          $("msg").value =
            "";


          await refreshMessages();


        }catch(e){

          alert(
            e.message
          );

        }finally{

          wait(false);

        }

      };


    /* =========================
       BACK
    ========================= */

    $("back").onclick =
      () =>
        render(
          "chats"
        );


    /* =========================
       SEND FILE
    ========================= */

    $("sendFile").onclick =
      async () => {

        const f =
          $("file")
            .files[0];


        if(!f){

          alert(
            "Choisissez un fichier."
          );

          return;
        }


        const safe =
          f.name.replace(
            /[^a-zA-Z0-9._-]/g,
            "_"
          );


        const path =
          c.user_id +
          "/" +
          crypto.randomUUID() +
          "_" +
          safe;


        try{

          wait(
            true,
            "Envoi du fichier…"
          );


          const r =
            await sb.storage
              .from(BUCKET)
              .upload(
                path,
                f,
                {
                  upsert:false
                }
              );


          if(r.error)
            throw r.error;


          const q =
            await sb.rpc(
              "controller_register_file",
              {
                p_user_id:
                  c.user_id,

                p_file_name:
                  f.name,

                p_storage_path:
                  path,

                p_kind:
                  "controller_file",

                p_expires_at:
                  new Date(
                    Date.now()
                    +
                    48 *
                    3600000
                  ).toISOString()
              }
            );


          if(q.error){

            await sb.storage
              .from(BUCKET)
              .remove([
                path
              ]);

            throw q.error;
          }


          alert(
            "✅ Fichier envoyé."
          );


          $("file")
            .value = "";


          await refreshStats();
          await refreshMessages();


        }catch(e){

          alert(
            "❌ " +
            e.message
          );

        }finally{

          wait(false);

        }

      };


    await refreshMessages();


  }catch(e){

    console.error(e);

    alert(
      "❌ " +
      e.message
    );

  }finally{

    wait(false);

  }
}


/* =========================
   TABS
========================= */

document
  .querySelectorAll(".tab")
  .forEach(
    btn => {

      btn.onclick =
        async () => {

          document
            .querySelectorAll(
              ".tab"
            )
            .forEach(
              x =>
                x.classList
                  .remove(
                    "active"
                  )
            );


          btn.classList
            .add(
              "active"
            );


          await render(
            btn.dataset.view
          );

        };

    }
);


/* =========================
   RENDER
========================= */

async function render(
  view
){

  if(
    view === "orders"
  ){

    await renderOrders();

  }

  else if(
    view === "files"
  ){

    await renderFiles();

  }

  else if(
    view === "chats"
  ){

    await renderChats();

  }
}


/* =========================
   LOGOUT
========================= */

$("logout").onclick =
  async () => {

    sessionStorage
      .removeItem(
        "controllerAccessGranted"
      );

    await sb.auth
      .signOut();

    location.href =
      "mon-espace.html";
  };


/* =========================
   START
========================= */

(async () => {

  try{

    const ok =
      await controllerGuard();


    if(!ok){

      sessionStorage
        .removeItem(
          "controllerAccessGranted"
        );

      location.replace(
        "mon-espace.html"
      );

      return;
    }


    await refreshStats();

    await render(
      "orders"
    );


  }catch(e){

    console.error(e);


    $("content")
      .innerHTML = `

        <div class="empty">

          <b>
            Erreur de démarrage.
          </b>

          <br><br>

          ${esc(
            e.message
          )}

        </div>

      `;

  }

})();


/* =========================
   REALTIME
========================= */

sb.channel(
  "controller-live"
)

.on(
  "postgres_changes",
  {
    event:"*",
    schema:"public",
    table:"orders"
  },
  async () => {

    await refreshStats();

    const active =
      document.querySelector(
        ".tab.active"
      )?.dataset.view ||
      "orders";

    await render(
      active
    );

  }
)

.on(
  "postgres_changes",
  {
    event:"*",
    schema:"public",
    table:"files"
  },
  async () => {

    await refreshStats();

    const active =
      document.querySelector(
        ".tab.active"
      )?.dataset.view;

    if(active)
      await render(
        active
      );

  }
)

.on(
  "postgres_changes",
  {
    event:"*",
    schema:"public",
    table:"conversations"
  },
  async () => {

    await refreshStats();

  }
)

.on(
  "postgres_changes",
  {
    event:"*",
    schema:"public",
    table:"messages"
  },
  async () => {

    const active =
      document.querySelector(
        ".tab.active"
      )?.dataset.view;

    await refreshStats();

    if(
      active === "chats"
    ){

      await render(
        "chats"
      );

    }

  }
)

.subscribe();

</script>
