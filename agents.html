<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SUPABASE_URL = "https://tlkuxqojbjpycgsaqone.supabase.co";
const SUPABASE_KEY = "sb_publishable_AaCz0QDY9858XQtbOBybZw_uXhXfloL";
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
</script><script>
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
async function login(){const code=document.getElementById("code").value.trim(),err=document.getElementById("error");if(!code){err.textContent="Entrez votre code.";return}const {data,error}=await db.rpc("agent_login",{p_code:code});if(error||!data?.ok){err.textContent=data?.message||error?.message||"Connexion impossible.";return}err.textContent="";document.getElementById("login").classList.add("hidden");const a=data.agent;const msgs=data.messages||[];document.getElementById("profile").classList.remove("hidden");document.getElementById("profile").innerHTML=`<div class="profile"><img class="photo" src="${esc(a.photo||'')}" alt="Badge de ${esc(a.nom)}" onerror="this.style.opacity='.35'"><div><span class="tag">ESPACE AGENT</span><div class="name">${esc(a.nom)}</div><div class="role">${esc(a.fonction)}</div><div class="info"><div class="item"><div class="label">Nom</div><div class="value">${esc(a.nom)}</div></div><div class="item"><div class="label">Téléphone</div><div class="value">${esc(a.telephone)}</div></div><div class="item"><div class="label">Fonction</div><div class="value">${esc(a.fonction)}</div></div><div class="item"><div class="label">Code personnel</div><div class="value">••••••••</div></div></div><div class="message"><strong>Messages de l'administration</strong>${msgs.length?msgs.map(m=>`<div class="msg">${esc(m.message)}</div>`).join(""):"<div class=msg>Aucun nouveau message.</div>"}</div><button class="logout" onclick="location.reload()">Se déconnecter</button><div id="agentFinance"></div></div></div>`;await loadAgentMoney(a.code);AKCHAT.start({db,role:"agent",code:a.code||code})}

function moneyHTG(v){return Number(v||0).toLocaleString("fr-FR",{minimumFractionDigits:2,maximumFractionDigits:2})+" HTG"}

async function loadAgentMoney(agentCode){
  const box=document.getElementById("agentFinance");
  const {data,error}=await db.rpc("get_agent_money",{p_agent_code:agentCode});
  if(error||!data?.ok){
    box.innerHTML='<div class="message">Impossible de charger les informations financières.</div>';
    return;
  }
  const withdrawals=(data.history||[]).filter(x=>x.movement_type==="retrait");
  box.innerHTML=`<div class="finance-agent-box">
    <div class="finance-title">Mes revenus & retraits</div>
    <div class="agent-money-grid">
      <div class="agent-money-card"><span>Revenus reçus</span><b>${moneyHTG(data.total_revenu)}</b></div>
      <div class="agent-money-card"><span>Total retraits</span><b>${moneyHTG(data.total_retrait)}</b></div>
      <div class="agent-money-card"><span>Solde disponible</span><b>${moneyHTG(data.solde)}</b></div>
    </div>
    <div class="withdrawals">
      <strong>Retraits</strong>
      ${withdrawals.length ? withdrawals.map(x=>`<div class="withdrawal-row"><span>${new Date(x.created_at).toLocaleString("fr-FR")} · ${esc(x.description||"Retrait")}</span><span class="withdrawal-amount">− ${moneyHTG(x.amount)}</span></div>`).join("") : '<div class="empty-money" style="margin-top:10px">Aucun retrait enregistré.</div>'}
    </div>
  </div>`;
}

document.getElementById("code").addEventListener("keydown",e=>{if(e.key==="Enter")login()});
</script>
