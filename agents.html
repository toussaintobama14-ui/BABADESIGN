<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Akademi Dizay — Espace Agents</title>
<style>
:root{
  --red:#e60000;
  --orange:#ff7300;
  --yellow:#ffd000;
  --dark:#111;
  --white:#fff;
  --gray:#666;
  --light:#f7f7f7;
  --border:#ececec;
  --shadow:0 25px 75px rgba(17,17,17,.09);
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--white);color:var(--dark);min-height:100vh;line-height:1.5}
body:before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 8% 0%,rgba(255,115,0,.08),transparent 30%),radial-gradient(circle at 95% 15%,rgba(230,0,0,.06),transparent 30%);pointer-events:none}
.wrap{width:min(1100px,92%);margin:auto;position:relative;z-index:1}
.top{padding:42px 0 28px;text-align:left}
.brand{font-weight:950;letter-spacing:.16em;color:var(--red);font-size:12px}
.top h1{font-size:clamp(34px,6vw,58px);line-height:1;margin:10px 0 8px;letter-spacing:-.045em}
.top p{color:var(--gray);margin:0}
.card{background:rgba(255,255,255,.97);border:1px solid var(--border);border-radius:26px;padding:30px;box-shadow:var(--shadow)}
.card h2{margin:0 0 8px;font-size:24px;letter-spacing:-.02em}
input,button{width:100%;padding:15px 16px;border-radius:13px;border:1px solid #ddd;background:var(--white);color:var(--dark);font:inherit;outline:none;transition:border-color .2s,box-shadow .2s,transform .2s}
input:focus{border-color:var(--red);box-shadow:0 0 0 4px rgba(230,0,0,.08)}
button{margin-top:12px;background:var(--red);border-color:var(--red);color:var(--white);font-weight:850;cursor:pointer;box-shadow:0 10px 22px rgba(230,0,0,.15)}
button:hover{background:#c90000;border-color:#c90000;transform:translateY(-1px)}
.error{color:var(--red);min-height:22px;margin-top:10px}
.hidden{display:none!important}
.profile{display:grid;grid-template-columns:minmax(230px,290px) 1fr;gap:32px;align-items:start}
.photo{width:100%;height:auto;max-height:520px;aspect-ratio:auto;object-fit:contain;background:#f7f7f7;border:1px solid var(--border);border-radius:20px;padding:7px;display:block}
.tag{display:inline-block;background:#fff0ee;color:var(--red);padding:7px 11px;border-radius:99px;font-size:11px;font-weight:900;letter-spacing:.06em}
.name{font-size:clamp(30px,5vw,48px);line-height:1.05;margin:13px 0 5px;letter-spacing:-.045em}
.role{color:var(--gray);font-size:17px}
.info{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:23px}
.item{padding:16px;border:1px solid var(--border);border-radius:15px;background:#fafafa}
.label{color:#777;font-size:10px;text-transform:uppercase;letter-spacing:.09em;font-weight:800}
.value{margin-top:5px;font-weight:750}
.message{margin-top:16px;padding:18px;border-left:4px solid var(--orange);background:#fff8f3;border-radius:12px;color:#444;line-height:1.6}
.msg{padding:12px 0;border-bottom:1px solid #eee}
.msg:last-child{border-bottom:0}
.logout{max-width:200px;background:#fff!important;color:var(--dark)!important;border-color:#ddd!important;box-shadow:none!important}
.logout:hover{color:var(--red)!important;border-color:#ffb3a8!important;background:#fff8f7!important}
.foot{text-align:center;color:#888;padding:27px;font-size:12px}

/* Finance */
.finance-agent-box{margin-top:22px}
.finance-title{font-weight:900;font-size:19px;margin-bottom:13px}
.agent-money-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.agent-money-card{padding:16px;border:1px solid var(--border);border-radius:15px;background:#fafafa}
.agent-money-card span{display:block;color:#777;font-size:10px;text-transform:uppercase;letter-spacing:.08em;font-weight:800}
.agent-money-card b{display:block;margin-top:5px;font-size:20px}
.withdrawals{margin-top:15px;border:1px solid var(--border);border-radius:15px;padding:15px;background:#fff}
.withdrawal-row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid #eee;font-size:13px}
.withdrawal-row:last-child{border-bottom:0}
.withdrawal-amount{font-weight:900;color:var(--red)}
.empty-money{color:#777;font-size:13px}
@media(max-width:760px){.profile{grid-template-columns:1fr}.photo{width:min(100%,320px);margin:auto}.info{grid-template-columns:1fr}}
@media(max-width:520px){.card{padding:20px}.top{padding-top:30px}}
</style></head><body><div class="wrap"><header class="top"><div class="brand">AKADEMI DIZAY</div><h1>Espace Agents</h1><p>Connectez-vous avec votre code personnel.</p></header>
<section id="login" class="card"><h2>Accès personnel</h2><p style="color:#666">Entrez votre code d'accès pour consulter votre espace.</p><input id="code" type="password" placeholder="Code d'accès personnel" autocomplete="off"><button onclick="login()">Accéder à mon espace</button><div id="error" class="error"></div></section>
<section id="profile" class="card hidden"></section><div class="foot">Akademi Dizay • Espace réservé aux membres</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SUPABASE_URL = "https://tlkuxqojbjpycgsaqone.supabase.co";
const SUPABASE_KEY = "sb_publishable_AaCz0QDY9858XQtbOBybZw_uXhXfloL";
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
</script><script>
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
async function login(){const code=document.getElementById("code").value.trim(),err=document.getElementById("error");if(!code){err.textContent="Entrez votre code.";return}const {data,error}=await db.rpc("agent_login",{p_code:code});if(error||!data?.ok){err.textContent=data?.message||error?.message||"Connexion impossible.";return}err.textContent="";document.getElementById("login").classList.add("hidden");const a=data.agent;const msgs=data.messages||[];document.getElementById("profile").classList.remove("hidden");document.getElementById("profile").innerHTML=`<div class="profile"><img class="photo" src="${esc(a.photo||'')}" alt="Badge de ${esc(a.nom)}" onerror="this.style.opacity='.35'"><div><span class="tag">ESPACE AGENT</span><div class="name">${esc(a.nom)}</div><div class="role">${esc(a.fonction)}</div><div class="info"><div class="item"><div class="label">Nom</div><div class="value">${esc(a.nom)}</div></div><div class="item"><div class="label">Téléphone</div><div class="value">${esc(a.telephone)}</div></div><div class="item"><div class="label">Fonction</div><div class="value">${esc(a.fonction)}</div></div><div class="item"><div class="label">Code personnel</div><div class="value">••••••••</div></div></div><div class="message"><strong>Messages de l'administration</strong>${msgs.length?msgs.map(m=>`<div class="msg">${esc(m.message)}</div>`).join(""):"<div class=msg>Aucun nouveau message.</div>"}</div><button class="logout" onclick="location.reload()">Se déconnecter</button><div id="agentFinance"></div><button class="logout" onclick="location.reload()">Se déconnecter</button></div></div>`;await loadAgentMoney(a.code)}

function moneyHTG(v){return Number(v||0).toLocaleString("fr-FR",{minimumFractionDigits:2,maximumFractionDigits:2})+" HTG"}

async function loadAgentMoney(agentCode){
  const box=document.getElementById("agentFinance");
  const {data,error}=await db.rpc("get_agent_money",{p_agent_code:agentCode});
  if(error||!data?.ok){
    box.innerHTML='<div class="message">Impossible de charger les informations financières.</div>';
    return;
  }
  const withdrawals=(data.history||[]).filter(x=>x.movement_type==="retrait");
  box.innerHTML=`<div class="finance-agent-box">
    <div class="finance-title">Mes revenus & retraits</div>
    <div class="agent-money-grid">
      <div class="agent-money-card"><span>Revenus reçus</span><b>${moneyHTG(data.total_revenu)}</b></div>
      <div class="agent-money-card"><span>Total retraits</span><b>${moneyHTG(data.total_retrait)}</b></div>
      <div class="agent-money-card"><span>Solde disponible</span><b>${moneyHTG(data.solde)}</b></div>
    </div>
    <div class="withdrawals">
      <strong>Retraits</strong>
      ${withdrawals.length ? withdrawals.map(x=>`<div class="withdrawal-row"><span>${new Date(x.created_at).toLocaleString("fr-FR")} · ${esc(x.description||"Retrait")}</span><span class="withdrawal-amount">− ${moneyHTG(x.amount)}</span></div>`).join("") : '<div class="empty-money" style="margin-top:10px">Aucun retrait enregistré.</div>'}
    </div>
  </div>`;
}

document.getElementById("code").addEventListener("keydown",e=>{if(e.key==="Enter")login()});
</script></body></html>
