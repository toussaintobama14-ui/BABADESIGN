<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Akademi Dizay — Espace Agents</title>
<style>
:root{
  --red:#e60000;
  --orange:#ff7300;
  --yellow:#ffd000;
  --dark:#111;
  --white:#fff;
  --gray:#666;
  --light:#f7f7f7;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:var(--white);color:var(--dark);min-height:100vh;overflow-x:hidden;
}
body:before{
  content:"";position:fixed;inset:0;pointer-events:none;
  background:
    radial-gradient(circle at 8% 5%,rgba(230,0,0,.08),transparent 28%),
    radial-gradient(circle at 92% 18%,rgba(255,115,0,.08),transparent 30%),
    radial-gradient(circle at 50% 100%,rgba(255,208,0,.07),transparent 34%);
}
.wrap{width:min(1050px,92%);margin:auto;position:relative;z-index:1}
.top{padding:38px 0 28px;text-align:center}
.brand{
  display:inline-flex;align-items:center;gap:8px;
  font-weight:950;letter-spacing:.16em;color:var(--dark);font-size:12px
}
.brand:before{content:"";width:9px;height:9px;border-radius:50%;background:linear-gradient(135deg,var(--red),var(--orange))}
.top h1{
  font-size:clamp(34px,6vw,62px);line-height:1.02;margin:12px 0 8px;letter-spacing:-.05em;
  background:linear-gradient(90deg,var(--red),var(--orange),var(--yellow));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.top p{color:var(--gray);margin:0}
.card{
  background:var(--white);border:1px solid #e9e9e9;border-radius:26px;padding:28px;
  box-shadow:0 20px 60px rgba(17,17,17,.08);position:relative;overflow:hidden;
  animation:cardIn .45s ease both
}
.card:before{
  content:"";position:absolute;left:0;top:0;width:100%;height:4px;
  background:linear-gradient(90deg,var(--red),var(--orange),var(--yellow))
}
@keyframes cardIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
input,button{
  width:100%;padding:15px 16px;border-radius:13px;border:1px solid #ddd;
  background:var(--white);color:var(--dark);font-size:16px;outline:none;
  transition:border-color .2s,box-shadow .2s,transform .2s
}
input:focus{border-color:var(--orange);box-shadow:0 0 0 4px rgba(255,115,0,.10)}
button{
  margin-top:12px;border:0;background:linear-gradient(135deg,var(--red),var(--orange));
  color:var(--white);font-weight:850;cursor:pointer;box-shadow:0 10px 24px rgba(230,0,0,.18)
}
button:hover{transform:translateY(-2px);filter:brightness(1.04)}
.error{color:var(--red);min-height:22px;margin-top:10px}
.hidden{display:none}
.profile{
  display:grid;grid-template-columns:minmax(190px,240px) 1fr;gap:28px;align-items:start
}
.photo{
  width:100%;height:auto;aspect-ratio:auto;max-height:420px;
  border-radius:20px;object-fit:contain;object-position:center;
  background:var(--light);border:1px solid #e5e5e5;padding:5px;
  display:block;box-shadow:0 14px 35px rgba(17,17,17,.08)
}
.tag{
  display:inline-block;background:linear-gradient(135deg,var(--red),var(--orange));
  color:var(--white);padding:7px 11px;border-radius:99px;font-size:11px;font-weight:900;
  letter-spacing:.04em
}
.name{font-size:clamp(28px,5vw,46px);margin:12px 0 4px;letter-spacing:-.04em}
.role{color:var(--gray);font-size:17px}
.info{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:22px}
.item{padding:16px;border:1px solid #e8e8e8;border-radius:15px;background:var(--light)}
.label{color:var(--gray);font-size:11px;text-transform:uppercase;letter-spacing:.08em}
.value{margin-top:5px;font-weight:700}
.message{
  margin-top:14px;padding:18px;border-left:4px solid transparent;
  border-image:linear-gradient(180deg,var(--red),var(--orange),var(--yellow)) 1;
  background:var(--light);border-radius:12px;color:#333;line-height:1.6
}
.msg{padding:12px;border-bottom:1px solid #e9e9e9}
.msg:last-child{border-bottom:0}
.logout{max-width:180px;background:var(--white);color:var(--dark);border:1px solid #ddd;box-shadow:none}
.foot{text-align:center;color:#888;padding:25px;font-size:12px}
.finance-agent-box{margin-top:20px;padding-top:20px;border-top:1px solid #e9e9e9}
.finance-title{font-weight:900;font-size:18px;margin-bottom:12px}
.agent-money-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.agent-money-card{padding:15px;border:1px solid #e7e7e7;border-radius:15px;background:var(--light)}
.agent-money-card span{display:block;color:var(--gray);font-size:10px;text-transform:uppercase;letter-spacing:.08em}
.agent-money-card b{display:block;margin-top:5px;font-size:20px}
.withdrawals{margin-top:14px;border:1px solid #e7e7e7;border-radius:15px;padding:15px;background:var(--white)}
.withdrawal-row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid #eee;font-size:13px}
.withdrawal-row:last-child{border-bottom:0}
.withdrawal-amount{font-weight:900;color:var(--red)}
.empty-money{color:var(--gray);font-size:13px}
@media(max-width:700px){
  .profile{grid-template-columns:1fr}
  .photo{width:auto;max-width:100%;max-height:380px;margin:0 auto}
  .info{grid-template-columns:1fr}
  .agent-money-grid{grid-template-columns:1fr}
  .withdrawal-row{flex-direction:column}
  .card{padding:20px}
}
</style></head><body><div class="wrap"><header class="top"><div class="brand">AKADEMI DIZAY</div><h1>Espace Agents</h1><p>Connectez-vous avec votre code personnel.</p></header>
<section id="login" class="card"><h2>Accès personnel</h2><p style="color:#666">Entrez votre code d'accès pour consulter votre espace.</p><input id="code" type="password" placeholder="Code d'accès personnel" autocomplete="off"><button onclick="login()">Accéder à mon espace</button><div id="error" class="error"></div></section>
<section id="profile" class="card hidden"></section><div class="foot">Akademi Dizay • Espace réservé aux membres</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SUPABASE_URL = "https://tlkuxqojbjpycgsaqone.supabase.co";
const SUPABASE_KEY = "sb_publishable_AaCz0QDY9858XQtbOBybZw_uXhXfloL";
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
</script><script>
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
async function login(){const code=document.getElementById("code").value.trim(),err=document.getElementById("error");if(!code){err.textContent="Entrez votre code.";return}const {data,error}=await db.rpc("agent_login",{p_code:code});if(error||!data?.ok){err.textContent=data?.message||error?.message||"Connexion impossible.";return}err.textContent="";document.getElementById("login").classList.add("hidden");const a=data.agent;const msgs=data.messages||[];document.getElementById("profile").classList.remove("hidden");document.getElementById("profile").innerHTML=`<div class="profile"><img class="photo" src="${esc(a.photo||'')}" alt="Badge de ${esc(a.nom)}" onerror="this.style.opacity='.35'"><div><span class="tag">ESPACE AGENT</span><div class="name">${esc(a.nom)}</div><div class="role">${esc(a.fonction)}</div><div class="info"><div class="item"><div class="label">Nom</div><div class="value">${esc(a.nom)}</div></div><div class="item"><div class="label">Téléphone</div><div class="value">${esc(a.telephone)}</div></div><div class="item"><div class="label">Fonction</div><div class="value">${esc(a.fonction)}</div></div><div class="item"><div class="label">Code personnel</div><div class="value">••••••••</div></div></div><div class="message"><strong>Messages de l'administration</strong>${msgs.length?msgs.map(m=>`<div class="msg">${esc(m.message)}</div>`).join(""):"<div class=msg>Aucun nouveau message.</div>"}</div><button class="logout" onclick="location.reload()">Se déconnecter</button><div id="agentFinance"></div></div></div>`;await loadAgentMoney(a.code)}

function moneyHTG(v){return Number(v||0).toLocaleString("fr-FR",{minimumFractionDigits:2,maximumFractionDigits:2})+" HTG"}

async function loadAgentMoney(agentCode){
  const box=document.getElementById("agentFinance");
  const {data,error}=await db.rpc("get_agent_money",{p_agent_code:agentCode});
  if(error||!data?.ok){
    box.innerHTML='<div class="message">Impossible de charger les informations financières.</div>';
    return;
  }
  const withdrawals=(data.history||[]).filter(x=>x.movement_type==="retrait");
  box.innerHTML=`<div class="finance-agent-box">
    <div class="finance-title">Mes revenus & retraits</div>
    <div class="agent-money-grid">
      <div class="agent-money-card"><span>Revenus reçus</span><b>${moneyHTG(data.total_revenu)}</b></div>
      <div class="agent-money-card"><span>Total retraits</span><b>${moneyHTG(data.total_retrait)}</b></div>
      <div class="agent-money-card"><span>Solde disponible</span><b>${moneyHTG(data.solde)}</b></div>
    </div>
    <div class="withdrawals">
      <strong>Retraits</strong>
      ${withdrawals.length ? withdrawals.map(x=>`<div class="withdrawal-row"><span>${new Date(x.created_at).toLocaleString("fr-FR")} · ${esc(x.description||"Retrait")}</span><span class="withdrawal-amount">− ${moneyHTG(x.amount)}</span></div>`).join("") : '<div class="empty-money" style="margin-top:10px">Aucun retrait enregistré.</div>'}
    </div>
  </div>`;
}

document.getElementById("code").addEventListener("keydown",e=>{if(e.key==="Enter")login()});
</script></body></html>
