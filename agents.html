<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Akademi Dizay — Espace Agents</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:#090909;color:#fff;min-height:100vh}
body:before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 20% 10%,rgba(150,0,0,.18),transparent 35%),radial-gradient(circle at 80% 80%,rgba(100,0,0,.14),transparent 35%);pointer-events:none}
.wrap{width:min(1050px,92%);margin:auto;position:relative;z-index:1}.top{padding:28px 0;text-align:center}.brand{font-weight:900;letter-spacing:.12em;color:#e10000;font-size:13px}.top h1{font-size:clamp(30px,6vw,58px);margin:12px 0 8px}.top p{color:#aaa;margin:0}
.card{background:rgba(20,20,20,.9);border:1px solid #292929;border-radius:24px;padding:28px;box-shadow:0 25px 70px rgba(0,0,0,.35);backdrop-filter:blur(14px)}
input,button{width:100%;padding:15px 16px;border-radius:13px;border:1px solid #333;background:#0e0e0e;color:#fff;font-size:16px;outline:none}input:focus{border-color:#c40000}button{margin-top:12px;background:#b80000;border-color:#d00000;font-weight:800;cursor:pointer;transition:.25s}button:hover{transform:translateY(-2px);background:#d00000}.error{color:#ff6565;min-height:22px;margin-top:10px}
.hidden{display:none}.profile{display:grid;grid-template-columns:240px 1fr;gap:28px;align-items:start}.photo{width:100%;aspect-ratio:1;border-radius:20px;object-fit:cover;background:#161616;border:1px solid #333}.tag{display:inline-block;background:#300000;color:#ff5b5b;padding:7px 11px;border-radius:99px;font-size:12px;font-weight:800}.name{font-size:clamp(28px,5vw,46px);margin:12px 0 4px}.role{color:#bbb;font-size:17px}.info{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:22px}.item{padding:16px;border:1px solid #292929;border-radius:15px;background:#111}.label{color:#777;font-size:11px;text-transform:uppercase;letter-spacing:.08em}.value{margin-top:5px;font-weight:700}.message{margin-top:14px;padding:18px;border-left:3px solid #d00000;background:#130b0b;border-radius:12px;color:#ddd;line-height:1.6}.logout{max-width:180px;background:#171717;border-color:#333}.foot{text-align:center;color:#666;padding:25px;font-size:12px}
@media(max-width:700px){.profile{grid-template-columns:1fr}.photo{max-width:230px;margin:auto}.info{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<header class="top"><div class="brand">AKADEMI DIZAY</div><h1>Espace Agents</h1><p>Connectez-vous avec votre code personnel.</p></header>
<section id="login" class="card">
  <h2>Accès personnel</h2>
  <p style="color:#999">Entrez votre code d'accès pour consulter votre espace.</p>
  <input id="code" type="password" placeholder="Code d'accès personnel" autocomplete="off">
  <button onclick="login()">Accéder à mon espace</button>
  <div id="error" class="error"></div>
</section>
<section id="profile" class="card hidden"></section>
<div class="foot">Akademi Dizay • Espace réservé aux membres</div>
</div>
<script>
/* =========================================================
   AJOUTEZ / MODIFIEZ VOS AGENTS ICI
   Chaque code doit être UNIQUE.
   La photo peut être un chemin local, ex: "images/agent-001.jpg"
   ========================================================= */
const agents = [
  {code:"AD001",nom:"Nom de l'agent",telephone:"0000-0000",fonction:"Agent",photo:"images/agent-001.jpg"},
  {code:"AD002",nom:"Nom de l'agent 2",telephone:"0000-0001",fonction:"Agent",photo:"images/agent-002.jpg"}
];

const messageGeneral = "Bienvenue dans votre espace agent. Consultez régulièrement cet espace pour recevoir les informations de l'administration.";

function login(){
  const code=document.getElementById("code").value.trim();
  const agent=agents.find(a=>a.code.toLowerCase()===code.toLowerCase());
  const err=document.getElementById("error");
  if(!agent){err.textContent="Code d'accès incorrect.";return;}
  err.textContent="";
  document.getElementById("login").classList.add("hidden");
  const p=document.getElementById("profile");
  p.classList.remove("hidden");
  p.innerHTML=`
    <div class="profile">
      <img class="photo" src="${escapeHtml(agent.photo)}" alt="Badge de ${escapeHtml(agent.nom)}" onerror="this.style.opacity='.35'">
      <div>
        <span class="tag">ESPACE AGENT</span>
        <div class="name">${escapeHtml(agent.nom)}</div>
        <div class="role">${escapeHtml(agent.fonction)}</div>
        <div class="info">
          <div class="item"><div class="label">Nom</div><div class="value">${escapeHtml(agent.nom)}</div></div>
          <div class="item"><div class="label">Téléphone</div><div class="value">${escapeHtml(agent.telephone)}</div></div>
          <div class="item"><div class="label">Fonction</div><div class="value">${escapeHtml(agent.fonction)}</div></div>
          <div class="item"><div class="label">Code personnel</div><div class="value">••••••••</div></div>
        </div>
        <div class="message"><strong>Message de l'administration</strong><br>${escapeHtml(messageGeneral)}</div>
        <button class="logout" onclick="location.reload()">Se déconnecter</button>
      </div>
    </div>`;
}
function escapeHtml(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));}
document.getElementById("code").addEventListener("keydown",e=>{if(e.key==="Enter")login()});
</script>
</body>
</html>
