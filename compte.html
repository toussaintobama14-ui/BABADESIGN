<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mon espace | Baba Design</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--r:#e60000;--o:#ff7300;--y:#ffd000;--d:#111;--g:#666;--l:#f7f7f7}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--l);color:var(--d)}header{background:#111;color:#fff;padding:18px 6%;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}header b{font-size:22px}header b span{color:#ff7300}.wrap{max-width:1100px;margin:30px auto;padding:0 18px}.hero,.card{background:#fff;border:1px solid #eee;border-radius:22px;padding:22px;margin-bottom:18px;box-shadow:0 8px 30px #0000000d}.hero{background:linear-gradient(135deg,#111,#242424);color:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:15px}.stat{padding:20px;border-radius:18px;background:#fff;border:1px solid #eee}.stat strong{display:block;font-size:26px;margin-top:7px}.btn{border:0;border-radius:13px;padding:12px 17px;font-weight:800;cursor:pointer;background:#111;color:#fff}.btn.red{background:linear-gradient(135deg,var(--r),var(--o))}.btn.light{background:#f1f1f1;color:#111}.input{width:100%;padding:13px;border:1px solid #ddd;border-radius:12px;margin:7px 0 12px}.hidden{display:none}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.pill{padding:8px 12px;border-radius:99px;background:#eee;font-size:12px}.row{padding:14px 0;border-bottom:1px solid #eee}.row:last-child{border:0}.auth{max-width:500px;margin:60px auto}.msg{padding:12px;border-radius:12px;background:#fff3cd;margin:10px 0}.ok{background:#e8fff0}.danger{background:#ffecec}.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.plan{border:1px solid #eee;border-radius:18px;padding:18px}.plan h3{margin-top:0}.price{font-size:24px;font-weight:900}.file{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px;background:#fafafa;border-radius:13px;margin:8px 0}@media(max-width:600px){header{padding:15px}.wrap{margin-top:18px}.hero{padding:18px}}</style></head><body><header><b>Baba<span>Design</span></b><button id="logout" class="btn light hidden">Déconnexion</button></header><main class="wrap"><section id="auth" class="auth card"><h1>Mon espace</h1><div class="tabs"><button class="btn light" id="showLogin">Connexion</button><button class="btn light" id="showRegister">Créer un compte</button></div><div id="loginBox"><input id="loginName" class="input" placeholder="Nom" autocomplete="username"><input id="loginPass" type="password" class="input" placeholder="Mot de passe" autocomplete="current-password"><button id="login" class="btn red">Se connecter</button></div><div id="registerBox" class="hidden"><input id="regName" class="input" placeholder="Nom complet"><input id="regPhone" class="input" placeholder="Téléphone (facultatif)"><input id="regPass" type="password" class="input" placeholder="Mot de passe (6 caractères minimum)"><button id="register" class="btn red">Créer mon compte</button></div><div id="authMsg"></div></section><section id="app" class="hidden"><div class="hero"><small>MON ESPACE</small><h1 id="hello">Bonjour</h1><p>Retrouvez ici votre solde, vos abonnements, commandes, fichiers et messages.</p><button class="btn red" onclick="location.href='recharge.html'">+ Recharger</button></div><div class="grid"><div class="stat"><small>Solde</small><strong id="balance">0 HTG</strong></div><div class="stat"><small>Crédits images</small><strong id="credits">0</strong></div><div class="stat"><small>Abonnement</small><strong id="plan">Aucun</strong></div><div class="stat"><small>Expiration</small><strong id="expires">—</strong></div></div><section class="card" id="abonnements"><h2>Abonnements</h2><div id="plans" class="plans"></div></section><section class="card" id="commandes"><h2>Mes commandes</h2><div id="orders">Chargement…</div></section><section class="card"><h2>Mes fichiers</h2><input id="filePick" type="file" multiple accept="image/*,video/*,.pdf"><button id="upload" class="btn red">Envoyer les fichiers</button><div id="files"></div></section><section class="card"><h2>Messages</h2><div id="messages">Chargement…</div><input id="messageInput" class="input" placeholder="Écrire un message au contrôleur"><button id="sendMessage" class="btn">Envoyer</button></section></section></main><script>const URL='https://lfihazvagywraxhbjcqr.supabase.co',KEY='sb_publishable_IbhpDt8dvcHZOuxy17uGzQ_YaqUHIpm',sb=supabase.createClient(URL,KEY);const $=id=>document.getElementById(id);const emailFor=n=>n.trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'.').replace(/^\.|\.$/g,'')+'@baba-account.local';function msg(t,ok=false){$('authMsg').innerHTML='<div class="msg '+(ok?'ok':'danger')+'">'+t+'</div>'}async function load(){const {data:{user}}=await sb.auth.getUser();if(!user){$('auth').classList.remove('hidden');return}$('auth').classList.add('hidden');$('app').classList.remove('hidden');$('logout').classList.remove('hidden');const [{data:p},{data:w},{data:sub},{data:orders},{data:plans},{data:files},{data:messages}]=await Promise.all([sb.from('profiles').select('*').eq('id',user.id).single(),sb.from('wallets').select('*').eq('user_id',user.id).single(),sb.from('subscriptions').select('*,subscription_plans(*)').eq('user_id',user.id).eq('status','active').order('expires_at',{ascending:false}).limit(1).maybeSingle(),sb.from('orders').select('*').eq('user_id',user.id).order('created_at',{ascending:false}),sb.from('subscription_plans').select('*').eq('active',true).order('price_htg'),sb.from('user_files').select('*').eq('user_id',user.id).order('created_at',{ascending:false}),sb.from('messages').select('*').eq('user_id',user.id).order('created_at',{ascending:false})]);$('hello').textContent='Bonjour, '+(p?.full_name||'');$('balance').textContent=(w?.balance_htg||0)+' HTG';$('credits').textContent=sub?.credits_remaining??0;$('plan').textContent=sub?.subscription_plans?.name||'Aucun';$('expires').textContent=sub?.expires_at?new Date(sub.expires_at).toLocaleDateString('fr-FR'):'—';$('plans').innerHTML=(plans||[]).map(x=>`<div class="plan"><h3>${x.name}</h3><div class="price">${x.price_htg} HTG</div><p>${x.image_credits} images · ${x.duration_days} jours</p><button class="btn red" onclick="requestPlan(${x.id})">Demander</button></div>`).join('');$('orders').innerHTML=(orders||[]).length?(orders||[]).map(o=>`<div class="row"><b>${o.service_name}</b><br><span class="pill">${o.status}</span> · ${o.price_htg} HTG<br><small>${new Date(o.created_at).toLocaleString('fr-FR')}</small>${o.controller_note?`<p>${o.controller_note}</p>`:''}</div>`).join(''):'Aucune commande.';$('files').innerHTML=(files||[]).map(f=>`<div class="file"><span>${f.file_name}</span><button class="btn light" onclick="downloadFile('${f.storage_path}','${f.file_name.replace(/'/g,"\\'")}')">Télécharger</button></div>`).join('')||'Aucun fichier.';$('messages').innerHTML=(messages||[]).map(m=>`<div class="row"><b>${m.sender==='controller'?'Contrôleur':'Vous'}</b><br>${m.body}<br><small>${new Date(m.created_at).toLocaleString('fr-FR')}</small></div>`).join('')||'Aucun message.'}async function requestPlan(id){const {data:{user}}=await sb.auth.getUser();if(!user)return;const {error}=await sb.from('messages').insert({user_id:user.id,sender:'user',body:'Je souhaite demander l’abonnement #'+id+'. Merci de traiter ma demande.'});alert(error?error.message:'Demande envoyée au contrôleur.');load()}async function downloadFile(path,name){const {data,error}=await sb.storage.from('user-files').createSignedUrl(path,300);if(error)return alert(error.message);const a=document.createElement('a');a.href=data.signedUrl;a.download=name;a.target='_blank';a.click()}$('showLogin').onclick=()=>{$('loginBox').classList.remove('hidden');$('registerBox').classList.add('hidden')};$('showRegister').onclick=()=>{$('loginBox').classList.add('hidden');$('registerBox').classList.remove('hidden')};$('register').onclick=async()=>{const name=$('regName').value.trim(),pass=$('regPass').value;if(!name||pass.length<6)return msg('Nom et mot de passe de 6 caractères minimum requis.');const {error}=await sb.auth.signUp({email:emailFor(name),password:pass,options:{data:{full_name:name,phone:$('regPhone').value.trim()}}});if(error)return msg(error.message);msg('Compte créé. Vous pouvez maintenant vous connecter.',true)};$('login').onclick=async()=>{const name=$('loginName').value.trim(),pass=$('loginPass').value;if(!name||!pass)return msg('Entrez votre nom et votre mot de passe.');const {error}=await sb.auth.signInWithPassword({email:emailFor(name),password:pass});if(error)return msg('Nom ou mot de passe incorrect.');load()};$('logout').onclick=async()=>{await sb.auth.signOut();location.reload()};$('upload').onclick=async()=>{const {data:{user}}=await sb.auth.getUser();if(!user)return;const files=[...$('filePick').files];if(!files.length)return alert('Choisissez au moins un fichier.');for(const f of files){const path=user.id+'/'+Date.now()+'_'+f.name.replace(/[^a-zA-Z0-9._-]/g,'_');const {error}=await sb.storage.from('user-files').upload(path,f,{upsert:false});if(error){alert(error.message);continue}await sb.from('user_files').insert({user_id:user.id,kind:'input',file_name:f.name,storage_path:path,mime_type:f.type,file_size:f.size})}alert('Fichiers envoyés.');load()};$('sendMessage').onclick=async()=>{const {data:{user}}=await sb.auth.getUser(),body=$('messageInput').value.trim();if(!user||!body)return;await sb.from('messages').insert({user_id:user.id,sender:'user',body});$('messageInput').value='';load()};load();</script></body></html>
