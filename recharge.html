<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recharger | Baba Design</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--r:#e60000;--o:#ff7300}*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f7f7f7;color:#111}.wrap{max-width:650px;margin:35px auto;padding:18px}.card{background:#fff;border-radius:24px;padding:25px;box-shadow:0 10px 35px #0001}h1{margin-top:0}.pay{background:#111;color:#fff;border-radius:18px;padding:20px;margin:18px 0}.pay b{color:#ffd000}.input{width:100%;padding:14px;border:1px solid #ddd;border-radius:12px;margin:7px 0 15px}.btn{width:100%;padding:14px;border:0;border-radius:13px;background:linear-gradient(135deg,var(--r),var(--o));color:#fff;font-weight:900;cursor:pointer}.status{margin-top:15px;padding:14px;border-radius:13px;background:#fff3cd}.back{display:inline-block;margin-bottom:15px;color:#111;font-weight:800;text-decoration:none}</style></head><body><main class="wrap"><a class="back" href="compte.html">← Mon espace</a><section class="card"><h1>Recharger mon solde</h1><p>Le solde est ajouté uniquement après validation du contrôleur.</p><div class="pay"><b>NatCash</b><br><br>Numéro : <strong>40052773</strong><br>Nom : <strong>Marie Alberte Darisme</strong></div><label>Montant (HTG)</label><input id="amount" class="input" type="number" min="1" step="0.01" placeholder="Ex : 1000"><label>Code de transaction</label><input id="code" class="input" placeholder="Entrez le transcode NatCash"><button id="send" class="btn">Recharger</button><div id="status"></div><hr style="margin:25px 0;border:0;border-top:1px solid #eee"><h3>Mes demandes récentes</h3><div id="history">Chargement…</div></section></main><script>const sb=supabase.createClient('https://lfihazvagywraxhbjcqr.supabase.co','sb_publishable_IbhpDt8dvcHZOuxy17uGzQ_YaqUHIpm');const $=id=>document.getElementById(id);async function load(){const {data:{user}}=await sb.auth.getUser();if(!user){location.href='compte.html';return}const {data,error}=await sb.from('recharge_requests').select('*').eq('user_id',user.id).order('created_at',{ascending:false}).limit(10);if(error){$('history').textContent=error.message;return}$('history').innerHTML=(data||[]).map(x=>`<div style="padding:12px 0;border-bottom:1px solid #eee"><b>${x.amount_htg} HTG</b> · ${x.status}<br><small>${new Date(x.created_at).toLocaleString('fr-FR')}</small>${x.controller_note?`<br>${x.controller_note}`:''}</div>`).join('')||'Aucune demande.'}$('send').onclick=async()=>{const {data:{user}}=await sb.auth.getUser();if(!user)return location.href='compte.html';const amount=parseFloat($('amount').value),code=$('code').value.trim();if(!amount||amount<=0||!code)return $('status').innerHTML='<div class="status">Veuillez remplir le montant et le code de transaction.</div>';const {error}=await sb.from('recharge_requests').insert({user_id:user.id,amount_htg:amount,transaction_code:code});$('status').innerHTML=error?`<div class="status">${error.message}</div>`:'<div class="status">Demande envoyée. Veuillez patienter jusqu’à la validation de l’administration.</div>';if(!error){$('amount').value='';$('code').value='';load()}};load();</script></body></html>
