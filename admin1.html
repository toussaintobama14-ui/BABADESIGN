<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Espace Prof & Élèves | Baba Design</title>
<style>
:root{--cy:#12d6f5;--navy:#07111f;--ink:#0b1b2e;--mut:#4a5d72;--line:#dbe6f0;--bl:#0876c9}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Manrope,Inter,system-ui,sans-serif;background:#f5f8fc;color:var(--ink)}
[hidden]{display:none!important}
.btn{border:0;cursor:pointer;font:inherit;font-weight:800;padding:11px 20px;border-radius:999px;background:linear-gradient(135deg,#12d6f5,#4aa8ff);color:#04121f}
.btn.ghost{background:#e6f8fd;color:var(--bl)}.btn:disabled{opacity:.5}
input,select,textarea{font:inherit;padding:12px;border-radius:12px;border:1px solid var(--line);background:#fff;color:var(--ink);width:100%}
#login{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#07111f,#0a1f3d 55%,#0b3350)}
#login form{width:min(400px,100%);background:#0a1a2c;border:1px solid rgba(18,214,245,.35);border-radius:24px;padding:32px;color:#fff;display:grid;gap:14px}
#login h1{font-size:28px}#login h1 em{color:var(--cy);font-style:normal}#login p{color:#9fb6cc;font-size:14px}
#code{text-align:center;letter-spacing:.2em;font-weight:800;text-transform:uppercase}#ls{min-height:20px;color:#ff9aa0;font-size:14px}
header{background:var(--navy);color:#fff;display:flex;align-items:center;gap:14px;padding:0 20px;min-height:62px;position:sticky;top:0;z-index:5}
header b{font-size:20px}header b span{color:var(--cy)}header .sp{flex:1}header small{color:#9fb6cc}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#9aa8b8;margin-right:6px}.dot.on{background:#2ee37d;box-shadow:0 0 0 3px rgba(46,227,125,.25)}
.wrap{display:flex;max-width:1200px;margin:auto;min-height:calc(100vh - 62px)}
aside{width:270px;padding:16px;display:grid;gap:8px;align-content:start;border-right:1px solid var(--line);background:#fff}
.stu{display:flex;align-items:center;padding:11px;border-radius:12px;cursor:pointer;border:1px solid var(--line)}.stu.on{border-color:var(--cy);background:#e6f8fd}
.stu span{flex:1;font-weight:700}.stu small{display:block;color:var(--mut);font-weight:500}.stu em{background:#ff5d73;color:#fff;border-radius:99px;font-style:normal;font-size:12px;padding:2px 8px;font-weight:800}
section{flex:1;padding:20px;min-width:0}
#tabs{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}#tabs button{border:1px solid var(--line);background:#fff;padding:9px 16px;border-radius:999px;font:inherit;font-weight:700;cursor:pointer}#tabs button.on{background:var(--navy);color:var(--cy)}
#tabs strong{margin-right:auto}.code{background:#e6f8fd;color:var(--bl);padding:3px 10px;border-radius:8px;letter-spacing:.1em}
.card,.f{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 14px 34px -26px rgba(7,17,31,.4)}
.f{display:grid;gap:10px}.card h3{font-size:18px;margin-bottom:6px}.mut,small{color:var(--mut)}
.pill{font-size:12px;padding:3px 10px;border-radius:99px;background:#e6f8fd;color:var(--bl);font-weight:800;margin-left:6px}.pill.bad{background:#ffe3e6;color:#c4303f}
.chat{height:55vh;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px}
.b{max-width:78%;padding:10px 14px;border-radius:16px;background:#eef3f9;align-self:flex-start}.b.me{align-self:flex-end;background:#d9f6fd}.b small{display:block;font-size:11px}.b img,.b video,.card img,.card video{max-width:100%;max-height:260px;border-radius:10px;margin-top:6px;display:block}
.cform{display:flex;gap:8px;margin-top:10px;align-items:center}.clip{cursor:pointer;font-size:22px}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:16px}
.kpi div{border-radius:18px;padding:20px;color:#fff;background:linear-gradient(135deg,#07111f,#0c2c4d 70%,#0e4160)}.kpi b{display:block;font-size:34px;color:var(--cy)}.kpi small{color:#c3d3e3}
.sub{border-top:1px dashed var(--line);margin-top:10px;padding-top:10px}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.row input{flex:1;min-width:110px}
#toast{position:fixed;right:16px;bottom:16px;display:grid;gap:8px;z-index:50}#toast div{background:var(--navy);color:#fff;padding:12px 18px;border-radius:14px;border-left:4px solid var(--cy);box-shadow:0 10px 30px rgba(0,0,0,.3)}
@media(max-width:800px){.wrap{flex-direction:column}aside{width:100%;border:0;border-bottom:1px solid var(--line)}.b{max-width:92%}}
</style></head><body>
<div id="login"><form id="lf"><h1>Baba<em>Design</em></h1><p>Entrez votre code d'accès (professeur ou élève).</p><input id="code" placeholder="CODE" autocomplete="off" required><button class="btn">Entrer</button><div id="ls" role="status"></div></form></div>
<div id="app" hidden>
<header><b>Baba<span>Design</span></b><span id="who"></span><span class="sp"></span><small id="onl"></small><button class="btn ghost" onclick="logout()">Quitter</button></header>
<div class="wrap"><aside id="side" hidden></aside><section><div id="tabs"></div><div id="view"></div></section></div></div>
<div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const sb=supabase.createClient("https://iridwdplzuskththpjnk.supabase.co","sb_publishable_Mgkrnj4LCgzbfpwi__29eQ_EVGhXcjT");
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const COURSES=['Graphic design','Montage vidéo','Création web','Pack 3 formations'],AL='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',KIND={any:'Photo, vidéo ou lien',photo:'Photos',video:'Vidéos',link:'Lien'};
let me,cur=null,tab='chat',students=[],unread={},SUBS=[],CERTS=[];
const T=()=>me?.role==='teacher',online=d=>d&&Date.now()-new Date(d)<60000,fmtD=d=>new Date(d).toLocaleString('fr',{dateStyle:'medium',timeStyle:'short'});
const nameOf=id=>T()?(students.find(s=>s.id===id)?.name||'Élève'):me.name;
function left(d){let s=Math.floor((new Date(d)-Date.now())/1000);if(s<=0)return'0';const D=Math.floor(s/86400),H=Math.floor(s%86400/3600),M=Math.floor(s%3600/60);return D?D+'j '+H+'h':H?H+'h '+M+'min':M+'min'}
function toast(t){const e=document.createElement('div');e.textContent=t;$('#toast').append(e);setTimeout(()=>e.remove(),5000)}
function notify(t){toast(t);try{if(document.hidden&&Notification.permission==='granted')new Notification('Baba Design',{body:t})}catch(e){}}
function media(f){const t=f.type||'';return t==='link'?`<a href="${esc(f.url)}" target="_blank" rel="noopener">🔗 ${esc(f.name)}</a>`:t.startsWith('image')?`<img src="${esc(f.url)}" alt="">`:t.startsWith('video')?`<video src="${esc(f.url)}" controls></video>`:`<a href="${esc(f.url)}" target="_blank">📄 ${esc(f.name)}</a>`}
async function up(file){const path=`${cur}/${Date.now()}-${file.name.replace(/[^\w.-]/g,'_')}`;const {error}=await sb.storage.from('files').upload(path,file);if(error)throw error;return{path,url:sb.storage.from('files').getPublicUrl(path).data.publicUrl,name:file.name,type:file.type}}
const rm=async fs=>{const p=(fs||[]).map(f=>f.path).filter(Boolean);if(p.length)await sb.storage.from('files').remove(p)};

/* ---- Login ---- */
$('#lf').onsubmit=async e=>{e.preventDefault();const s=$('#ls'),code=$('#code').value.trim();s.textContent='Connexion…';
 const {data:{session}}=await sb.auth.getSession();
 if(!session){const r=await sb.auth.signInAnonymously();if(r.error){s.textContent='Activez « Anonymous sign-ins » dans Supabase (Auth).';return}}
 let r=await sb.rpc('claim_teacher',{c:code});if(!r.data)r=await sb.rpc('claim_student',{c:code});
 if(!r.data){s.textContent='Code invalide.';return}boot()};
async function logout(){await sb.auth.signOut();location.reload()}
async function boot(){const {data:{session}}=await sb.auth.getSession();if(!session)return;const {data}=await sb.rpc('whoami');if(!data)return;
 me=data;$('#login').hidden=true;$('#app').hidden=false;$('#who').textContent=T()?'Espace Professeur':'Bonjour '+me.name;
 try{Notification.requestPermission()}catch(e){}
 if(T()){$('#side').hidden=false;await refreshSide();newStu()}else{cur=me.id;tab='home';renderTabs();go()}
 beat();setInterval(beat,20000);listen()}
async function beat(){await sb.rpc('heartbeat');if(T())refreshSide();else{const {data}=await sb.rpc('teacher_online');$('#onl').innerHTML=`<i class="dot ${data?'on':''}"></i>Professeur ${data?'en ligne':'hors ligne'}`}}

/* ---- Realtime / notifications ---- */
function listen(){const ch=sb.channel('db');
 ch.on('postgres_changes',{event:'INSERT',schema:'public',table:'messages'},async p=>{const m=p.new,mine=m.from_teacher===T(),open=tab==='chat'&&cur===m.student_id;
  if(open){await loadMsgs();if(!mine)await markRead()}else if(!mine){notify('💬 Nouveau message de '+(T()?nameOf(m.student_id):'votre professeur'))}if(T())refreshSide()});
 if(T())ch.on('postgres_changes',{event:'INSERT',schema:'public',table:'submissions'},p=>notify('📥 Devoir remis par '+nameOf(p.new.student_id)));
 else[['assignments','📝 Nouveau devoir'],['schedule','🗓️ Horaire mis à jour'],['certificates','🎓 Nouveau certificat']].forEach(([t,x])=>ch.on('postgres_changes',{event:'INSERT',schema:'public',table:t},()=>{notify(x);if(({assignments:'work',schedule:'sched',certificates:'certs'})[t]===tab||tab==='home')go()}));
 ch.subscribe()}

/* ---- Teacher sidebar ---- */
async function refreshSide(){const [a,b]=await Promise.all([sb.from('students').select('*').order('name'),sb.from('messages').select('student_id').eq('from_teacher',false).eq('read',false)]);
 students=a.data||[];unread={};(b.data||[]).forEach(m=>unread[m.student_id]=(unread[m.student_id]||0)+1);
 $('#side').innerHTML=`<button class="btn" onclick="newStu()">+ Nouvel élève</button><button class="btn ghost" onclick="resView()">Réservations</button>`+students.map(s=>`<div class="stu ${s.id===cur?'on':''}" onclick="pick('${s.id}')"><i class="dot ${online(s.last_seen)?'on':''}"></i><span>${esc(s.name)}<small>${esc(s.course||'')}</small></span>${unread[s.id]?`<em>${unread[s.id]}</em>`:''}</div>`).join('');
 if(cur&&T())renderTabs()}
function pick(id){cur=id;tab='chat';renderTabs();go();refreshSide()}
function newStu(name='',course=COURSES[0]){cur=null;renderTabs();
 $('#view').innerHTML=`<form id="nf" class="f"><h3>Nouvel élève</h3><input id="nn" placeholder="Nom complet" value="${esc(name)}" required><select id="nc">${COURSES.map(c=>`<option ${c===course?'selected':''}>${c}</option>`).join('')}</select><button class="btn">Créer le compte</button><p id="ns"></p></form>`;
 $('#nf').onsubmit=async e=>{e.preventDefault();const code='BD'+[...crypto.getRandomValues(new Uint8Array(5))].map(n=>AL[n%AL.length]).join('');
  const {error}=await sb.from('students').insert({name:$('#nn').value.trim(),course:$('#nc').value,code});
  $('#ns').innerHTML=error?'Erreur : '+esc(error.message):`Compte créé ✅ Code d'accès : <b class="code">${code}</b> — donnez-le à l'élève.`;if(!error){$('#nn').value='';refreshSide()}}}
async function resView(){cur=null;renderTabs();const {data}=await sb.from('coaching_reservations').select('*').order('created_at',{ascending:false});
 $('#view').innerHTML='<h3 style="margin-bottom:12px">Réservations</h3>'+((data||[]).map(r=>`<div class="card"><b>${esc(r.client_name)}</b> · ${esc(r.whatsapp)}<br><small>${esc(r.formation)} · ${fmtD(r.created_at)}</small><div class="row"><button class="btn ghost" onclick="newStu('${esc(r.client_name).replace(/'/g,'')}','${COURSES.find(c=>(r.formation||'').startsWith(c))||COURSES[0]}')">Créer son compte</button><button class="btn ghost" onclick="delRes(${r.id})">Supprimer</button></div></div>`).join('')||'<p class="mut">Aucune réservation.</p>')}
async function delRes(id){await sb.from('coaching_reservations').delete().eq('id',id);resView()}
async function delStu(){if(!confirm('Supprimer cet élève et ses données ?'))return;const {data}=await sb.from('submissions').select('files').eq('student_id',cur);for(const s of data||[])await rm(s.files);await sb.from('students').delete().eq('id',cur);cur=null;await refreshSide();newStu()}

/* ---- Tabs ---- */
function renderTabs(){const t=[...(T()?[]:[['home','Accueil']]),['chat','Chat'],['work','Devoirs'],['sched','Horaire'],['certs','Certificats']];const s=students.find(x=>x.id===cur);
 $('#tabs').innerHTML=cur?(T()&&s?`<strong><i class="dot ${online(s.last_seen)?'on':''}"></i>${esc(s.name)} <span class="code">${esc(s.code)}</span></strong>`:'')+t.map(([k,l])=>`<button class="${k===tab?'on':''}" onclick="go('${k}')">${l}</button>`).join('')+`<button onclick="call()">📹 Appel vidéo</button>`+(T()?`<button onclick="delStu()">🗑</button>`:''):''}
function go(k){if(k)tab=k;renderTabs();({home:vHome,chat:vChat,work:vWork,sched:vSched,certs:vCerts})[tab]()}
function call(){window.open('https://meet.jit.si/BabaDesign-'+cur,'_blank','noopener')}

/* ---- Chat ---- */
async function loadMsgs(){const box=$('#msgs');if(!box)return;const {data}=await sb.from('messages').select('*').eq('student_id',cur).order('created_at');
 box.innerHTML=(data||[]).map(m=>`<div class="b ${m.from_teacher===T()?'me':''}"><small>${m.from_teacher?'Professeur':esc(nameOf(m.student_id))} · ${fmtD(m.created_at)}</small>${m.file_url?media({url:m.file_url,type:m.file_type,name:m.file_name}):''}${m.body?`<p>${esc(m.body)}</p>`:''}</div>`).join('');box.scrollTop=box.scrollHeight}
const markRead=()=>sb.from('messages').update({read:true}).eq('student_id',cur).eq('from_teacher',!T()).eq('read',false).then(()=>T()&&refreshSide());
async function vChat(){$('#view').innerHTML=`<div class="chat" id="msgs"></div><form id="cf" class="cform"><label class="clip">📎<input type="file" id="cfile" hidden></label><input id="ct" placeholder="Écrire un message…" autocomplete="off"><button class="btn">Envoyer</button></form><small id="cfn"></small>`;
 $('#cfile').onchange=e=>$('#cfn').textContent=e.target.files[0]?'Fichier : '+e.target.files[0].name:'';
 $('#cf').onsubmit=async e=>{e.preventDefault();const body=$('#ct').value.trim(),file=$('#cfile').files[0];if(!body&&!file)return;const b=e.target.querySelector('button');b.disabled=true;
  try{const row={student_id:cur,from_teacher:T(),body:body||null};if(file){const u=await up(file);Object.assign(row,{file_url:u.url,file_type:u.type,file_name:u.name})}
   const {error}=await sb.from('messages').insert(row);if(error)throw error;$('#ct').value='';$('#cfile').value='';$('#cfn').textContent='';await loadMsgs()}catch(x){toast('Erreur : '+x.message)}b.disabled=false};
 await loadMsgs();markRead()}

/* ---- Devoirs ---- */
const subHtml=s=>`<div class="sub"><small>Remis le ${fmtD(s.created_at)}</small>${(s.files||[]).map(media).join('<br>')}${s.note?`<p>${esc(s.note)}</p>`:''}${T()?`<div class="row"><input id="g${s.id}" type="number" min="0" max="100" placeholder="Note /100" value="${s.grade??''}"><input id="fb${s.id}" placeholder="Commentaire" value="${esc(s.feedback||'')}"><button class="btn ghost" onclick="grade(${s.id})">Noter</button><button class="btn ghost" onclick="delSub(${s.id})">Effacer (libérer l'espace)</button></div>`:(s.grade!=null?`<p><span class="pill">Note : ${s.grade}/100</span> ${esc(s.feedback||'')}</p>`:'<small>En attente de note.</small>')}</div>`;
const subForm=a=>`<form class="f sub" onsubmit="sendSub(event,${a.id})">${a.kind!=='link'?`<input name="f" type="file" multiple ${a.kind==='photo'?'accept="image/*"':a.kind==='video'?'accept="video/*"':''}>`:''}${a.kind==='any'||a.kind==='link'?'<input name="l" type="url" placeholder="Lien https://…">':''}<input name="n" placeholder="Note pour le professeur (optionnel)"><button class="btn">Remettre le devoir</button></form>`;
async function vWork(){const [{data:as},{data:ss}]=await Promise.all([sb.from('assignments').select('*').eq('student_id',cur).order('due_at',{ascending:false}),sb.from('submissions').select('*').eq('student_id',cur).order('created_at')]);SUBS=ss||[];
 $('#view').innerHTML=(T()?`<form id="af" class="f"><h3>Nouveau devoir</h3><input id="at" placeholder="Titre" required><textarea id="ad" placeholder="Consignes"></textarea><label>Date limite<input id="ao" type="datetime-local" required></label><select id="ak">${Object.entries(KIND).map(([k,v])=>`<option value="${k}">Remise : ${v}</option>`).join('')}</select><button class="btn">Envoyer le devoir</button></form>`:'')+((as||[]).map(a=>{const exp=new Date(a.due_at)<Date.now();return`<div class="card"><h3>${esc(a.title)}<span class="pill ${exp?'bad':''}">${exp?'Expiré':'Reste '+left(a.due_at)}</span></h3><p>${esc(a.description)}</p><small>Limite : ${fmtD(a.due_at)} · ${KIND[a.kind]}</small>${SUBS.filter(s=>s.assignment_id===a.id).map(subHtml).join('')}${T()?`<div class="row"><button class="btn ghost" onclick="delA(${a.id})">Supprimer le devoir</button></div>`:exp?'':subForm(a)}</div>`}).join('')||'<p class="mut">Aucun devoir.</p>');
 if(T())$('#af').onsubmit=async e=>{e.preventDefault();const {error}=await sb.from('assignments').insert({student_id:cur,title:$('#at').value,description:$('#ad').value,due_at:new Date($('#ao').value).toISOString(),kind:$('#ak').value});error?toast(error.message):vWork()}}
async function sendSub(e,aid){e.preventDefault();const f=e.target,b=f.querySelector('button');b.disabled=true;
 try{const files=[];for(const x of f.f?.files||[])files.push(await up(x));const l=f.l?.value.trim();if(l){if(!/^https?:\/\//.test(l))throw Error('Lien invalide.');files.push({url:l,name:l,type:'link'})}
  if(!files.length)throw Error('Ajoutez un fichier ou un lien.');const {error}=await sb.from('submissions').insert({assignment_id:aid,student_id:cur,files,note:f.n.value});
  if(error)throw Error(/row-level/.test(error.message)?'Délai dépassé : devoir expiré.':error.message);toast('Devoir remis ✅')}catch(x){toast(x.message)}vWork()}
async function grade(id){const {error}=await sb.from('submissions').update({grade:$('#g'+id).value||null,feedback:$('#fb'+id).value}).eq('id',id);toast(error?error.message:'Note enregistrée ✅')}
async function delSub(id){if(!confirm('Effacer cette remise et ses fichiers ?'))return;await rm(SUBS.find(s=>s.id===id)?.files);await sb.from('submissions').delete().eq('id',id);vWork()}
async function delA(id){if(!confirm('Supprimer ce devoir et les remises ?'))return;for(const s of SUBS.filter(s=>s.assignment_id===id))await rm(s.files);await sb.from('assignments').delete().eq('id',id);vWork()}

/* ---- Horaire ---- */
async function vSched(){const {data}=await sb.from('schedule').select('*').eq('student_id',cur).order('starts_at');
 $('#view').innerHTML=(T()?`<form id="sf" class="f"><h3>Nouveau cours</h3><input id="sd" type="datetime-local" required><input id="sm" type="number" min="15" step="15" value="60" placeholder="Durée (minutes)"><input id="st" placeholder="Sujet du cours"><button class="btn">Ajouter</button></form>`:'')+((data||[]).map(s=>{const past=new Date(s.starts_at)<Date.now();return`<div class="card" style="${past?'opacity:.55':''}"><h3>${fmtD(s.starts_at)}<span class="pill">${s.minutes} min</span>${past?'':`<span class="pill">dans ${left(s.starts_at)}</span>`}</h3><p>${esc(s.topic||'')}</p>${T()?`<button class="btn ghost" onclick="sb.from('schedule').delete().eq('id',${s.id}).then(vSched)">Supprimer</button>`:''}</div>`}).join('')||'<p class="mut">Aucun cours planifié.</p>');
 if(T())$('#sf').onsubmit=async e=>{e.preventDefault();const {error}=await sb.from('schedule').insert({student_id:cur,starts_at:new Date($('#sd').value).toISOString(),minutes:+$('#sm').value||60,topic:$('#st').value});error?toast(error.message):vSched()}}

/* ---- Certificats ---- */
async function vCerts(){const {data}=await sb.from('certificates').select('*').eq('student_id',cur).order('issued_at',{ascending:false});CERTS=data||[];
 $('#view').innerHTML=(T()?`<form id="xf" class="f"><h3>Délivrer un certificat</h3><select id="xt">${COURSES.map(c=>`<option>${c}</option>`).join('')}</select><button class="btn">Délivrer</button></form>`:'')+(CERTS.map(c=>`<div class="card"><h3>🎓 ${esc(c.title)}</h3><small>Délivré le ${fmtD(c.issued_at)}</small><div class="row"><button class="btn" onclick="cert(${c.id})">Télécharger (PDF)</button>${T()?`<button class="btn ghost" onclick="sb.from('certificates').delete().eq('id',${c.id}).then(vCerts)">Retirer</button>`:''}</div></div>`).join('')||'<p class="mut">Aucun certificat.</p>');
 if(T())$('#xf').onsubmit=async e=>{e.preventDefault();const {error}=await sb.from('certificates').insert({student_id:cur,title:$('#xt').value});error?toast(error.message):vCerts()}}
function cert(id){const c=CERTS.find(x=>x.id===id),n=esc(nameOf(cur)),w=window.open('','_blank');if(!w)return toast('Autorisez les popups.');
