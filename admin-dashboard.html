<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Administration — Akademi Dizay</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
*{box-sizing:border-box}body{margin:0;font-family:Montserrat,sans-serif;background:#f4f4f4;color:#111}header{background:#111;color:#fff;padding:20px}.inner,main{max-width:1200px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.card{background:#fff;border-radius:18px;padding:20px;margin:18px 0;box-shadow:0 10px 30px #0000000d}.stat{font-size:30px;font-weight:900}.payment,.request{border:1px solid #ddd;border-radius:15px;padding:18px;margin:12px 0}.actions{display:flex;gap:8px;flex-wrap:wrap}button{border:0;border-radius:10px;padding:11px 14px;font-weight:800;cursor:pointer}.ok{background:#111;color:#fff}.bad{background:#eee}.save{background:linear-gradient(135deg,#e60000,#ff7300);color:#fff}input,select{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;margin:7px 0 12px}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tab{background:#fff}.tab.active{background:#111;color:#fff}.hidden{display:none!important}.msg{padding:12px;background:#fff6d8;border-radius:10px;margin:10px 0}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:550px){.grid{grid-template-columns:1fr}.top{flex-direction:column;align-items:flex-start;gap:15px}}
</style></head><body>
<header><div class="inner top"><div><h1 style="margin:0">Administration — Akademi Dizay</h1><div>Toussaint Obama</div></div><button onclick="logout()">Déconnexion</button></div></header>
<main>
<div id="message" class="msg hidden"></div>
<div class="grid"><div class="card"><div>Paiements en attente</div><div class="stat" id="statPayments">0</div></div><div class="card"><div>Demandes agents</div><div class="stat" id="statAgents">0</div></div><div class="card"><div>Formations</div><div class="stat" id="statCourses">0</div></div></div>
<div class="tabs"><button class="tab active" data-tab="payments">Paiements</button><button class="tab" data-tab="agents">Agents</button><button class="tab" data-tab="courses">Formations</button><button class="tab" data-tab="students">Étudiants</button></div>
<section id="payments" class="card"><h2>Paiements à traiter</h2><div id="paymentsList">Chargement...</div></section>
<section id="agents" class="card hidden"><h2>Demandes agents</h2><div id="agentsList">Chargement...</div></section>
<section id="courses" class="card hidden"><h2>Google Classroom</h2><div id="coursesList">Chargement...</div></section>
<section id="students" class="card hidden"><h2>Étudiants</h2><div id="studentsList">Chargement...</div></section>
</main>
<script>
const SUPABASE_URL="https://nuiubkbmwnkswugkyhvx.supabase.co",SUPABASE_KEY="sb_publishable_dFBjGdzxPDRkS-Ldb-YVLA_WeG9IqGy";const{createClient}=supabase;const db=createClient(SUPABASE_URL,SUPABASE_KEY);
const msg=document.getElementById('message');function show(m){msg.textContent=m;msg.classList.remove('hidden');setTimeout(()=>msg.classList.add('hidden'),3500)}function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function escAttr(v){return esc(v)}
async function check(){const{data:{user}}=await db.auth.getUser();if(!user){location.href='login.html';return null}const{data:p}=await db.from('profiles').select('role').eq('id',user.id).single();if(p?.role!=='admin'){alert('Accès administrateur refusé.');location.href='student-dashboard.html';return null}return user}
async function loadPayments(){const{data,error}=await db.from('payments').select('id,student_id,formation_id,enrollment_id,amount,transcode,status,created_at,profiles!payments_student_id_fkey(full_name,email,phone),formations(name)').eq('status','pending').order('created_at',{ascending:false});const b=document.getElementById('paymentsList');if(error){b.textContent=error.message;return}document.getElementById('statPayments').textContent=data?.length||0;b.innerHTML=data?.length?data.map(p=>`<div class="payment"><strong>${esc(p.profiles?.full_name)}</strong><p>Email: ${esc(p.profiles?.email)}<br>Téléphone: ${esc(p.profiles?.phone)}<br>Formation: ${esc(p.formations?.name||'Agent / inscription')}<br>Montant: ${esc(p.amount)} HTG<br>Transcode: <strong>${esc(p.transcode)}</strong></p><div class="actions"><button class="ok" onclick="validatePayment('${p.id}','${p.student_id}','${p.enrollment_id||''}')">Valider</button><button class="bad" onclick="rejectPayment('${p.id}','${p.student_id}')">Refuser</button></div></div>`).join(''):'<p>Aucun paiement en attente.</p>'}
async function validatePayment(id,student,enrollment){const{data:{user}}=await db.auth.getUser();const{error:e1}=await db.from('payments').update({status:'validated',validated_by:user.id,validated_at:new Date().toISOString()}).eq('id',id);if(e1){show(e1.message);return}if(enrollment){const{error:e2}=await db.from('enrollments').update({payment_status:'validated',access_status:'active'}).eq('id',enrollment);if(e2){show(e2.message);return}}await db.from('notifications').insert({user_id:student,title:'Paiement validé',message:'Votre paiement a été validé. Votre formation est maintenant accessible dans votre espace étudiant.',type:'payment_validated'});show('Paiement validé et accès accordé.');loadAll()}
async function rejectPayment(id,student){if(!confirm('Refuser ce paiement ?'))return;const{error}=await db.from('payments').update({status:'rejected'}).eq('id',id);if(error){show(error.message);return}if(student)await db.from('notifications').insert({user_id:student,title:'Paiement refusé',message:'Votre paiement n’a pas été validé. Veuillez contacter l’administration.',type:'payment_rejected'});show('Paiement refusé.');loadAll()}
async function loadCourses(){const{data,error}=await db.from('formations').select('*').order('created_at');const b=document.getElementById('coursesList');if(error){b.textContent=error.message;return}document.getElementById('statCourses').textContent=data?.length||0;b.innerHTML=(data||[]).map(f=>`<div class="card"><h3>${esc(f.name)}</h3><label>Lien Google Classroom</label><input id="url-${f.id}" value="${escAttr(f.classroom_url||'')}" placeholder="https://classroom.google.com/..."><label>Code Google Classroom</label><input id="code-${f.id}" value="${escAttr(f.classroom_code||'')}" placeholder="Ex : abc1234"><button class="save" onclick="saveCourse('${f.id}')">Enregistrer</button></div>`).join('')}
async function saveCourse(id){const url=document.getElementById('url-'+id).value.trim(),code=document.getElementById('code-'+id).value.trim();const{error}=await db.from('formations').update({classroom_url:url,classroom_code:code,updated_at:new Date().toISOString()}).eq('id',id);if(error)show(error.message);else show('Informations Google Classroom enregistrées.')}
async function loadAgents(){const{data,error}=await db.from('agent_requests').select('id,user_id,status,created_at,profiles(full_name,email,phone)').eq('status','pending').order('created_at',{ascending:false});const b=document.getElementById('agentsList');if(error){b.textContent=error.message;return}document.getElementById('statAgents').textContent=data?.length||0;b.innerHTML=data?.length?data.map(a=>`<div class="request"><strong>${esc(a.profiles?.full_name)}</strong><p>${esc(a.profiles?.email)}<br>${esc(a.profiles?.phone)}</p><div class="actions"><button class="ok" onclick="approveAgent('${a.id}','${a.user_id}')">Approuver</button><button class="bad" onclick="rejectAgent('${a.id}')">Refuser</button></div></div>`).join(''):'<p>Aucune demande agent en attente.</p>'}
async function approveAgent(reqId,userId){const code='AG-'+Math.random().toString(36).slice(2,8).toUpperCase();const{data:{user}}=await db.auth.getUser();const{error:e1}=await db.from('agents').insert({user_id:userId,referral_code:code,status:'active'});if(e1){show(e1.message);return}const{error:e2}=await db.from('profiles').update({role:'agent'}).eq('id',userId);if(e2){show(e2.message);return}await db.from('agent_requests').update({status:'approved',reviewed_by:user.id,reviewed_at:new Date().toISOString()}).eq('id',reqId);await db.from('notifications').insert({user_id:userId,title:'Compte agent approuvé',message:`Votre compte agent est approuvé. Votre ID de parrainage est ${code}.`,type:'agent_approved'});show('Agent approuvé.');loadAll()}
async function rejectAgent(id){if(!confirm('Refuser cette demande agent ?'))return;const{error}=await db.from('agent_requests').update({status:'rejected'}).eq('id',id);if(error)show(error.message);else{show('Demande agent refusée.');loadAll()}}
async function loadStudents(){const{data,error}=await db.from('profiles').select('id,full_name,email,phone,role,created_at').eq('role','student').order('created_at',{ascending:false});const b=document.getElementById('studentsList');if(error){b.textContent=error.message;return}b.innerHTML=data?.length?data.map(s=>`<div class="payment"><strong>${esc(s.full_name)}</strong><p>${esc(s.email)}<br>${esc(s.phone)}</p></div>`).join(''):'<p>Aucun étudiant.</p>'}
async function loadAll(){await Promise.all([loadPayments(),loadAgents(),loadCourses(),loadStudents()])}
document.querySelectorAll('.tab').forEach(btn=>btn.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));btn.classList.add('active');document.querySelectorAll('main section').forEach(x=>x.classList.add('hidden'));document.getElementById(btn.dataset.tab).classList.remove('hidden')}));
async function logout(){await db.auth.signOut();location.href='login.html'};(async()=>{if(await check())loadAll()})();
</script></body></html>
