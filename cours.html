<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Akademi Dizay — Formations</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:#fff;color:#151515;min-height:100vh}
body:before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 20% 10%,rgba(225,0,0,.07),transparent 35%),radial-gradient(circle at 80% 80%,rgba(225,0,0,.05),transparent 35%);pointer-events:none}
.wrap{width:min(1100px,92%);margin:auto;position:relative;z-index:1}.top{padding:28px 0;text-align:center}.brand{font-weight:900;letter-spacing:.12em;color:#d40000;font-size:13px}.top h1{font-size:clamp(30px,6vw,58px);margin:12px 0 8px}.top p{color:#666;margin:0}.card{background:#fff;border:1px solid #e5e5e5;border-radius:24px;padding:28px;box-shadow:0 20px 60px rgba(0,0,0,.08)}input,button{width:100%;padding:15px 16px;border-radius:13px;border:1px solid #d8d8d8;background:#fff;color:#151515;font-size:16px;outline:none}input:focus{border-color:#c40000;box-shadow:0 0 0 3px rgba(196,0,0,.08)}button{margin-top:12px;background:#c40000;border-color:#c40000;color:#fff;font-weight:800;cursor:pointer;transition:.2s}button:hover{transform:translateY(-2px);background:#e00000}.error{color:#c40000;min-height:22px;margin-top:10px}.hidden{display:none!important}.head{display:flex;justify-content:space-between;gap:15px;align-items:center}.tag{display:inline-block;background:#fff0f0;color:#c40000;padding:7px 11px;border-radius:99px;font-size:12px;font-weight:800}.message{margin-top:20px;padding:18px;border-left:3px solid #d00000;background:#fff5f5;border-radius:12px;color:#444;line-height:1.6}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:22px}.course{padding:22px;border:1px solid #e5e5e5;border-radius:18px;background:#fafafa;transition:.25s}.course:hover{transform:translateY(-3px);border-color:#c40000}.links{display:grid;gap:10px}.links a,.copy{padding:13px;border-radius:11px;text-align:center;text-decoration:none;color:#fff;background:#c40000;border:1px solid #c40000;font-weight:700;cursor:pointer}.copy{background:#fff;color:#222;border-color:#ddd}.logout{max-width:180px;background:#fff;color:#c40000;border-color:#c40000}.foot{text-align:center;color:#888;padding:25px;font-size:12px}
@media(max-width:700px){.grid{grid-template-columns:1fr}.head{flex-direction:column;align-items:flex-start}}
</style>
</head>
<body><div class="wrap">
<header class="top"><div class="brand">AKADEMI DIZAY</div><h1>Espace Formations</h1><p>Accédez à vos cours avec votre code personnel.</p></header>
<section id="login" class="card">
<h2>Accès membre</h2><p style="color:#666">Entrez votre code personnel pour voir uniquement les formations qui vous sont attribuées.</p>
<input id="code" type="password" placeholder="Code d'accès personnel" autocomplete="off">
<button id="loginBtn">Accéder à mes cours</button><div id="error" class="error"></div>
</section>
<section id="student" class="card hidden"></section>
<div class="foot">Akademi Dizay • Espace Formations</div>
</div>
<script>
const SUPABASE_URL="https://nnnqwkogkqidxbmutxcg.supabase.co";
const SUPABASE_KEY="sb_publishable_kuNo1NU3imlpfluHsfBvjA_uaWHBCM8";
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));}
async function login(){
 const code=document.getElementById("code").value.trim(),err=document.getElementById("error");err.textContent="";
 if(!code){err.textContent="Entrez votre code.";return;}
 try{
  const {data,error}=await db.rpc("agent_login",{p_code:code});
  if(error)throw error;
  if(!data?.ok){err.textContent=data?.message||"Code d'accès incorrect.";return;}
  const courses=data.courses||[],a=data.agent||{};
  document.getElementById("login").classList.add("hidden");
  const el=document.getElementById("student");el.classList.remove("hidden");
  el.innerHTML=`<div class="head"><div><span class="tag">ESPACE MEMBRE</span><h2 style="font-size:34px;margin:12px 0 3px">${esc(a.nom)}</h2><div style="color:#666">${esc(a.fonction)} • ${esc(a.telephone)}</div></div></div>
  <div class="message"><strong>Message de l'administration</strong><br>${esc(data.message||"")}</div>
  <h2 style="margin-top:25px">Mes formations</h2>
  <div class="grid">${courses.length?courses.map(c=>`<div class="course"><h3>${esc(c.nom)}</h3><p>Cette formation vous a été attribuée par l'administration.</p><div class="links"><a href="${esc(c.lien)}" target="_blank" rel="noopener">Ouvrir la formation</a><button class="copy" onclick="copyText('${encodeURIComponent(c.lien)}')">Copier le lien</button><button class="copy" onclick="copyText('${encodeURIComponent(c.code)}')">Copier le code du cours : ${esc(c.code)}</button></div></div>`).join(""):"<p style='color:#666'>Aucune formation ne vous a encore été attribuée.</p>"}</div>
  <button class="logout" onclick="location.reload()">Se déconnecter</button>`;
 }catch(e){err.textContent="Erreur de connexion : "+e.message;}
}
async function copyText(encoded){try{await navigator.clipboard.writeText(decodeURIComponent(encoded));alert("Copié !")}catch(e){alert("Copie impossible sur cet appareil.");}}
document.getElementById("loginBtn").onclick=login;
document.getElementById("code").addEventListener("keydown",e=>{if(e.key==="Enter")login()});
</script></body></html>
