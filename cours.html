<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Akademi Dizay — Formations</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

:root{
  --red:#e60000;
  --orange:#ff7300;
  --yellow:#ffd000;
  --dark:#111;
  --white:#fff;
  --gray:#666;
  --light:#f7f7f7;
  --border:#e8e8e8;
  --shadow:0 18px 55px rgba(17,17,17,.09);
}

html{scroll-behavior:smooth}

body{
  margin:0;
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:var(--light);
  color:var(--dark);
  min-height:100vh;
}

body:before{
  content:"";
  position:fixed;
  top:0;
  left:0;
  right:0;
  height:5px;
  background:linear-gradient(90deg,var(--red),var(--orange),var(--yellow));
  z-index:100;
}

.wrap{
  width:min(1180px,92%);
  margin:auto;
  position:relative;
  z-index:1;
}

.top{
  padding:58px 0 30px;
  text-align:center;
}

.brand{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:34px;
  padding:8px 15px;
  border-radius:999px;
  background:var(--dark);
  color:var(--white);
  font-weight:900;
  letter-spacing:.14em;
  font-size:12px;
  box-shadow:0 8px 22px rgba(17,17,17,.12);
}

.top h1{
  font-size:clamp(34px,6vw,62px);
  line-height:1;
  margin:18px 0 12px;
  letter-spacing:-.045em;
  font-weight:950;
}

.top h1:after{
  content:"";
  display:block;
  width:78px;
  height:6px;
  margin:18px auto 0;
  border-radius:99px;
  background:linear-gradient(90deg,var(--red),var(--orange),var(--yellow));
}

.top p{
  color:var(--gray);
  margin:18px 0 0;
  font-size:15px;
}

.card{
  background:var(--white);
  border:1px solid var(--border);
  border-radius:28px;
  padding:32px;
  box-shadow:var(--shadow);
}

#login{
  max-width:590px;
  margin:18px auto 0;
  position:relative;
  overflow:hidden;
}

#login:before{
  content:"";
  position:absolute;
  top:0;
  left:0;
  right:0;
  height:6px;
  background:linear-gradient(90deg,var(--red),var(--orange),var(--yellow));
}

#login h2{
  margin:4px 0 8px;
  font-size:28px;
  letter-spacing:-.025em;
}

#login p{
  color:var(--gray);
  line-height:1.6;
}

input,button{
  width:100%;
  padding:15px 16px;
  border-radius:14px;
  border:1px solid #dcdcdc;
  background:var(--white);
  color:var(--dark);
  font-size:16px;
  outline:none;
  font-family:inherit;
}

input{
  margin-top:12px;
}

input:focus{
  border-color:var(--orange);
  box-shadow:0 0 0 4px #fff0e8;
}

button{
  margin-top:13px;
  border:none;
  background:linear-gradient(90deg,var(--red),var(--orange),var(--yellow));
  color:var(--white);
  font-weight:850;
  cursor:pointer;
  transition:transform .2s ease,box-shadow .2s ease,filter .2s ease;
  box-shadow:0 10px 24px rgba(230,0,0,.16);
}

button:hover{
  transform:translateY(-2px);
  box-shadow:0 14px 30px rgba(230,0,0,.22);
  filter:saturate(1.08);
}

button:disabled{
  cursor:not-allowed;
  transform:none;
  filter:grayscale(.2);
}

.error{
  color:#c40000;
  min-height:22px;
  margin-top:11px;
  font-size:14px;
  font-weight:650;
}

.success{
  color:#16803c;
  min-height:22px;
  margin-top:10px;
}

.hidden{
  display:none!important;
}

#student{
  margin:24px auto 0;
  position:relative;
  overflow:hidden;
}

#student:before{
  content:"";
  position:absolute;
  top:0;
  left:0;
  right:0;
  height:6px;
  background:linear-gradient(90deg,var(--red),var(--orange),var(--yellow));
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:18px;
  margin-top:22px;
}

.course{
  padding:23px;
  border:1px solid var(--border);
  border-radius:20px;
  background:var(--white);
  transition:transform .22s ease,box-shadow .22s ease,border-color .22s ease;
  position:relative;
  overflow:hidden;
}

.course:before{
  content:"";
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:4px;
  background:linear-gradient(90deg,var(--red),var(--orange),var(--yellow));
}

.course:hover{
  transform:translateY(-4px);
  border-color:#f0b800;
  box-shadow:0 15px 35px rgba(17,17,17,.10);
}

.course h3{
  margin:5px 0 8px;
  font-size:21px;
  letter-spacing:-.02em;
}

.course p{
  color:var(--gray);
  margin:0 0 16px;
  line-height:1.55;
  font-size:14px;
}

.links{
  display:grid;
  gap:10px;
}

.links a,
.copy{
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:47px;
  padding:12px 14px;
  border-radius:13px;
  text-align:center;
  text-decoration:none;
  color:var(--white);
  background:linear-gradient(90deg,var(--red),var(--orange));
  border:0;
  font-weight:800;
  cursor:pointer;
  transition:.2s ease;
  margin:0;
  box-shadow:none;
}

.links a:hover,
.copy:hover{
  transform:translateY(-1px);
  filter:saturate(1.08);
}

.copy{
  color:var(--dark);
  background:var(--light);
  border:1px solid #dedede;
}

.copy:hover{
  background:#ededed;
  box-shadow:none;
}

.message{
  margin-top:22px;
  padding:19px 20px;
  border:1px solid #ffd36a;
  border-left:5px solid var(--orange);
  background:#fffaf0;
  border-radius:15px;
  color:#333;
  line-height:1.65;
}

.message strong{
  color:var(--dark);
}

.head{
  display:flex;
  justify-content:space-between;
  gap:20px;
  align-items:center;
  padding-bottom:20px;
  border-bottom:1px solid var(--border);
}

.tag{
  display:inline-flex;
  align-items:center;
  background:var(--dark);
  color:var(--white);
  padding:7px 12px;
  border-radius:999px;
  font-size:11px;
  letter-spacing:.08em;
  font-weight:900;
}

.student-info{
  color:var(--gray);
  margin-top:5px;
  font-size:14px;
}

#student h2{
  letter-spacing:-.025em;
}

.logout{
  max-width:190px;
  background:var(--dark);
  border-color:var(--dark);
  color:var(--white);
  box-shadow:none;
}

.logout:hover{
  background:#2b2b2b;
  box-shadow:0 10px 22px rgba(17,17,17,.16);
}

.loading{
  text-align:center;
  padding:30px;
  color:var(--gray);
  border:1px solid var(--border);
  border-radius:17px;
  background:var(--light);
}

.empty{
  text-align:center;
  padding:35px 18px;
  color:var(--gray);
  border:1px dashed #cfcfcf;
  border-radius:18px;
  background:var(--light);
}

.foot{
  text-align:center;
  color:#888;
  padding:30px 0 35px;
  font-size:12px;
}

@media(max-width:760px){
  .wrap{width:min(94%,1180px)}
  .top{padding:42px 0 24px}
  .card{padding:23px;border-radius:22px}
  .grid{grid-template-columns:1fr}
  .head{flex-direction:column;align-items:flex-start}
  .logout{max-width:none}
}

@media(max-width:480px){
  .top h1{font-size:38px}
  .brand{font-size:10px}
  .card{padding:20px}
  .course{padding:19px}
}

</style>
</head>

<body>

<div class="wrap">

<header class="top">
  <div class="brand">AKADEMI DIZAY</div>
  <h1>Espace Formations</h1>
  <p>Accédez à vos cours avec votre code personnel.</p>
</header>

<section id="login" class="card">

  <h2>Accès élève</h2>

  <p style="color:#777">
    Entrez votre code personnel pour voir vos formations.
  </p>

  <input
    id="code"
    type="password"
    placeholder="Code d'accès personnel"
    autocomplete="off"
  >

  <button onclick="login()">
    Accéder à mes cours
  </button>

  <div id="error" class="error"></div>

</section>


<section id="student" class="card hidden"></section>


<div class="foot">
  Akademi Dizay • Espace Formations
</div>

</div>


<script>

/* =========================================================
   CONFIGURATION SUPABASE
   ========================================================= */

const SUPABASE_URL =
"https://tlkuxqojbjpycgsaqone.supabase.co";

const SUPABASE_KEY =
"sb_publishable_AaCz0QDY9858XQtbOBybZw_uXhXfloL";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =========================================================
   LOGIN ÉLÈVE
   ========================================================= */

async function login(){

  const code =
    document.getElementById("code")
    .value
    .trim();

  const error =
    document.getElementById("error");

  const loginBox =
    document.getElementById("login");

  const studentBox =
    document.getElementById("student");


  error.textContent = "";

  if(!code){

    error.textContent =
      "Veuillez entrer votre code d'accès.";

    return;
  }


  loginBox.querySelector("button").disabled = true;

  loginBox.querySelector("button").textContent =
    "Connexion...";


  try{

    /*
      Appel de la fonction SQL
      student_login(code)
    */

    const { data, error: dbError } =
      await supabaseClient.rpc(
        "student_login",
        {
          p_code: code
        }
      );


    if(dbError){

      console.error(dbError);

      error.textContent =
        "Erreur de connexion. Vérifiez la configuration Supabase.";

      return;
    }


    if (!data || data.ok !== true || !data.student) {
  throw new Error(data?.message || "Code d'accès incorrect.");
}

const student = {
  ...data.student,
  courses: data.courses || []
};

await afficherEspaceEleve(student);

  }

  catch(err){

    console.error(err);

    error.textContent =
      "Une erreur est survenue. Veuillez réessayer.";

  }

  finally{

    loginBox.querySelector("button").disabled = false;

    loginBox.querySelector("button").textContent =
      "Accéder à mes cours";

  }
}


/* =========================================================
   AFFICHER ESPACE ÉLÈVE
   ========================================================= */

async function afficherEspaceEleve(student){

  const loginBox =
    document.getElementById("login");

  const studentBox =
    document.getElementById("student");


  loginBox.classList.add("hidden");

  studentBox.classList.remove("hidden");


  studentBox.innerHTML = `

    <div class="head">

      <div>

        <span class="tag">
          ÉLÈVE
        </span>

        <h2 style="
          font-size:34px;
          margin:12px 0 3px;
        ">
          ${escapeHtml(student.nom)}
        </h2>

        <div class="student-info">
          ${escapeHtml(student.telephone || "")}
        </div>

      </div>

    </div>

    <div id="messageContainer"></div>

    <h2 style="margin-top:28px">
      Mes formations
    </h2>

    <div id="coursesContainer"
         class="loading">

      Chargement de vos formations...

    </div>

    <button
      class="logout"
      onclick="logout()">

      Se déconnecter

    </button>
  `;


  await chargerMessages();

  afficherCours(student.courses);
}


/* =========================================================
   CHARGER LES COURS DE L'ÉLÈVE
   ========================================================= */

function afficherCours(courses){

  const container =
    document.getElementById("coursesContainer");

  if(!courses || courses.length === 0){

    container.innerHTML = `
      <div class="empty">
        Aucune formation ne vous a encore été attribuée.
      </div>
    `;

    return;
  }

  container.className = "grid";

  container.innerHTML =
    courses
    .map(course => `

      <div class="course">

        <h3>
          ${escapeHtml(course.nom)}
        </h3>

        <p>
          Votre formation est prête.
          Utilisez les boutons ci-dessous
          pour accéder à votre cours.
        </p>

        <div class="links">

          <a
            href="${escapeHtml(course.lien || "")}"
            target="_blank"
            rel="noopener">

            Ouvrir la formation

          </a>

          <button
            type="button"
            class="copy"
            onclick="copyText('${encodeURIComponent(course.lien || "")}')">

            Copier le lien

          </button>

          <button
            type="button"
            class="copy"
            onclick="copyText('${encodeURIComponent(course.code || "")}')">

            Copier le code du cours :
            ${escapeHtml(course.code || "")}

          </button>

        </div>

      </div>

    `)
    .join("");
}


/* =========================================================
   CHARGER LES MESSAGES ADMIN
   ========================================================= */

async function chargerMessages(){

  const container =
    document.getElementById("messageContainer");


  try{

    const { data, error } =
      await supabaseClient
      .from("messages")
      .select("*")
      .in(
        "audience",
        ["all","students"]
      )
      .order(
        "created_at",
        {
          ascending:false
        }
      );


    if(error){

      console.error(error);

      return;
    }


    if(!data || data.length === 0){

      return;
    }


    container.innerHTML =
      data
      .map(message => `

        <div class="message">

          <strong>
            Message de l'administration
          </strong>

          <br>

          ${escapeHtml(message.message)}

        </div>

      `)
      .join("");

  }

  catch(err){

    console.error(err);

  }
}


/* =========================================================
   COPIER UN TEXTE
   ========================================================= */

async function copyText(encoded){

  try{

    const text =
      decodeURIComponent(encoded);

    await navigator.clipboard.writeText(text);

    alert("Copié !");

  }

  catch(e){

    alert(
      "Copie impossible sur cet appareil."
    );

  }
}


/* =========================================================
   DÉCONNEXION
   ========================================================= */

function logout(){

  location.reload();

}


/* =========================================================
   PROTECTION HTML
   ========================================================= */

function escapeHtml(value){

  return String(value ?? "")
    .replace(
      /[&<>"']/g,
      function(m){

        return {
          "&":"&amp;",
          "<":"&lt;",
          ">":"&gt;",
          '"':"&quot;",
          "'":"&#039;"
        }[m];

      }
    );

}


/* =========================================================
   ENTER POUR SE CONNECTER
   ========================================================= */

document
  .getElementById("code")
  .addEventListener(
    "keydown",
    function(e){

      if(e.key === "Enter"){

        login();

      }

    }
  );

</script>

</body>
</html>
