<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Akademi Dizay — Espace élève</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

:root{
  --red:#e60000;
  --orange:#ff7300;
  --yellow:#ffd000;
  --dark:#111;
  --white:#fff;
  --gray:#666;
  --light:#f7f7f7;
  --border:#e8e8e8;
  --shadow:0 18px 55px rgba(17,17,17,.09);
}

html{scroll-behavior:smooth}

body{
  margin:0;
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:var(--light);
  color:var(--dark);
  min-height:100vh;
}

body:before{
  content:"";
  position:fixed;
  top:0;
  left:0;
  right:0;
  height:5px;
  background:linear-gradient(90deg,var(--red),var(--orange),var(--yellow));
  z-index:100;
}

.wrap{
  width:min(1180px,92%);
  margin:auto;
  position:relative;
  z-index:1;
}

.top{
  padding:58px 0 30px;
  text-align:center;
}

.brand{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:34px;
  padding:8px 15px;
  border-radius:999px;
  background:var(--dark);
  color:var(--white);
  font-weight:900;
  letter-spacing:.14em;
  font-size:12px;
  box-shadow:0 8px 22px rgba(17,17,17,.12);
}

.top h1{
  font-size:clamp(34px,6vw,62px);
  line-height:1;
  margin:18px 0 12px;
  letter-spacing:-.045em;
  font-weight:950;
}

.top h1:after{
  content:"";
  display:block;
  width:78px;
  height:6px;
  margin:18px auto 0;
  border-radius:99px;
  background:linear-gradient(90deg,var(--red),var(--orange),var(--yellow));
}

.top p{
  color:var(--gray);
  margin:18px 0 0;
  font-size:15px;
}

.card{
  background:var(--white);
  border:1px solid var(--border);
  border-radius:28px;
  padding:32px;
  box-shadow:var(--shadow);
}

#login{
  max-width:590px;
  margin:18px auto 0;
  position:relative;
  overflow:hidden;
}

#login:before{
  content:"";
  position:absolute;
  top:0;
  left:0;
  right:0;
  height:6px;
  background:linear-gradient(90deg,var(--red),var(--orange),var(--yellow));
}

#login h2{
  margin:4px 0 8px;
  font-size:28px;
  letter-spacing:-.025em;
}

#login p{
  color:var(--gray);
  line-height:1.6;
}

input,button{
  width:100%;
  padding:15px 16px;
  border-radius:14px;
  border:1px solid #dcdcdc;
  background:var(--white);
  color:var(--dark);
  font-size:16px;
  outline:none;
  font-family:inherit;
}

input{
  margin-top:12px;
}

input:focus{
  border-color:var(--orange);
  box-shadow:0 0 0 4px #fff0e8;
}

button{
  margin-top:13px;
  border:none;
  background:linear-gradient(90deg,var(--red),var(--orange),var(--yellow));
  color:var(--white);
  font-weight:850;
  cursor:pointer;
  transition:transform .2s ease,box-shadow .2s ease,filter .2s ease;
  box-shadow:0 10px 24px rgba(230,0,0,.16);
}

button:hover{
  transform:translateY(-2px);
  box-shadow:0 14px 30px rgba(230,0,0,.22);
  filter:saturate(1.08);
}

button:disabled{
  cursor:not-allowed;
  transform:none;
  filter:grayscale(.2);
}

.error{
  color:#c40000;
  min-height:22px;
  margin-top:11px;
  font-size:14px;
  font-weight:650;
}

.success{
  color:#16803c;
  min-height:22px;
  margin-top:10px;
}

.hidden{
  display:none!important;
}

#student{
  margin:24px auto 0;
  position:relative;
  overflow:hidden;
}

#student:before{
  content:"";
  position:absolute;
  top:0;
  left:0;
  right:0;
  height:6px;
  background:linear-gradient(90deg,var(--red),var(--orange),var(--yellow));
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:18px;
  margin-top:22px;
}

.course{
  padding:23px;
  border:1px solid var(--border);
  border-radius:20px;
  background:var(--white);
  transition:transform .22s ease,box-shadow .22s ease,border-color .22s ease;
  position:relative;
  overflow:hidden;
}

.course:before{
  content:"";
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:4px;
  background:linear-gradient(90deg,var(--red),var(--orange),var(--yellow));
}

.course:hover{
  transform:translateY(-4px);
  border-color:#f0b800;
  box-shadow:0 15px 35px rgba(17,17,17,.10);
}

.course h3{
  margin:5px 0 8px;
  font-size:21px;
  letter-spacing:-.02em;
}

.course p{
  color:var(--gray);
  margin:0 0 16px;
  line-height:1.55;
  font-size:14px;
}

.links{
  display:grid;
  gap:10px;
}

.links a,
.copy{
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:47px;
  padding:12px 14px;
  border-radius:13px;
  text-align:center;
  text-decoration:none;
  color:var(--white);
  background:linear-gradient(90deg,var(--red),var(--orange));
  border:0;
  font-weight:800;
  cursor:pointer;
  transition:.2s ease;
  margin:0;
  box-shadow:none;
}

.links a:hover,
.copy:hover{
  transform:translateY(-1px);
  filter:saturate(1.08);
}

.copy{
  color:var(--dark);
  background:var(--light);
  border:1px solid #dedede;
}

.copy:hover{
  background:#ededed;
  box-shadow:none;
}

.message{
  margin-top:22px;
  padding:19px 20px;
  border:1px solid #ffd36a;
  border-left:5px solid var(--orange);
  background:#fffaf0;
  border-radius:15px;
  color:#333;
  line-height:1.65;
}

.message strong{
  color:var(--dark);
}

.head{
  display:flex;
  justify-content:space-between;
  gap:20px;
  align-items:center;
  padding-bottom:20px;
  border-bottom:1px solid var(--border);
}

.tag{
  display:inline-flex;
  align-items:center;
  background:var(--dark);
  color:var(--white);
  padding:7px 12px;
  border-radius:999px;
  font-size:11px;
  letter-spacing:.08em;
  font-weight:900;
}

.student-info{
  color:var(--gray);
  margin-top:5px;
  font-size:14px;
}

#student h2{
  letter-spacing:-.025em;
}

.logout{
  max-width:190px;
  background:var(--dark);
  border-color:var(--dark);
  color:var(--white);
  box-shadow:none;
}

.logout:hover{
  background:#2b2b2b;
  box-shadow:0 10px 22px rgba(17,17,17,.16);
}

.loading{
  text-align:center;
  padding:30px;
  color:var(--gray);
  border:1px solid var(--border);
  border-radius:17px;
  background:var(--light);
}

.empty{
  text-align:center;
  padding:35px 18px;
  color:var(--gray);
  border:1px dashed #cfcfcf;
  border-radius:18px;
  background:var(--light);
}

.foot{
  text-align:center;
  color:#888;
  padding:30px 0 35px;
  font-size:12px;
}


/* Tableau de bord élève */
.dashboard-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin:24px 0}
.stat-card{border:1px solid var(--border);border-radius:18px;padding:20px;background:linear-gradient(145deg,#fff,#fffaf6);position:relative;overflow:hidden}
.stat-card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(var(--red),var(--orange),var(--yellow))}
.stat-label{font-size:11px;font-weight:900;letter-spacing:.1em;color:var(--gray);text-transform:uppercase}
.stat-value{font-size:32px;line-height:1.15;font-weight:900;margin-top:10px;letter-spacing:-.04em}
.stat-hint{font-size:12px;color:var(--gray);margin-top:6px}
.section-title{display:flex;align-items:center;gap:11px;margin:30px 0 14px;font-size:21px;letter-spacing:-.025em}
.section-icon{width:38px;height:38px;display:inline-flex;align-items:center;justify-content:center;border-radius:12px;background:#fff0e8;color:var(--red);flex-shrink:0}
.section-icon svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.assignment-list,.certificate-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}
.assignment-card,.certificate-card{background:#fff;border:1px solid var(--border);border-radius:18px;padding:20px;min-width:0}
.assignment-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.assignment-card h3,.certificate-card h3{font-size:17px;margin:0 0 9px}
.assignment-description{font-size:14px;color:#555;line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere}
.deadline{display:flex;gap:8px;align-items:flex-start;background:#fff8ed;border:1px solid #ffe0b8;border-radius:12px;padding:11px 12px;margin:15px 0;font-size:13px;color:#6b3b00}
.deadline svg{width:17px;height:17px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:1.8}
.status-pill{display:inline-flex;align-items:center;border-radius:999px;padding:6px 9px;font-size:11px;font-weight:850;white-space:nowrap;background:#f1f1f1;color:#555}
.status-pill.open{background:#eaf3ff;color:#1555a0}
.status-pill.done{background:#e7f8ed;color:#16743b}
.status-pill.late{background:#fff0e8;color:#bd3b00}
.upload-area{border:1px dashed #d8d8d8;background:#fafafa;border-radius:13px;padding:14px;margin-top:12px}
.upload-area label{display:block;font-size:13px;font-weight:800;margin-bottom:8px}
.upload-area input[type=file]{width:100%;padding:10px;border:1px solid #ddd;border-radius:10px;background:#fff;font-size:13px;margin:0}
.upload-area button,.assignment-card button{margin-top:10px;width:100%;padding:12px;border-radius:11px;font-size:13px}
.upload-note{font-size:12px;color:var(--gray);line-height:1.5;margin:8px 0 0}
.preview-image{display:block;max-width:100%;max-height:220px;object-fit:contain;border-radius:12px;border:1px solid var(--border);margin-top:12px;background:#f8f8f8}
.certificate-card{display:flex;flex-direction:column;gap:10px}
.certificate-card img{width:100%;max-height:250px;object-fit:contain;border-radius:12px;background:#f8f8f8;border:1px solid var(--border)}
.certificate-card a{display:flex;align-items:center;justify-content:center;text-decoration:none;border-radius:11px;padding:12px;background:var(--dark);color:#fff;font-weight:800;font-size:13px}
.notice-box{border-radius:13px;padding:13px 15px;margin-top:12px;font-size:13px;line-height:1.5;background:#f6f6f6;color:#555}
.notice-box.error-note{background:#fff0ef;color:#a82020}
@media(max-width:760px){.dashboard-grid{grid-template-columns:1fr}.assignment-list,.certificate-grid{grid-template-columns:1fr}.stat-value{font-size:29px}}

@media(max-width:760px){
  .wrap{width:min(94%,1180px)}
  .top{padding:42px 0 24px}
  .card{padding:23px;border-radius:22px}
  .grid{grid-template-columns:1fr}
  .head{flex-direction:column;align-items:flex-start}
  .logout{max-width:none}
}

@media(max-width:480px){
  .top h1{font-size:38px}
  .brand{font-size:10px}
  .card{padding:20px}
  .course{padding:19px}
}



/* DESIGN PREMIUM — couche visuelle uniquement, aucune logique JavaScript modifiée */
:root{
  --red:#f21d0a;--orange:#ff9a55;--yellow:#ffc247;--dark:#171717;--white:#ffffff;
  --gray:#666666;--light:#f7f7f7;--border:#e7e7e7;--shadow:0 20px 60px rgba(0,0,0,.09);
}
html{scroll-padding-top:24px}
body{background:radial-gradient(ellipse at 8% 0%,rgba(255,138,69,.13),transparent 34%),radial-gradient(ellipse at 100% 18%,rgba(255,194,71,.12),transparent 32%),#ffffff;color:#171717;line-height:1.55}
body:before{height:4px;background:linear-gradient(90deg,#171717 0%,#f21d0a 55%,#ffc247 100%)}
.wrap{width:min(1160px,92%)}
.top{padding:48px 0 30px;text-align:left;position:relative}
.brand{background:#171717;color:#fff;border-radius:12px;padding:10px 15px;letter-spacing:.13em;font-size:11px;box-shadow:0 8px 20px rgba(0,0,0,.16)}
.top h1{font-size:clamp(35px,5vw,56px);line-height:1.04;letter-spacing:-.055em;max-width:780px;margin:20px 0 12px;color:#171717}
.top h1:after{margin:18px 0 0;width:70px;height:5px;border-radius:9px;background:linear-gradient(90deg,#f05b35,#ffb15d)}
.top p{max-width:650px;color:#666666;font-size:16px;line-height:1.75;margin-top:16px}
.card{background:rgba(255,255,255,.96);border:1px solid rgba(222,230,241,.95);border-radius:24px;padding:clamp(20px,3vw,34px);box-shadow:0 18px 55px rgba(0,0,0,.075)}
#login{max-width:560px;margin:20px auto 0;border-radius:24px}
#login:before,#student:before{height:4px;background:linear-gradient(90deg,#f05b35,#ff9c59,#ffd166)}
#login h2{font-size:27px;color:#171717;letter-spacing:-.035em}
#login p{color:#666666;line-height:1.7}
input,button{border-radius:13px;font-family:inherit}
input{border:1px solid #e3e3e3;background:#fffaf6;color:#171717;transition:border-color .2s,box-shadow .2s}
input:focus{border-color:#f07850;box-shadow:0 0 0 4px rgba(240,91,53,.12)}
button{background:linear-gradient(115deg,#ef5937,#ff8a45);box-shadow:0 9px 22px rgba(240,91,53,.19);font-weight:800;letter-spacing:.005em}
button:hover{box-shadow:0 13px 27px rgba(240,91,53,.25);filter:none}
#student{margin:20px auto 0;border-radius:25px}
.head{padding-bottom:23px;border-bottom:1px solid #e8e8e8}
.tag{background:#fff0e8;color:#3a2924;border:1px solid #f6d8c9;letter-spacing:.06em}
.student-info{color:#777777;line-height:1.7}
#student h2{color:#171717}
.dashboard-grid{gap:16px;margin:25px 0 28px}
.stat-card{border:1px solid #e8e8e8;border-radius:19px;padding:22px;background:#fff;box-shadow:0 8px 24px rgba(0,0,0,.035);transition:transform .2s,box-shadow .2s}
.stat-card:hover{transform:translateY(-3px);box-shadow:0 14px 28px rgba(0,0,0,.08)}
.stat-card:before{width:4px;background:linear-gradient(180deg,#f05b35,#ffb45e)}
.stat-label{letter-spacing:.075em;color:#777777;font-size:10px}
.stat-value{font-size:35px;color:#171717}
.stat-hint{font-size:12px;color:#888888;line-height:1.55}
.section-title{font-size:22px;color:#171717;margin:32px 0 16px;letter-spacing:-.035em}
.section-icon{width:42px;height:42px;border-radius:14px;background:#fff0e9;color:#e95a37;box-shadow:inset 0 0 0 1px rgba(240,91,53,.08)}
.grid{gap:17px;margin-top:20px}
.course{border:1px solid #e8e8e8;border-radius:19px;padding:23px;background:linear-gradient(160deg,#fff,#fffaf6);box-shadow:0 8px 22px rgba(0,0,0,.035)}
.course:before{height:3px;background:linear-gradient(90deg,#f05b35,#ffb45e)}
.course:hover{border-color:#f5b39d;box-shadow:0 16px 32px rgba(0,0,0,.09);transform:translateY(-3px)}
.course h3{color:#171717;font-size:20px}
.course p{color:#68758b;line-height:1.7}
.links a{background:#171717;border-radius:12px;box-shadow:none;transition:transform .2s,background .2s}
.links a:hover{background:#333333;filter:none}

.assignment-card:hover,.certificate-card:hover{transform:translateY(-2px);box-shadow:0 14px 28px rgba(0,0,0,.075)}

.status-pill.open{background:#fff0e8;color:#b32616}
.status-pill.done{background:#e9f8ef;color:#187447}
.status-pill.late{background:#fff0e9;color:#c44d28}
.upload-area{border:1px dashed #e5c8b7;background:#fffaf6;border-radius:14px;padding:15px}
.upload-area label{color:#383838}
.upload-area input[type=file]{background:#fff;border-color:#e7dcd5}
.upload-area button,.assignment-card button{border-radius:11px}
.upload-note{color:#777777;line-height:1.65}
.preview-image,.certificate-card img{border:1px solid #e7e7e7;border-radius:14px;background:#fffaf6}
.certificate-card a{background:#17243b;border-radius:11px;transition:background .2s}
.certificate-card a:hover{background:#333333}
.notice-box{background:#f7f7f7;color:#666666;border:1px solid #e8e8e8;border-radius:13px;line-height:1.65}
.notice-box.error-note{background:#fff1ef;color:#a83a2d;border-color:#ffd9d2}
.loading,.empty{border-radius:16px;background:#fffaf6;border-color:#e7e7e7;color:#777777;line-height:1.7}
.empty{border-style:dashed}
.logout{background:#f2f2f2;color:#383838;border:1px solid #e7dcd5;box-shadow:none}
.logout:hover{background:#e5e5e5;box-shadow:none;color:#171717}
.error{color:#b42318}.success{color:#16804a}
.foot{color:#8791a2;padding:28px 0 34px}

@media(max-width:480px){.wrap{width:92%}.top{padding-top:28px}.top h1{font-size:34px}.top p{font-size:14px}.brand{font-size:10px}.card{padding:18px;border-radius:19px}#student{border-radius:20px}.course{padding:19px}.assignment-card,.certificate-card{padding:16px}.assignment-top{flex-direction:column;align-items:flex-start}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important;animation:none!important}}

.head .tag{background:#4a4a4a;border:1px solid #5d5d5d}
.logout{background:#ff2608;color:#fff;border:0}
.grid{gap:18px}
.course{border:1px solid #ededed;border-radius:20px;padding:22px;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.035)}
.course:before{height:0}
.course:hover{transform:translateY(-3px);border-color:#ffc0b4;box-shadow:0 12px 28px rgba(0,0,0,.07)}

<script>

/* =========================================================
   CONFIGURATION SUPABASE
   ========================================================= */

const SUPABASE_URL =
"https://tlkuxqojbjpycgsaqone.supabase.co";

const SUPABASE_KEY =
"sb_publishable_AaCz0QDY9858XQtbOBybZw_uXhXfloL";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =========================================================
   LOGIN ÉLÈVE
   ========================================================= */

async function login(){

  const code =
    document.getElementById("code")
    .value
    .trim();

  const error =
    document.getElementById("error");

  const loginBox =
    document.getElementById("login");

  const studentBox =
    document.getElementById("student");


  error.textContent = "";

  if(!code){

    error.textContent =
      "Veuillez entrer votre code d'accès.";

    return;
  }


  loginBox.querySelector("button").disabled = true;

  loginBox.querySelector("button").textContent =
    "Connexion...";


  try{

    /*
      Appel de la fonction SQL
      student_login(code)
    */

    const { data, error: dbError } =
      await supabaseClient.rpc(
        "student_login",
        {
          p_code: code
        }
      );


    if(dbError){

      console.error(dbError);

      error.textContent =
        "Erreur de connexion. Vérifiez la configuration Supabase.";

      return;
    }


    if (!data || data.ok !== true || !data.student) {
  throw new Error(data?.message || "Code d'accès incorrect.");
}

const student = {
  ...data.student,
  courses: data.courses || []
};

await afficherEspaceEleve(student);

  }

  catch(err){

    console.error(err);

    error.textContent =
      "Une erreur est survenue. Veuillez réessayer.";

  }

  finally{

    loginBox.querySelector("button").disabled = false;

    loginBox.querySelector("button").textContent =
      "Accéder à mes cours";

  }
}


/* =========================================================
   AFFICHER ESPACE ÉLÈVE
   ========================================================= */

async function afficherEspaceEleve(student){

  const loginBox =
    document.getElementById("login");

  const studentBox =
    document.getElementById("student");


  loginBox.classList.add("hidden");

  studentBox.classList.remove("hidden");


  studentBox.innerHTML = `

    <div class="head">

      <div>

        <span class="tag">
          ÉLÈVE
        </span>

        <h2 style="
          font-size:34px;
          margin:12px 0 3px;
        ">
          ${escapeHtml(student.nom)}
        </h2>

        <div class="student-info">
          ${escapeHtml(student.telephone || "")}
        </div>

      </div>

    </div>

    <div id="messageContainer"></div>

    <div class="dashboard-grid" aria-label="Résumé de votre parcours">
      <div class="stat-card">
        <div class="stat-label">Ma note</div>
        <div class="stat-value" id="studentNote">—<span style="font-size:15px;color:#777"> / 100</span></div>
        <div class="stat-hint">Dernière note publiée</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Certificats obtenus</div>
        <div class="stat-value" id="certificateCount">0</div>
        <div class="stat-hint">Certificats disponibles dans votre espace</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Mes formations</div>
        <div class="stat-value" id="courseCount">0</div>
        <div class="stat-hint">Formations qui vous sont attribuées</div>
      </div>
    </div>

    <h2 class="section-title">
      <span class="section-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21z"/><path d="M4 5.5v13A2.5 2.5 0 0 1 6.5 16H20"/></svg></span>
      Mes formations
    </h2>
    <div id="coursesContainer" class="loading">Chargement de vos formations...</div>

    <h2 class="section-title">
      <span class="section-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V8z"/><path d="M8 3v5h8V3M8 14h8M8 17h5"/></svg></span>
      Mes devoirs
    </h2>
    <p style="color:#666;line-height:1.6;margin-top:-4px">Consultez les consignes, la date et l'heure limites, puis envoyez une photo de votre travail.</p>
    <div id="assignmentsContainer" class="loading">Chargement de vos devoirs...</div>

    <h2 class="section-title">
      <span class="section-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 3 19 6v5c0 5-3.5 8-7 10-3.5-2-7-5-7-10V6z"/><path d="m9 12 2 2 4-4"/></svg></span>
      Mes certificats
    </h2>
    <p style="color:#666;line-height:1.6;margin-top:-4px">Vos certificats seront affichés ici dès que l'administration les aura ajoutés à votre dossier.</p>
    <div id="certificatesContainer" class="loading">Chargement de vos certificats...</div>

    <button class="logout" onclick="logout()">Se déconnecter</button>
  `;


  await chargerMessages();
  afficherCours(student.courses);
  await chargerTableauDeBord(student);
}


/* =========================================================
   CHARGER LES COURS DE L'ÉLÈVE
   ========================================================= */

function afficherCours(courses){

  const count = document.getElementById("courseCount");
  if(count) count.textContent = String((courses || []).length);

  const container =
    document.getElementById("coursesContainer");

  if(!courses || courses.length === 0){

    container.innerHTML = `
      <div class="empty">
        Aucune formation ne vous a encore été attribuée.
      </div>
    `;

    return;
  }

  container.className = "grid";

  container.innerHTML =
    courses
    .map(course => `

      <div class="course">

        <h3>
          ${escapeHtml(course.nom)}
        </h3>

        <p>
          Votre formation est prête.
          Utilisez les boutons ci-dessous
          pour accéder à votre cours.
        </p>

        <div class="links">

          <a
            href="${escapeHtml(course.lien || "")}"
            target="_blank"
            rel="noopener">

            Ouvrir la formation

          </a>

          <button
            type="button"
            class="copy"
            onclick="copyText('${encodeURIComponent(course.lien || "")}')">

            Copier le lien

          </button>

          <button
            type="button"
            class="copy"
            onclick="copyText('${encodeURIComponent(course.code || "")}')">

            Copier le code du cours :
            ${escapeHtml(course.code || "")}

          </button>

        </div>

      </div>

    `)
    .join("");
}



/* =========================================================
   NOTES, DEVOIRS ET CERTIFICATS
   Tables attendues : notes, devoirs, devoirs_remis, certificats.
   Les noms de colonnes sont centralisés dans les fonctions ci-dessous.
   ========================================================= */

function studentIdOf(student){
  return student?.id ?? student?.eleve_id ?? student?.student_id ?? student?.profile_id ?? null;
}

function formatDateFr(value){
  if(!value) return "Date non précisée";
  const d = new Date(value);
  if(Number.isNaN(d.getTime())) return escapeHtml(value);
  return d.toLocaleDateString("fr-FR",{day:"2-digit",month:"long",year:"numeric"});
}

function formatTimeFr(value){
  if(!value) return "Heure non précisée";
  const match = String(value).match(/^(\d{1,2}):(\d{2})/);
  return match ? `${match[1].padStart(2,"0")}:${match[2]}` : escapeHtml(value);
}

function safeFileName(name){
  return String(name || "fichier").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-zA-Z0-9._-]/g,"_").slice(-100);
}

async function chargerTableauDeBord(student){
  const studentId = studentIdOf(student);
  const noteEl = document.getElementById("studentNote");
  const assignmentsEl = document.getElementById("assignmentsContainer");
  const certificatesEl = document.getElementById("certificatesContainer");
  if(!studentId){
    assignmentsEl.innerHTML = '<div class="notice-box error-note">Impossible d’identifier votre dossier élève. La fonction student_login doit renvoyer l’identifiant de l’élève dans le champ id.</div>';
    certificatesEl.innerHTML = '<div class="empty">Votre identifiant élève est nécessaire pour charger vos certificats.</div>';
    return;
  }
  await Promise.all([
    chargerNote(studentId, student),
    chargerDevoirs(studentId),
    chargerCertificats(studentId)
  ]);
}

async function chargerNote(studentId, student){
  const noteEl = document.getElementById("studentNote");
  const noteDirecte = student.note_sur_100 ?? student.note ?? student.notes;
  if(noteDirecte !== undefined && noteDirecte !== null && noteDirecte !== ""){
    const n = Number(noteDirecte);
    noteEl.innerHTML = `${Number.isFinite(n) ? escapeHtml(n) : "—"}<span style="font-size:15px;color:#777"> / 100</span>`;
    return;
  }
  try{
    const {data,error} = await supabaseClient.from("notes")
      .select("note_sur_100, note, created_at")
      .eq("eleve_id",studentId)
      .order("created_at",{ascending:false})
      .limit(1);
    if(error) throw error;
    const value = data?.[0]?.note_sur_100 ?? data?.[0]?.note;
    noteEl.innerHTML = `${value !== undefined && value !== null ? escapeHtml(value) : "—"}<span style="font-size:15px;color:#777"> / 100</span>`;
  }catch(err){
    console.warn("Chargement de la note :",err.message || err);
    noteEl.innerHTML = `—<span style="font-size:15px;color:#777"> / 100</span>`;
  }
}

async function chargerDevoirs(studentId){
  const container = document.getElementById("assignmentsContainer");
  try{
    const [{data:devoirs,error:devoirsError},{data:remises,error:remisesError}] = await Promise.all([
      supabaseClient.from("devoirs").select("*").eq("publie",true).order("date_limite",{ascending:true}),
      supabaseClient.from("devoirs_remis").select("*").eq("eleve_id",studentId).order("created_at",{ascending:false})
    ]);
    if(devoirsError) throw devoirsError;
    if(remisesError) throw remisesError;
    if(!devoirs || devoirs.length===0){
      container.className="empty";
      container.textContent="Aucun devoir n’a été publié pour le moment.";
      return;
    }
    const remisParDevoir = new Map((remises||[]).map(r=>[String(r.devoir_id),r]));
    // Évite d’afficher plusieurs fois le même devoir si la base contient des doublons.
    // Priorité à la ligne pour laquelle l’élève a déjà remis un fichier.
    const devoirsUniques = [];
    const indexParCle = new Map();
    for (const d of devoirs) {
      // Les copies synchronisées peuvent avoir des IDs, dates ou champs techniques différents.
      // Pour l’affichage, un même titre normalisé ne doit apparaître qu’une fois.
      const titreCle = String(d.titre || d.nom || "devoir sans titre")
        .normalize("NFD").replace(/[\\u0300-\\u036f]/g, "")
        .trim().toLowerCase().replace(/\\s+/g, " ");
      const cle = titreCle;
      if (!indexParCle.has(cle)) {
        indexParCle.set(cle, devoirsUniques.length);
        devoirsUniques.push(d);
      } else {
        const idx = indexParCle.get(cle);
        const actuel = devoirsUniques[idx];
        // Garder en priorité le devoir auquel l’élève a déjà remis un fichier.
        if (!remisParDevoir.has(String(actuel.id)) && remisParDevoir.has(String(d.id))) {
          devoirsUniques[idx] = d;
        } else if (String(d.description || d.consignes || "").length > String(actuel.description || actuel.consignes || "").length) {
          // Si aucun devoir n’a été remis, conserver la fiche la plus complète.
          if (!remisParDevoir.has(String(actuel.id))) devoirsUniques[idx] = d;
        }
      }
    }
    container.className="assignment-list";
    container.innerHTML = devoirsUniques.map(d=>{
      const remise = remisParDevoir.get(String(d.id));
      const deadline = d.date_limite ? new Date(`${String(d.date_limite).slice(0,10)}T${String(d.heure_limite||"23:59:00").slice(0,8)}`) : null;
      const enRetard = !remise && deadline && !Number.isNaN(deadline.getTime()) && deadline < new Date();
      const status = remise ? '<span class="status-pill done">Devoir envoyé</span>' : enRetard ? '<span class="status-pill late">Date limite dépassée</span>' : '<span class="status-pill open">À remettre</span>';
      const description = d.description || d.consignes || "Aucune description n’a été ajoutée pour ce devoir.";
      const remiseUrl = remise?.fichier_url || remise?.photo_url || "";
      return `<article class="assignment-card">
        <div class="assignment-top"><h3>${escapeHtml(d.titre || d.nom || "Devoir sans titre")}</h3>${status}</div>
        <div class="assignment-description">${escapeHtml(description)}</div>
        <div class="deadline"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><div><strong>Date limite :</strong> ${formatDateFr(d.date_limite)}<br><strong>Heure limite :</strong> ${formatTimeFr(d.heure_limite)}</div></div>
        ${remiseUrl ? `<p class="upload-note">Votre fichier a été envoyé. <a href="${escapeHtml(remiseUrl)}" target="_blank" rel="noopener">Voir le devoir envoyé</a></p>` : `
          <div class="upload-area">
            <label for="devoir-file-${escapeHtml(d.id)}">Photo ou fichier du devoir</label>
            <input id="devoir-file-${escapeHtml(d.id)}" type="file" accept="image/*,.pdf" />
            <p class="upload-note">Formats acceptés : image ou PDF. Veuillez vérifier votre fichier avant l’envoi.</p>
            <button type="button" onclick="envoyerDevoir('${encodeURIComponent(String(d.id))}','${encodeURIComponent(String(studentId))}')">Envoyer mon devoir</button>
            <div id="devoir-msg-${escapeHtml(d.id)}" class="upload-note" aria-live="polite"></div>
          </div>`}
      </article>`;
    }).join("");
  }catch(err){
    console.error("Chargement des devoirs :",err);
    container.className="";
    container.innerHTML='<div class="notice-box error-note">Les devoirs ne peuvent pas être chargés. Vérifiez que les tables « devoirs » et « devoirs_remis » existent et que leurs autorisations Supabase sont configurées.</div>';
  }
}

async function envoyerDevoir(encodedDevoirId,encodedStudentId){
  const devoirId = decodeURIComponent(encodedDevoirId);
  const studentId = decodeURIComponent(encodedStudentId);
  const input = document.getElementById(`devoir-file-${devoirId}`);
  const message = document.getElementById(`devoir-msg-${devoirId}`);
  const button = input?.closest(".upload-area")?.querySelector("button");
  const file = input?.files?.[0];
  if(!file){ message.textContent="Veuillez sélectionner une photo ou un fichier avant l’envoi."; return; }
  if(file.size > 10*1024*1024){ message.textContent="Le fichier dépasse 10 Mo. Choisissez un fichier plus léger."; return; }
  if(!(file.type.startsWith("image/") || file.type==="application/pdf")){ message.textContent="Veuillez choisir une image ou un fichier PDF."; return; }
  if(button){button.disabled=true;button.textContent="Envoi en cours…";}
  message.textContent="Téléversement du fichier…";
  try{
    const path = `${studentId}/${devoirId}/${Date.now()}-${safeFileName(file.name)}`;
    const {data:uploadData,error:uploadError} = await supabaseClient.storage.from("devoirs").upload(path,file,{upsert:false,contentType:file.type});
    if(uploadError) throw uploadError;
    const {data:urlData} = supabaseClient.storage.from("devoirs").getPublicUrl(uploadData.path);
    const fichierUrl = urlData?.publicUrl;
    const {error:insertError} = await supabaseClient.from("devoirs_remis").insert({
      devoir_id:devoirId,
      eleve_id:studentId,
      fichier_url:fichierUrl,
      nom_fichier:file.name,
      statut:"remis"
    });
    if(insertError) throw insertError;
    message.textContent="Votre devoir a été envoyé avec succès.";
    await chargerDevoirs(studentId);
  }catch(err){
    console.error("Envoi du devoir :",err);
    message.textContent="L’envoi a échoué. Vérifiez le bucket Storage « devoirs », les autorisations et les colonnes de la table devoirs_remis.";
  }finally{
    if(button){button.disabled=false;button.textContent="Envoyer mon devoir";}
  }
}

// Téléchargement robuste des certificats (images ou PDF hébergés sur Supabase).
document.addEventListener("click", async (event) => {
  const link = event.target.closest("a.certificate-download");
  if (!link) return;
  event.preventDefault();
  const url = link.dataset.url || link.href;
  const originalText = link.textContent;
  link.textContent = "Préparation du téléchargement…";
  link.style.pointerEvents = "none";
  try {
    const response = await fetch(url, { mode: "cors" });
    if (!response.ok) throw new Error("Le fichier n’est pas accessible (HTTP " + response.status + ").");
    const blob = await response.blob();
    const objectUrl = URL.createObjectURL(blob);
    const ext = (blob.type || "").includes("pdf") ? ".pdf" : ((blob.type || "").includes("png") ? ".png" : ((blob.type || "").includes("jpeg") ? ".jpg" : ".file"));
    const a = document.createElement("a");
    a.href = objectUrl;
    a.download = (link.dataset.name || "certificat") + ext;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(objectUrl), 1500);
    link.textContent = "Téléchargement lancé";
  } catch (error) {
    console.error("Téléchargement du certificat :", error);
    // Fallback : ouvrir le fichier directement pour que l’élève puisse l’enregistrer.
    window.open(url, "_blank", "noopener");
    link.textContent = "Ouvrir le certificat";
  } finally {
    setTimeout(() => { link.textContent = originalText; link.style.pointerEvents = ""; }, 2500);
  }
});

async function chargerCertificats(studentId){
  const container = document.getElementById("certificatesContainer");
  try{
    const {data,error} = await supabaseClient.from("certificats")
      .select("*")
      .eq("eleve_id",studentId)
      .order("created_at",{ascending:false});
    if(error) throw error;
    const certificates = data || [];
    document.getElementById("certificateCount").textContent=String(certificates.length);
    if(!certificates.length){
      container.className="empty";
      container.textContent="Aucun certificat n’est encore disponible. Il apparaîtra ici dès que l’administration l’aura ajouté.";
      return;
    }
    container.className="certificate-grid";
    container.innerHTML=certificates.map(c=>{
      const url = c.fichier_url || c.photo_url || c.image_url || "";
      return `<article class="certificate-card">
        <h3>${escapeHtml(c.titre || c.nom || "Certificat de formation")}</h3>
        ${url ? `${/\.(pdf)(\?|$)/i.test(url) ? '<div class="notice-box">Document PDF prêt à être téléchargé.</div>' : `<img src="${escapeHtml(url)}" alt="${escapeHtml(c.titre || "Certificat")}" loading="lazy" onerror="this.style.display='none'">`}<a href="${escapeHtml(url)}" class="certificate-download" data-url="${escapeHtml(url)}" data-name="${escapeHtml((c.titre || c.nom || "certificat").replace(/[^a-z0-9_-]+/gi,"-") )}" target="_blank" rel="noopener">Télécharger mon certificat</a>` : '<div class="notice-box">Le certificat est enregistré, mais son fichier n’est pas encore disponible.</div>'}
        <p class="upload-note">Ajouté le ${formatDateFr(c.created_at)}</p>
      </article>`;
    }).join("");
  }catch(err){
    console.error("Chargement des certificats :",err);
    document.getElementById("certificateCount").textContent="—";
    container.className="";
    container.innerHTML='<div class="notice-box error-note">Les certificats ne peuvent pas être chargés. Vérifiez la table « certificats » et les autorisations Supabase.</div>';
  }
}

async function chargerMessages(){

  const container =
    document.getElementById("messageContainer");


  try{

    const { data, error } =
      await supabaseClient
      .from("messages")
      .select("*")
      .in(
        "audience",
        ["all","students"]
      )
      .order(
        "created_at",
        {
          ascending:false
        }
      );


    if(error){

      console.error(error);

      return;
    }


    if(!data || data.length === 0){

      return;
    }


    container.innerHTML =
      data
      .map(message => `

        <div class="message">

          <strong>
            Message de l'administration
          </strong>

          <br>

          ${escapeHtml(message.message)}

        </div>

      `)
      .join("");

  }

  catch(err){

    console.error(err);

  }
}

async function copyText(encoded){

  try{

    const text =
      decodeURIComponent(encoded);

    await navigator.clipboard.writeText(text);

    alert("Copié !");

  }

  catch(e){

    alert(
      "Copie impossible sur cet appareil."
    );

  }
}

/* =========================================================
   PROTECTION HTML
   ========================================================= */

function escapeHtml(value){

  return String(value ?? "")
    .replace(
      /[&<>"']/g,
      function(m){

        return {
          "&":"&amp;",
          "<":"&lt;",
          ">":"&gt;",
          '"':"&quot;",
          "'":"&#039;"
        }[m];

      }
    );

}
