<body>

<div class="wrap">

<header class="top">
  <div class="brand"><img class="brand-logo" src="LOGO%20AKADEMI%20DIZAY.png" alt="Logo Akademi Dizay"></div>
</header>

<section id="login" class="card">

  <h2>Accès élève</h2>

  <p style="color:#777">
    Entrez votre code personnel pour voir vos formations.
  </p>

  <input
    id="code"
    type="password"
    placeholder="Code d'accès personnel"
    autocomplete="off"
  >

  <button onclick="login()">
    Accéder à mes cours
  </button>

  <div id="error" class="error"></div>

</section>


<section id="student" class="card hidden"></section>



</div>


<script>

/* =========================================================
   CONFIGURATION SUPABASE
   ========================================================= */

const SUPABASE_URL =
"https://tlkuxqojbjpycgsaqone.supabase.co";

const SUPABASE_KEY =
"sb_publishable_AaCz0QDY9858XQtbOBybZw_uXhXfloL";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =========================================================
   LOGIN ÉLÈVE
   ========================================================= */

async function login(){

  const code =
    document.getElementById("code")
    .value
    .trim();

  const error =
    document.getElementById("error");

  const loginBox =
    document.getElementById("login");

  const studentBox =
    document.getElementById("student");


  error.textContent = "";

  if(!code){

    error.textContent =
      "Veuillez entrer votre code d'accès.";

    return;
  }


  loginBox.querySelector("button").disabled = true;

  loginBox.querySelector("button").textContent =
    "Connexion...";


  try{

    /*
      Appel de la fonction SQL
      student_login(code)
    */

    const { data, error: dbError } =
      await supabaseClient.rpc(
        "student_login",
        {
          p_code: code
        }
      );


    if(dbError){

      console.error(dbError);

      error.textContent =
        "Erreur de connexion. Vérifiez la configuration Supabase.";

      return;
    }


    if (!data || data.ok !== true || !data.student) {
  throw new Error(data?.message || "Code d'accès incorrect.");
}

const student = {
  ...data.student,
  courses: data.courses || []
};

await afficherEspaceEleve(student);

  }

  catch(err){

    console.error(err);

    error.textContent =
      "Une erreur est survenue. Veuillez réessayer.";

  }

  finally{

    loginBox.querySelector("button").disabled = false;

    loginBox.querySelector("button").textContent =
      "Accéder à mes cours";

  }
}


/* =========================================================
   AFFICHER ESPACE ÉLÈVE
   ========================================================= */

async function afficherEspaceEleve(student){
  window.currentStudent = student;

  const loginBox =
    document.getElementById("login");

  const studentBox =
    document.getElementById("student");


  loginBox.classList.add("hidden");

  studentBox.classList.remove("hidden");


  studentBox.innerHTML = `

    <div class="head">

      <div>

        <span class="tag">
          ÉLÈVE
        </span>

        <h2 style="
          font-size:34px;
          margin:12px 0 3px;
        ">
          ${escapeHtml(student.nom)}
        </h2>

        <div class="student-info">
          ${escapeHtml(student.telephone || "")}
        </div>

      </div>

    </div>

    <div id="messageContainer"></div>



    <nav class="dashboard-nav" aria-label="Navigation élève">
      <a href="#student" class="active"><span class="nav-icon">▦</span><span>Accueil</span></a>
      <a href="#coursesContainer"><span class="nav-icon">▤</span><span>Cours</span></a>
      <a href="#assignmentsContainer"><span class="nav-icon">▤</span><span>Devoirs</span></a>
      <a href="#certificatesContainer"><span class="nav-icon">⇩</span><span>Certificats</span></a>
      <a href="#messageContainer"><span class="nav-icon">•••</span><span>Plus</span></a>
    </nav>

async function afficherCours(courses){

  const count = document.getElementById("courseCount");
  if(count) count.textContent = String((courses || []).length);

  const container =
    document.getElementById("coursesContainer");

  if(!courses || courses.length === 0){

    container.innerHTML = `
      <div class="empty">
        Aucune formation ne vous a encore été attribuée.
      </div>
    `;

    return;
  }

  container.className = "grid";
  container.innerHTML = '<div class="empty">Chargement des leçons…</div>';
  const studentCode = String(window.currentStudent?.code || window.currentStudent?.student_code || '');
  const cards = await Promise.all(courses.map(async course => {
    let lessons = [], lessonError = null;
    if(studentCode){
      const result = await supabaseClient.rpc('student_list_course_lessons',{p_code:studentCode,p_course_slug:course.slug});
      lessons = result.data || []; lessonError = result.error;
    }
    const lessonHtml = lessonError
      ? `<p class="hint">Les leçons intégrées ne sont pas encore disponibles. L’administrateur doit installer le SQL de la bibliothèque des cours.</p>`
      : lessons.length ? lessons.map(lesson => {
        const mediaUrl = String(lesson.media_url || '');
        const isDirectVideo = /\.(mp4|webm|ogg|mov)(?:$|[?#])/i.test(mediaUrl);
        if(lesson.is_student_locked || lesson.is_locked || !mediaUrl) return `<article class="course-lesson lesson-locked"><div class="locked-icon" aria-hidden="true">🔒</div><h4>${escapeHtml(lesson.title)} <span class="lock-label">COURS VERROUILLÉ</span></h4><p>${escapeHtml(lesson.description||'')}</p><div class="locked-notice">Cette leçon est visible, mais l’accès a été verrouillé par l’administration.</div></article>`;
        if(lesson.content_type === 'photo') return `<article class="course-lesson"><h4>${escapeHtml(lesson.title)}</h4><p>${escapeHtml(lesson.description||'')}</p><img class="course-photo" src="${escapeHtml(mediaUrl)}" alt="${escapeHtml(lesson.title)}"><button type="button" class="download-photo" data-download-url="${escapeHtml(mediaUrl)}" data-download-name="${escapeHtml((lesson.title||'photo').replace(/[^a-z0-9_-]/gi,'_'))}.${/\.png(?:$|[?#])/i.test(mediaUrl)?'png':/\.webp(?:$|[?#])/i.test(mediaUrl)?'webp':/\.gif(?:$|[?#])/i.test(mediaUrl)?'gif':'jpg'}">Télécharger la photo</button></article>`;
        const videoPlayer = isDirectVideo
          ? `<video controls playsinline webkit-playsinline preload="metadata" controlslist="nodownload" aria-label="${escapeHtml(lesson.title)}"><source src="${escapeHtml(mediaUrl)}">Votre navigateur ne peut pas lire cette vidéo.</video>`
          : `<iframe src="${escapeHtml(mediaUrl)}" title="${escapeHtml(lesson.title)}" loading="lazy" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>`;
        return `<article class="course-lesson"><h4>▶ ${escapeHtml(lesson.title)}</h4><p>${escapeHtml(lesson.description||'')}</p><div class="video-frame">${videoPlayer}<button type="button" class="video-expand" aria-label="Agrandir la vidéo" title="Agrandir la vidéo">⛶</button></div></article>`;
      }).join('') : '<p class="hint">Aucune leçon publiée pour le moment.</p>';
    return `<div class="course"><h3>${escapeHtml(course.nom||'Formation')}</h3><p>Votre formation et ses leçons sont disponibles ci-dessous.</p><div class="course-lessons"><h4>Leçons de la formation</h4>${lessonHtml}</div></div>`;
  }));
  container.innerHTML = cards.join('');
}

function studentIdOf(student){
  return student?.id ?? student?.eleve_id ?? student?.student_id ?? student?.profile_id ?? null;
}

function formatDateFr(value){
  if(!value) return "Date non précisée";
  const d = new Date(value);
  if(Number.isNaN(d.getTime())) return escapeHtml(value);
  return d.toLocaleDateString("fr-FR",{day:"2-digit",month:"long",year:"numeric"});
}

function formatTimeFr(value){
  if(!value) return "Heure non précisée";
  const match = String(value).match(/^(\d{1,2}):(\d{2})/);
  return match ? `${match[1].padStart(2,"0")}:${match[2]}` : escapeHtml(value);
}

function safeFileName(name){
  return String(name || "fichier").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-zA-Z0-9._-]/g,"_").slice(-100);
}

async function chargerTableauDeBord(student){
  const studentId = studentIdOf(student);
  const noteEl = document.getElementById("studentNote");
  const assignmentsEl = document.getElementById("assignmentsContainer");
  const certificatesEl = document.getElementById("certificatesContainer");

    assignmentsEl.innerHTML = '<div class="notice-box error-note">Impossible d’identifier votre dossier élève. La fonction student_login doit renvoyer l’identifiant de l’élève dans le champ id.</div>';
    certificatesEl.innerHTML = '<div class="empty">Votre identifiant élève est nécessaire pour charger vos certificats.</div>';
    return;
  }
  await Promise.all([
    chargerNote(studentId, student),
    chargerDevoirs(studentId, student.code),
    chargerCertificats(studentId)
  ]);
}

async function chargerNote(studentId, student){
  const noteEl = document.getElementById("studentNote");
  const noteDirecte = student.note_sur_100 ?? student.note ?? student.notes;
  if(noteDirecte !== undefined && noteDirecte !== null && noteDirecte !== ""){
    const n = Number(noteDirecte);
    noteEl.innerHTML = `${Number.isFinite(n) ? escapeHtml(n) : "—"}<span style="font-size:15px;color:#777"> / 100</span>`;
    return;
  }
  try{
    const {data,error} = await supabaseClient.from("notes")
      .select("note_sur_100, note, created_at")
      .eq("eleve_id",studentId)
      .order("created_at",{ascending:false})
      .limit(1);
    if(error) throw error;
    const value = data?.[0]?.note_sur_100 ?? data?.[0]?.note;
    noteEl.innerHTML = `${value !== undefined && value !== null ? escapeHtml(value) : "—"}<span style="font-size:15px;color:#777"> / 100</span>`;
  }catch(err){
    console.warn("Chargement de la note :",err.message || err);
    noteEl.innerHTML = `—<span style="font-size:15px;color:#777"> / 100</span>`;
  }
}

async function chargerDevoirs(studentId, studentCode){
  const container = document.getElementById("assignmentsContainer");
  try{
    if(!studentCode){
      container.className="empty";
      container.textContent="Impossible d’identifier votre code élève pour afficher vos devoirs personnels. Contactez l’administrateur.";
      return;
    }
    const [{data:devoirs,error:devoirsError},{data:remises,error:remisesError}] = await Promise.all([
      // IMPORTANT : ne charger que les devoirs affectés à ce code élève.
      supabaseClient.from("devoirs").select("*").eq("publie",true).eq("student_code",String(studentCode)).order("date_limite",{ascending:true}),
      supabaseClient.from("devoirs_remis").select("*").eq("eleve_id",studentId).order("created_at",{ascending:false})
    ]);
    if(devoirsError) throw devoirsError;
    if(remisesError) throw remisesError;
    if(!devoirs || devoirs.length===0){
      container.className="empty";
      container.textContent="Aucun devoir n’a été publié pour le moment.";
      return;
    }
    const remisParDevoir = new Map((remises||[]).map(r=>[String(r.devoir_id),r]));
    // Évite d’afficher plusieurs fois le même devoir si la base contient des doublons.
    // Priorité à la ligne pour laquelle l’élève a déjà remis un fichier.
    const devoirsUniques = [];
    const indexParCle = new Map();
    for (const d of devoirs) {
      // Les copies synchronisées peuvent avoir des IDs, dates ou champs techniques différents.
      // Pour l’affichage, un même titre normalisé ne doit apparaître qu’une fois.
      const titreCle = String(d.titre || d.nom || "devoir sans titre")
        .normalize("NFD").replace(/[\\u0300-\\u036f]/g, "")
        .trim().toLowerCase().replace(/\\s+/g, " ");
      const cle = titreCle;
      if (!indexParCle.has(cle)) {
        indexParCle.set(cle, devoirsUniques.length);
        devoirsUniques.push(d);
      } else {
        const idx = indexParCle.get(cle);
        const actuel = devoirsUniques[idx];
        // Garder en priorité le devoir auquel l’élève a déjà remis un fichier.
        if (!remisParDevoir.has(String(actuel.id)) && remisParDevoir.has(String(d.id))) {
          devoirsUniques[idx] = d;
        } else if (String(d.description || d.consignes || "").length > String(actuel.description || actuel.consignes || "").length) {
          // Si aucun devoir n’a été remis, conserver la fiche la plus complète.
          if (!remisParDevoir.has(String(actuel.id))) devoirsUniques[idx] = d;
        }
      }
    }
    container.className="assignment-list";
    container.innerHTML = devoirsUniques.map(d=>{
      const remise = remisParDevoir.get(String(d.id));
      const deadline = d.date_limite ? new Date(`${String(d.date_limite).slice(0,10)}T${String(d.heure_limite||"23:59:00").slice(0,8)}`) : null;
      const enRetard = !remise && deadline && !Number.isNaN(deadline.getTime()) && deadline < new Date();
      const status = remise ? '<span class="status-pill done">Devoir envoyé</span>' : enRetard ? '<span class="status-pill late">Date limite dépassée</span>' : '<span class="status-pill open">À remettre</span>';
      const description = d.description || d.consignes || "Aucune description n’a été ajoutée pour ce devoir.";
      const remiseUrl = remise?.fichier_url || remise?.photo_url || "";
      return `<article class="assignment-card">
        <div class="assignment-top"><h3>${escapeHtml(d.titre || d.nom || "Devoir sans titre")}</h3>${status}</div>
        <div class="assignment-description">${escapeHtml(description)}</div>
        <div class="deadline"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><div><strong>Date limite :</strong> ${formatDateFr(d.date_limite)}<br><strong>Heure limite :</strong> ${formatTimeFr(d.heure_limite)}</div></div>
        ${remiseUrl ? `<p class="upload-note">Votre fichier a été envoyé. <a href="${escapeHtml(remiseUrl)}" target="_blank" rel="noopener">Voir le devoir envoyé</a></p>` : `
          <div class="upload-area">
            <label for="devoir-file-${escapeHtml(d.id)}">Photo ou fichier du devoir</label>
            <input id="devoir-file-${escapeHtml(d.id)}" type="file" accept="image/*,.pdf" multiple />
            <p class="upload-note">Vous pouvez sélectionner plusieurs photos et/ou PDF en une seule fois. Chaque fichier sera envoyé séparément (10 Mo maximum par fichier).</p>
            <button type="button" onclick="envoyerDevoir('${encodeURIComponent(String(d.id))}','${encodeURIComponent(String(studentId))}')">Envoyer mes fichiers</button>
            <div id="devoir-msg-${escapeHtml(d.id)}" class="upload-note" aria-live="polite"></div>
          </div>`}
      </article>`;
    }).join("");
  }catch(err){
    console.error("Chargement des devoirs :",err);
    container.className="";
    container.innerHTML='<div class="notice-box error-note">Les devoirs ne peuvent pas être chargés. Vérifiez que les tables « devoirs » et « devoirs_remis » existent et que leurs autorisations Supabase sont configurées.</div>';
  }
}

async function envoyerDevoir(encodedDevoirId,encodedStudentId){
  const devoirId = decodeURIComponent(encodedDevoirId);
  const studentId = decodeURIComponent(encodedStudentId);
  const input = document.getElementById(`devoir-file-${devoirId}`);
  const message = document.getElementById(`devoir-msg-${devoirId}`);
  const button = input?.closest(".upload-area")?.querySelector("button");
  const files = Array.from(input?.files || []);
  if(!files.length){ message.textContent="Veuillez sélectionner au moins un fichier."; return; }
  const invalid = files.find(file => file.size > 10*1024*1024 || !(file.type.startsWith("image/") || file.type==="application/pdf"));
  if(invalid){ message.textContent = invalid.size > 10*1024*1024 ? `« ${invalid.name} » dépasse 10 Mo.` : `« ${invalid.name} » n’est pas une image ou un PDF.`; return; }
  if(button){button.disabled=true;button.textContent="Envoi en cours…";}
  let sent = 0;
  try{
    for (const file of files) {
      message.textContent=`Envoi du fichier ${sent+1} sur ${files.length} : ${file.name}`;
      const path = `${studentId}/${devoirId}/${Date.now()}-${Math.random().toString(36).slice(2,8)}-${safeFileName(file.name)}`;
      const {data:uploadData,error:uploadError} = await supabaseClient.storage.from("devoirs").upload(path,file,{upsert:false,contentType:file.type});
      if(uploadError) throw uploadError;
      const {data:urlData} = supabaseClient.storage.from("devoirs").getPublicUrl(uploadData.path);
      const fichierUrl = urlData?.publicUrl;
      const {error:insertError} = await supabaseClient.from("devoirs_remis").insert({
        devoir_id:devoirId, eleve_id:studentId, fichier_url:fichierUrl,
        nom_fichier:file.name, statut:"remis"
      });
      if(insertError) throw insertError;
      sent++;
    }
    message.textContent=`Succès : ${sent} fichier(s) envoyé(s).`;
    await chargerDevoirs(studentId, window.currentStudent?.code || window.studentSession?.code || document.getElementById("studentCode")?.value?.trim());
  }catch(err){
    console.error("Envoi du devoir :",err);
    message.textContent = sent ? `${sent} fichier(s) envoyé(s), mais un autre envoi a échoué. Relancez pour les fichiers restants.` : "L’envoi a échoué. Vérifiez le bucket Storage « devoirs », les autorisations et les colonnes de la table devoirs_remis.";
  }finally{
    if(button){button.disabled=false;button.textContent="Envoyer mes fichiers";}
  }
}

// Téléchargement robuste des certificats (images ou PDF hébergés sur Supabase).
document.addEventListener("click", async (event) => {
  const link = event.target.closest("a.certificate-download");
  if (!link) return;
  event.preventDefault();
  const url = link.dataset.url || link.href;
  const originalText = link.textContent;
  link.textContent = "Préparation du téléchargement…";
  link.style.pointerEvents = "none";
  try {
    const response = await fetch(url, { mode: "cors" });
    if (!response.ok) throw new Error("Le fichier n’est pas accessible (HTTP " + response.status + ").");
    const blob = await response.blob();
    const objectUrl = URL.createObjectURL(blob);
    const ext = (blob.type || "").includes("pdf") ? ".pdf" : ((blob.type || "").includes("png") ? ".png" : ((blob.type || "").includes("jpeg") ? ".jpg" : ".file"));
    const a = document.createElement("a");
    a.href = objectUrl;
    a.download = (link.dataset.name || "certificat") + ext;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(objectUrl), 1500);
    link.textContent = "Téléchargement lancé";
  } catch (error) {
    console.error("Téléchargement du certificat :", error);
    // Fallback : ouvrir le fichier directement pour que l’élève puisse l’enregistrer.
    window.open(url, "_blank", "noopener");
    link.textContent = "Ouvrir le certificat";
  } finally {
    setTimeout(() => { link.textContent = originalText; link.style.pointerEvents = ""; }, 2500);
  }
});

function escapeHtml(value){

  return String(value ?? "")
    .replace(
      /[&<>"']/g,
      function(m){

        return {
          "&":"&amp;",
          "<":"&lt;",
          ">":"&gt;",
          '"':"&quot;",
          "'":"&#039;"
        }[m];

      }
    );

}

/* Bouton d’agrandissement : passe le lecteur entier en plein écran */
document.addEventListener('click', async function(event){
  const button = event.target.closest('.video-expand');
  if(!button) return;
  const frame = button.closest('.video-frame');
  if(!frame) return;
  try {
    if(document.fullscreenElement === frame || document.webkitFullscreenElement === frame){
      if(document.exitFullscreen) await document.exitFullscreen();
      else if(document.webkitExitFullscreen) document.webkitExitFullscreen();
    } else {
      const video = frame.querySelector('video');
      const iframe = frame.querySelector('iframe');
      // Native video fullscreen on iPhone; iframe/player fullscreen when supported.
      if(video && video.webkitEnterFullscreen) {
        video.webkitEnterFullscreen();
      } else if(frame.requestFullscreen) {
        await frame.requestFullscreen();
      } else if(frame.webkitRequestFullscreen) {
        frame.webkitRequestFullscreen();
      } else if(iframe && iframe.requestFullscreen) {
        await iframe.requestFullscreen();
      } else if(iframe && iframe.webkitRequestFullscreen) {
        iframe.webkitRequestFullscreen();
      }
    }
  } catch(error) {
    const video = frame.querySelector('video');
    const iframe = frame.querySelector('iframe');
    try {
      if(video && video.webkitEnterFullscreen) video.webkitEnterFullscreen();
      else if(iframe && iframe.requestFullscreen) await iframe.requestFullscreen();
      else if(frame.requestFullscreen) await frame.requestFullscreen();
    } catch (_) { /* Le navigateur peut bloquer le plein écran intégré. */ }
  }
});

document.addEventListener('click', async function(event){
  const button = event.target.closest('.download-photo[data-download-url]');
  if(!button) return;
  const url = button.getAttribute('data-download-url');
  const filename = button.getAttribute('data-download-name') || 'photo.jpg';
  const originalText = button.textContent;
  button.disabled = true;
  button.textContent = 'Téléchargement…';
  try {
    const response = await fetch(url, {mode:'cors'});
    if(!response.ok) throw new Error('Téléchargement impossible');
    const blob = await response.blob();
    const objectUrl = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = objectUrl; a.download = filename; a.style.display = 'none';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(objectUrl), 1500);
  } catch(error) {
    // Fallback: ouvre la ressource si le stockage distant bloque CORS.
    const a = document.createElement('a');
    a.href = url; a.download = filename; a.target = '_blank'; a.rel = 'noopener';
    document.body.appendChild(a); a.click(); a.remove();
  } finally {
    button.disabled = false; button.textContent = originalText;
  }
});
</script>
