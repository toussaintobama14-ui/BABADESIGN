<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mes commandes | Baba Design</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;font-family:Arial,sans-serif;background:#f7f7f7;color:#111}.wrap{max-width:900px;margin:auto;padding:22px}.top{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.btn{padding:11px 15px;border-radius:12px;text-decoration:none;background:#111;color:#fff;font-weight:800}.card{background:#fff;border:1px solid #eee;border-radius:22px;padding:24px;box-shadow:0 10px 30px #0001}.order{padding:16px 0;border-bottom:1px solid #eee}.order:last-child{border:0}.status{display:inline-block;padding:6px 10px;border-radius:20px;background:#eee;font-size:12px;font-weight:800}</style></head><body><main class="wrap"><div class="top"><a class="btn" href="index_fixed.html">Accueil</a><a class="btn" href="compte.html">Mon espace</a><a class="btn" href="solde.html">Solde</a></div><section class="card"><h1>Mes commandes</h1><p>Suivez ici toutes vos demandes de services et publicité.</p><div id="orders">Chargement…</div></section></main><script>const sb=supabase.createClient('https://lfihazvagywraxhbjcqr.supabase.co','sb_publishable_IbhpDt8dvcHZOuxy17uGzQ_YaqUHIpm');async function load(){const {data:{user}}=await sb.auth.getUser();if(!user){location.href='compte.html';return}const {data,error}=await sb.from('orders').select('*').eq('user_id',user.id).order('created_at',{ascending:false});if(error){document.getElementById('orders').textContent=error.message;return}document.getElementById('orders').innerHTML=(data||[]).map(o=>`<div class="order"><h3>${o.service_name||'Commande'}</h3><span class="status">${o.status||'pending'}</span><p>${o.custom_service||''}</p><small>${new Date(o.created_at).toLocaleString('fr-FR')}</small>${o.controller_note?`<p><b>Contrôleur :</b> ${o.controller_note}</p>`:''}</div>`).join('')||'Aucune commande pour le moment.'}load();</script></body></html>
