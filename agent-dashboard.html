<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Espace Agent — Akademi Dizay</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
*{box-sizing:border-box}body{margin:0;font-family:Montserrat;background:#f6f6f6;color:#111}header{background:#111;color:#fff;padding:22px}.inner,main{max-width:1100px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center}.card{background:#fff;padding:24px;border-radius:20px;margin:20px 0;box-shadow:0 10px 30px #0001}.code{font-size:22px;font-weight:900;background:#f0f0f0;padding:14px;border-radius:12px;display:inline-block}.student{padding:15px;border:1px solid #ddd;border-radius:14px;margin:10px 0}button{padding:11px 15px;border:0;border-radius:10px;font-weight:800;cursor:pointer}@media(max-width:650px){.top{flex-direction:column;align-items:flex-start;gap:15px}}
</style></head><body><header><div class="inner top"><div><h2>Akademi Dizay — Agent</h2><div id="name">Chargement...</div></div><button onclick="logout()">Déconnexion</button></div></header><main><div class="card"><h2>Mon ID de parrainage</h2><div class="code" id="ref">Chargement...</div><p>Partagez cet ID aux personnes que vous parrainez.</p></div><div class="card"><h2>Personnes référées</h2><div id="refs">Chargement...</div></div></main><script>
const SUPABASE_URL="https://nuiubkbmwnkswugkyhvx.supabase.co",SUPABASE_KEY="sb_publishable_dFBjGdzxPDRkS-Ldb-YVLA_WeG9IqGy";const{createClient}=supabase;const db=createClient(SUPABASE_URL,SUPABASE_KEY);
async function load(){const{data:{user}}=await db.auth.getUser();if(!user){location.href='login.html';return}const{data:p}=await db.from('profiles').select('full_name,role').eq('id',user.id).single();if(p?.role!=='agent'){alert('Votre compte agent doit être validé par l’administration.');location.href='student-dashboard.html';return}document.getElementById('name').textContent=`Bonjour ${p.full_name||''}`;const{data:a}=await db.from('agents').select('referral_code').eq('user_id',user.id).single();document.getElementById('ref').textContent=a?.referral_code||'Non attribué';const{data:r}=await db.from('referrals').select('created_at,formations(name),profiles(full_name,email,phone)').eq('agent_id',a?.id).order('created_at',{ascending:false});document.getElementById('refs').innerHTML=r?.length?r.map(x=>`<div class="student"><strong>${esc(x.profiles?.full_name||'')}</strong><br>${esc(x.profiles?.email||'')}<br>${esc(x.profiles?.phone||'')}<br>Formation: ${esc(x.formations?.name||'')}</div>`).join(''):'<p>Aucune personne référée pour le moment.</p>'}function esc(v){return String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}async function logout(){await db.auth.signOut();location.href='login.html'}load();
</script></body></html>
